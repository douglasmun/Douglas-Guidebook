m:6px\">On v4<\u002Fdiv>\n        <p style=\"font-size:14px;line-height:1.5;margin:0 0 8px\">No obvious way to destabilise or take control; another approach, outside that paper's scope, may involve a cluster of rogue super peers.<\u002Fp>\n        <p style=\"font-size:13px;line-height:1.45;margin:0;color:#0088b0\">→ what CrowdStrike built, fifteen years later<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:15px;line-height:1.6;margin:0 0 6px;max-width:38em\"><strong>[F, High]<\u002Fstrong> that Falliere wrote this. <strong>[A, Moderate]<\u002Fstrong> that it constitutes prediction rather than coincidence — the space of possible attacks on a P2P overlay is small, and both observations follow from the architecture.<\u002Fp>\n\n    <h3 style=\"font-size:20px;margin:28px 0 10px\">6.3 The eviction primitive — still undisclosed<\u002Fh3>\n    <p style=\"font-size:15.5px;line-height:1.6;margin:0 0 12px;max-width:38em\">This is the one substantive gap the primary source does not close. <strong>[F, High]<\u002Fstrong> CrowdStrike's entire technical statement on the mechanism is that protocol-level manipulation during peer verification allows legitimate super-peer entries to be invalidated. No packet field, no state-machine edge case, no request/response sequence. The withholding is deliberate and reasonable — publishing it would hand the same primitive to anyone wanting to hijack rather than sinkhole the network.<\u002Fp>\n    <p style=\"font-size:15.5px;line-height:1.6;margin:0 0 6px;max-width:38em\">The strongest published candidate reconciles two sources that look contradictory but are not: Falliere frames a behaviour as a <em>defence<\u002Fem>, and P2PWNED frames the identical behaviour as an <em>attack<\u002Fem>.<\u002Fp>\n\n    <figure style=\"margin:22px 0 26px\">\n      <div style=\"border-top:2px solid #201e1d;padding-top:9px\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0\">Exhibit 14<\u002Fdiv>\n        <div style=\"font-size:17px;margin:2px 0 14px\">The asymmetry between the two commands — one respects goodcount, one bypasses it<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:2px\">\n        <div style=\"background:#eae7e7;padding:12px 14px\">\n          <div style=\"font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#605d5d;margin-bottom:6px\">Peer Exchange &nbsp;cmd 2<\u002Fdiv>\n          <div style=\"font-size:15px;margin-bottom:8px\">Send (good IP, junk port)<\u002Fdiv>\n          <div style=\"font-size:13px;line-height:1.5;color:#444141\">The old port is <strong>kept<\u002Fstrong>. The entry survives. Goodcount must be beaten first, and it cannot be claimed remotely.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#ffdee6;padding:12px 14px\">\n          <div style=\"font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#790e3d;margin-bottom:6px\">Announcement &amp; Promotion &nbsp;cmd 1<\u002Fdiv>\n          <div style=\"font-size:15px;margin-bottom:8px;color:#790e3d\">Spoof source IP to match the target, send from a different port<\u002Fdiv>\n          <div style=\"font-size:13px;line-height:1.5;color:#790e3d\">The old port is <strong>overwritten<\u002Fstrong>. The entry now points nowhere. <strong>Goodcount is bypassed entirely.<\u002Fstrong><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:2px\">\n        <div style=\"border-top:2px solid #7d7979;padding:9px 14px;font-size:12.5px;color:#605d5d\">Not an eviction primitive<\u002Fdiv>\n        <div style=\"border-top:2px solid #d6006c;padding:9px 14px;font-size:12.5px;color:#790e3d\"><strong>The eviction primitive<\u002Fstrong><\u002Fdiv>\n      <\u002Fdiv>\n      <figcaption style=\"font-size:10.5px;color:#7d7979;border-top:1px solid #d7d3d3;padding-top:7px;margin-top:14px\">Falliere 2011 (framing it as a defence: a rogue peer cannot insert two coordinates for one IP, because the old port is replaced by the new one; existing coordinates are only overwritten when goodcount is negative) reconciled with P2PWNED 2013, Werner co-author (framing the same behaviour as the one weakness found).<\u002Ffigcaption>\n    <\u002Ffigure>\n\n    <sc-raw-table class=\"table\" style=\"font-size:13.5px;margin-bottom:18px\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th>Claim<\u002Fsc-raw-th><sc-raw-th style=\"width:52px\">Type<\u002Fsc-raw-th><sc-raw-th style=\"width:26%\">Confidence<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td>This primitive exists in the protocol and is documented in the public literature<\u002Fsc-raw-td><sc-raw-td>[F]<\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fadfda;color:#7d2018\">High<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>It defeats goodcount, which is the control that made Sality resilient<\u002Fsc-raw-td><sc-raw-td>[F]<\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fadfda;color:#7d2018\">High<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Its NAT limitation matches the two-phase shape of the 2026 operation<\u002Fsc-raw-td><sc-raw-td>[A]<\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fbe6cd;color:#7a4a13\">Moderate<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><strong>It is the primitive CrowdStrike actually used<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>[A]<\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fbeec2;color:#6e5307\">Low<\u002Fspan><div style=\"font-size:11.5px;color:#605d5d;margin-top:4px\">A 13-year-old finding mapped onto an undisclosed 2026 technique. Werner's co-authorship is suggestive, not evidential. Alternatives: an unpublished state-machine flaw, an implementation bug in specific builds, or a composite of several primitives<\u002Fdiv><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n\n    <div class=\"keep\" style=\"margin:20px 0 0;padding-top:12px;border-top:1px solid #d6006c;max-width:38em\">\n      <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#d6006c;margin-bottom:6px\">Publication instruction<\u002Fdiv>\n      <p style=\"font-size:14.5px;line-height:1.55;margin:0\">Label this in any management paper as <em>implementation detail not publicly disclosed as of 2 September 2026<\u002Fem>, and present the hypothesis as a hypothesis. Do not let it harden into fact through repetition — that is exactly how the \"unsigned payloads\" error at 6.1 propagated.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"break-before:page\">\n    <div style=\"font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0;margin-bottom:8px\">Section 07<\u002Fdiv>\n    <h2 style=\"font-size:32px;margin:0 0 18px;padding-bottom:12px;border-bottom:2px solid #201e1d\">The disruption operation<\u002Fh2>\n    <p style=\"font-size:16px;line-height:1.5;margin:0 0 16px;max-width:36em\">Executed Monday 31 August 2026, announced 1 September. <strong>[F, High — two independent sources.]<\u002Fstrong> Partners: DOJ, FBI, DCIS — the Department of Defense Office of Inspector General's Defense Criminal Investigative Service — the Shadowserver Foundation, with support from Europol and Eurojust and law enforcement in Bulgaria, Hungary and Romania, plus unnamed additional partners.<\u002Fp>\n\n    <sc-raw-table class=\"table\" style=\"font-size:13.5px;margin-bottom:26px\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:34%\">Role<\u002Fsc-raw-th><sc-raw-th>Entity or individual, per DOJ &nbsp;<span style=\"font-weight:400;text-transform:none;letter-spacing:0\">[F, High]<\u002Fspan><\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td>US prosecution lead<\u002Fsc-raw-td><sc-raw-td>AUSA <strong>Lauren Restrepo<\u002Fstrong>, National Security Division, Central District of California<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>US Attorney's Office<\u002Fsc-raw-td><sc-raw-td>First Assistant US Attorney <strong>Bill Essayli<\u002Fstrong>, Central District of California<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>FBI<\u002Fsc-raw-td><sc-raw-td><strong>Patrick Grandy<\u002Fstrong>, Assistant Director in Charge, Los Angeles Field Office<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>DCIS<\u002Fsc-raw-td><sc-raw-td>SAC <strong>Kenneth DeChellis<\u002Fstrong>, DoD OIG Defense Criminal Investigative Service, Cyber Field Office<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Bulgaria<\u002Fsc-raw-td><sc-raw-td>General Directorate Combating Organized Crime<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Hungary<\u002Fsc-raw-td><sc-raw-td>National Bureau of Investigation, Cybercrime Department<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Romania<\u002Fsc-raw-td><sc-raw-td>Romanian Police / Directorate for Combating Organized Crime / Central Cybercrime Unit<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>European Union<\u002Fsc-raw-td><sc-raw-td>Eurojust, Europol<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>US international<\u002Fsc-raw-td><sc-raw-td>DOJ Office of International Affairs<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n\n    <h3 style=\"font-size:20px;margin:26px 0 10px\">7.1 The operation in one picture<\u002Fh3>\n    <figure style=\"margin:18px 0 30px\" data-om-raster=\"\">\n      <div style=\"border-top:2px solid #201e1d;padding-top:9px\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0\">Exhibit 15<\u002Fdiv>\n        <div style=\"font-size:17px;margin:2px 0 14px\">Two moves, executed inside the malware's own maintenance cycle<\u002Fdiv>\n      <\u002Fdiv>\n      <svg sc-camel-view-box=\"0 0 700 250\" style=\"width:100%;height:auto;font-family:'Source Serif 4',serif\">\n        <defs>\n          <marker id=\"sal-ah4\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"8\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"7\" sc-camel-marker-height=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 1 L 9 5 L 0 9 z\" fill=\"#201e1d\"><\u002Fpath><\u002Fmarker>\n          <marker id=\"sal-ah4m\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"8\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"7\" sc-camel-marker-height=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 1 L 9 5 L 0 9 z\" fill=\"#d6006c\"><\u002Fpath><\u002Fmarker>\n        <\u002Fdefs>\n        <rect x=\"0\" y=\"20\" width=\"180\" height=\"54\" fill=\"#f3f2f2\" stroke=\"#201e1d\" stroke-width=\"1.5\"><\u002Frect>\n        <text x=\"90\" y=\"43\" font-size=\"13\" fill=\"#201e1d\" text-anchor=\"middle\">Compromised bot<\u002Ftext>\n        <text x=\"90\" y=\"60\" font-size=\"10.5\" fill=\"#605d5d\" text-anchor=\"middle\">running the 40-minute cycle<\u002Ftext>\n        <path d=\"M 180 47 L 300 47\" stroke=\"#201e1d\" stroke-width=\"1.4\" marker-end=\"url(#sal-ah4)\"><\u002Fpath>\n        <text x=\"188\" y=\"39\" font-size=\"10.5\" fill=\"#605d5d\">1 · peer verification<\u002Ftext>\n        <rect x=\"302\" y=\"20\" width=\"230\" height=\"54\" fill=\"#cbeeff\" stroke=\"#0088b0\" stroke-width=\"1.8\"><\u002Frect>\n        <text x=\"417\" y=\"43\" font-size=\"13\" fill=\"#004961\" text-anchor=\"middle\">Sality protocol manipulation<\u002Ftext>\n        <text x=\"417\" y=\"60\" font-size=\"10.5\" fill=\"#006786\" text-anchor=\"middle\">mechanism undisclosed — see 6.3<\u002Ftext>\n        <path d=\"M 417 74 L 417 108\" stroke=\"#d6006c\" stroke-width=\"1.6\" marker-end=\"url(#sal-ah4m)\"><\u002Fpath>\n        <rect x=\"302\" y=\"110\" width=\"230\" height=\"46\" fill=\"#ffdee6\"><\u002Frect>\n        <text x=\"417\" y=\"130\" font-size=\"12.5\" fill=\"#790e3d\" text-anchor=\"middle\">Legitimate super-peer entries<\u002Ftext>\n        <text x=\"417\" y=\"147\" font-size=\"12.5\" fill=\"#790e3d\" text-anchor=\"middle\">invalidated and purged<\u002Ftext>\n        <path d=\"M 417 156 L 417 186\" stroke=\"#201e1d\" stroke-width=\"1.4\" marker-end=\"url(#sal-ah4)\"><\u002Fpath>\n        <rect x=\"302\" y=\"188\" width=\"230\" height=\"46\" fill=\"#201e1d\"><\u002Frect>\n        <text x=\"417\" y=\"209\" font-size=\"12.5\" fill=\"#f3f2f2\" text-anchor=\"middle\">Sinkhole entries inserted<\u002Ftext>\n        <text x=\"417\" y=\"226\" font-size=\"10.5\" fill=\"#bab6b6\" text-anchor=\"middle\">into the emptied peer lists<\u002Ftext>\n        <path d=\"M 300 211 L 182 211\" stroke=\"#201e1d\" stroke-width=\"1.4\" marker-end=\"url(#sal-ah4)\"><\u002Fpath>\n        <text x=\"188\" y=\"203\" font-size=\"10.5\" fill=\"#605d5d\">2 · sinkhole injection<\u002Ftext>\n        <rect x=\"0\" y=\"188\" width=\"180\" height=\"46\" fill=\"#eae7e7\" stroke=\"#d6006c\" stroke-width=\"1.5\"><\u002Frect>\n        <text x=\"90\" y=\"209\" font-size=\"13\" fill=\"#201e1d\" text-anchor=\"middle\">Isolated bot<\u002Ftext>\n        <text x=\"90\" y=\"226\" font-size=\"10.5\" fill=\"#790e3d\" text-anchor=\"middle\">still infected, no longer taskable<\u002Ftext>\n        <path d=\"M 90 74 L 90 186\" stroke=\"#7d7979\" stroke-width=\"1\" stroke-dasharray=\"4 3\"><\u002Fpath>\n        <text x=\"0\" y=\"110\" font-size=\"10.5\" fill=\"#605d5d\">the same<\u002Ftext>\n        <text x=\"0\" y=\"124\" font-size=\"10.5\" fill=\"#605d5d\">machine,<\u002Ftext>\n        <text x=\"0\" y=\"138\" font-size=\"10.5\" fill=\"#605d5d\">40 minutes<\u002Ftext>\n        <text x=\"0\" y=\"152\" font-size=\"10.5\" fill=\"#605d5d\">later<\u002Ftext>\n      <\u002Fsvg>\n      <figcaption style=\"font-size:10.5px;color:#7d7979;border-top:1px solid #d7d3d3;padding-top:7px;margin-top:12px\">Serving two purposes at once: the sinkhole entries give visibility into operation progress and enable infection tracking and victim notification. [F, High]<\u002Ffigcaption>\n    <\u002Ffigure>\n\n    <h3 style=\"font-size:20px;margin:26px 0 10px\">7.2 Stage one — infiltrate the overlay<\u002Fh3>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:0 0 18px\">\n      <div style=\"background:#eae7e7;padding:14px 16px\">\n        <div style=\"font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#605d5d;margin-bottom:8px\">What the bot concluded<\u002Fdiv>\n        <p style=\"font-size:15px;line-height:1.5;font-style:italic;margin:0\">\"The protocol is correct, the endpoint is reachable, therefore this is another peer.\"<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding-top:12px;border-top:2px solid #0088b0\">\n        <p style=\"font-size:14.5px;line-height:1.55;margin:0\">Required full protocol emulation for <strong>both<\u002Fstrong> v3 and v4 — two independent implementations, two key ecosystems, no shared code path. This is the cost that makes the technique hard to replicate, not the primitive.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"font-size:20px;margin:26px 0 10px\">7.3 Stage two — invert the peer table<\u002Fh3>\n    <figure style=\"margin:18px 0 28px\">\n      <div style=\"border-top:2px solid #201e1d;padding-top:9px\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0\">Exhibit 16<\u002Fdiv>\n        <div style=\"font-size:17px;margin:2px 0 14px\">One bot's peer table, before and after<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:26px\">\n        <div>\n          <div style=\"font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#605d5d;margin-bottom:8px\">Before<\u002Fdiv>\n          <div style=\"font-size:13.5px;font-family:ui-monospace,Menlo,monospace\">\n            <div style=\"padding:6px 10px;background:#eae7e7;border-bottom:1px solid #f3f2f2\">Sality A<\u002Fdiv>\n            <div style=\"padding:6px 10px;background:#eae7e7;border-bottom:1px solid #f3f2f2\">Sality B<\u002Fdiv>\n            <div style=\"padding:6px 10px;background:#eae7e7;border-bottom:1px solid #f3f2f2\">Sality C<\u002Fdiv>\n            <div style=\"padding:6px 10px;background:#eae7e7;border-bottom:1px solid #f3f2f2\">Sality D<\u002Fdiv>\n            <div style=\"padding:6px 10px;background:#eae7e7\">Sality E<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:12px;padding-top:9px;border-top:2px solid #0088b0;font-size:13.5px;color:#006786\">Operator tasking propagates<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#790e3d;margin-bottom:8px\">After poisoning<\u002Fdiv>\n          <div style=\"font-size:13.5px;font-family:ui-monospace,Menlo,monospace\">\n            <div style=\"padding:6px 10px;background:#ffdee6;border-bottom:1px solid #f3f2f2;color:#790e3d\">Sinkhole 1<\u002Fdiv>\n            <div style=\"padding:6px 10px;background:#ffdee6;border-bottom:1px solid #f3f2f2;color:#790e3d\">Sinkhole 2<\u002Fdiv>\n            <div style=\"padding:6px 10px;background:#ffdee6;border-bottom:1px solid #f3f2f2;color:#790e3d\">Sinkhole 3<\u002Fdiv>\n            <div style=\"padding:6px 10px;background:#ffdee6;border-bottom:1px solid #f3f2f2;color:#790e3d\">Sinkhole 4<\u002Fdiv>\n            <div style=\"padding:6px 10px;background:#ffdee6;color:#aa0b56\">…<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:12px;padding-top:9px;border-top:2px solid #d6006c;font-size:13.5px;color:#790e3d\">Operator tasking cannot propagate<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <figcaption style=\"font-size:10.5px;color:#7d7979;border-top:1px solid #d7d3d3;padding-top:7px;margin-top:14px\">CrowdStrike's two steps: remove legitimate peers so bots progressively isolate, then insert sinkhole entries into the emptied lists. Super peers were targeted first as the communication backbone; once isolated, both URL packs and file packs stop propagating. [F, High]<\u002Ffigcaption>\n    <\u002Ffigure>\n\n    <h3 style=\"font-size:20px;margin:26px 0 10px\">7.4 Why it cascades<\u002Fh3>\n    <p style=\"font-size:15.5px;line-height:1.6;margin:0 0 6px;max-width:38em\">Removing the topmost peer achieves nothing — there is no root to cut. What works is manipulating <em>what the surviving peers believe the topology is<\u002Fem>.<\u002Fp>\n\n    <figure style=\"margin:18px 0 30px\" data-om-raster=\"\">\n      <div style=\"border-top:2px solid #201e1d;padding-top:9px\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0\">Exhibit 17<\u002Fdiv>\n        <div style=\"font-size:17px;margin:2px 0 14px\">Do not cut the root; rewrite the belief<\u002Fdiv>\n      <\u002Fdiv>\n      <svg sc-camel-view-box=\"0 0 700 216\" style=\"width:100%;height:auto;font-family:'Source Serif 4',serif\">\n        <text x=\"0\" y=\"12\" font-size=\"10.5\" letter-spacing=\"0.9\" fill=\"#605d5d\">BEFORE — TASKING FANS OUT<\u002Ftext>\n        <rect x=\"120\" y=\"22\" width=\"90\" height=\"24\" fill=\"#201e1d\"><\u002Frect>\n        <text x=\"165\" y=\"39\" font-size=\"11\" fill=\"#f3f2f2\" text-anchor=\"middle\">Operator<\u002Ftext>\n        <path d=\"M 165 46 L 165 60\" stroke=\"#201e1d\" stroke-width=\"1.2\"><\u002Fpath>\n        <rect x=\"135\" y=\"60\" width=\"60\" height=\"22\" fill=\"#cbeeff\" stroke=\"#0088b0\"><\u002Frect>\n        <text x=\"165\" y=\"75\" font-size=\"10.5\" fill=\"#004961\" text-anchor=\"middle\">S1<\u002Ftext>\n        <path d=\"M 165 82 L 165 92 M 75 92 L 255 92 M 75 92 L 75 104 M 165 92 L 165 104 M 255 92 L 255 104\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Fpath>\n        <rect x=\"48\" y=\"104\" width=\"54\" height=\"22\" fill=\"#cbeeff\" stroke=\"#0088b0\"><\u002Frect>\n        <rect x=\"138\" y=\"104\" width=\"54\" height=\"22\" fill=\"#cbeeff\" stroke=\"#0088b0\"><\u002Frect>\n        <rect x=\"228\" y=\"104\" width=\"54\" height=\"22\" fill=\"#cbeeff\" stroke=\"#0088b0\"><\u002Frect>\n        <text x=\"75\" y=\"119\" font-size=\"10.5\" fill=\"#004961\" text-anchor=\"middle\">S2<\u002Ftext>\n        <text x=\"165\" y=\"119\" font-size=\"10.5\" fill=\"#004961\" text-anchor=\"middle\">S3<\u002Ftext>\n        <text x=\"255\" y=\"119\" font-size=\"10.5\" fill=\"#004961\" text-anchor=\"middle\">S4<\u002Ftext>\n        <path d=\"M 75 126 L 75 138 M 48 138 L 102 138 M 48 138 L 48 148 M 102 138 L 102 148 M 165 126 L 165 148 M 255 126 L 255 138 M 228 138 L 282 138 M 228 138 L 228 148 M 282 138 L 282 148\" stroke=\"#7d7979\" stroke-width=\"1\"><\u002Fpath>\n        <rect x=\"30\" y=\"148\" width=\"36\" height=\"20\" fill=\"#eae7e7\"><\u002Frect>\n        <rect x=\"84\" y=\"148\" width=\"36\" height=\"20\" fill=\"#eae7e7\"><\u002Frect>\n        <rect x=\"147\" y=\"148\" width=\"36\" height=\"20\" fill=\"#eae7e7\"><\u002Frect>\n        <rect x=\"210\" y=\"148\" width=\"36\" height=\"20\" fill=\"#eae7e7\"><\u002Frect>\n        <rect x=\"264\" y=\"148\" width=\"36\" height=\"20\" fill=\"#eae7e7\"><\u002Frect>\n        <text x=\"48\" y=\"162\" font-size=\"10\" fill=\"#444141\" text-anchor=\"middle\">B1<\u002Ftext>\n        <text x=\"102\" y=\"162\" font-size=\"10\" fill=\"#444141\" text-anchor=\"middle\">B2<\u002Ftext>\n        <text x=\"165\" y=\"162\" font-size=\"10\" fill=\"#444141\" text-anchor=\"middle\">B3<\u002Ftext>\n        <text x=\"228\" y=\"162\" font-size=\"10\" fill=\"#444141\" text-anchor=\"middle\">B4<\u002Ftext>\n        <text x=\"282\" y=\"162\" font-size=\"10\" fill=\"#444141\" text-anchor=\"middle\">B5<\u002Ftext>\n        <text x=\"0\" y=\"196\" font-size=\"11\" fill=\"#605d5d\">Removing S1 alone achieves<\u002Ftext>\n        <text x=\"0\" y=\"210\" font-size=\"11\" fill=\"#605d5d\">nothing: S2–S4 still hold peers.<\u002Ftext>\n        <path d=\"M 340 20 L 340 210\" stroke=\"#d7d3d3\" stroke-width=\"1\"><\u002Fpath>\n        <text x=\"380\" y=\"12\" font-size=\"10.5\" letter-spacing=\"0.9\" fill=\"#790e3d\">AFTER — A DEFENDER-OWNED BACKBONE<\u002Ftext>\n        <rect x=\"500\" y=\"22\" width=\"90\" height=\"24\" fill=\"#201e1d\"><\u002Frect>\n        <text x=\"545\" y=\"39\" font-size=\"11\" fill=\"#f3f2f2\" text-anchor=\"middle\">Operator<\u002Ftext>\n        <path d=\"M 545 46 L 545 58\" stroke=\"#d6006c\" stroke-width=\"1.2\"><\u002Fpath>\n        <path d=\"M 536 50 L 554 66 M 554 50 L 536 66\" stroke=\"#d6006c\" stroke-width=\"2\"><\u002Fpath>\n        <rect x=\"510\" y=\"76\" width=\"70\" height=\"22\" fill=\"#d6006c\"><\u002Frect>\n        <text x=\"545\" y=\"91\" font-size=\"10.5\" fill=\"#fff1f4\" text-anchor=\"middle\">Sinkhole<\u002Ftext>\n        <path d=\"M 545 98 L 545 108 M 455 108 L 635 108 M 455 108 L 455 120 M 545 108 L 545 120 M 635 108 L 635 120\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Fpath>\n        <rect x=\"428\" y=\"120\" width=\"54\" height=\"22\" fill=\"#ffdee6\" stroke=\"#d6006c\"><\u002Frect>\n        <rect x=\"518\" y=\"120\" width=\"54\" height=\"22\" fill=\"#ffdee6\" stroke=\"#d6006c\"><\u002Frect>\n        <rect x=\"608\" y=\"120\" width=\"54\" height=\"22\" fill=\"#ffdee6\" stroke=\"#d6006c\"><\u002Frect>\n        <text x=\"455\" y=\"135\" font-size=\"10\" fill=\"#790e3d\" text-anchor=\"middle\">Sink<\u002Ftext>\n        <text x=\"545\" y=\"135\" font-size=\"10\" fill=\"#790e3d\" text-anchor=\"middle\">Sink<\u002Ftext>\n        <text x=\"635\" y=\"135\" font-size=\"10\" fill=\"#790e3d\" text-anchor=\"middle\">Sink<\u002Ftext>\n        <path d=\"M 455 142 L 455 158 M 545 142 L 545 158 M 635 142 L 635 158\" stroke=\"#7d7979\" stroke-width=\"1\"><\u002Fpath>\n        <rect x=\"437\" y=\"158\" width=\"36\" height=\"20\" fill=\"#eae7e7\"><\u002Frect>\n        <rect x=\"527\" y=\"158\" width=\"36\" height=\"20\" fill=\"#eae7e7\"><\u002Frect>\n        <rect x=\"617\" y=\"158\" width=\"36\" height=\"20\" fill=\"#eae7e7\"><\u002Frect>\n        <text x=\"455\" y=\"172\" font-size=\"10\" fill=\"#444141\" text-anchor=\"middle\">B1<\u002Ftext>\n        <text x=\"545\" y=\"172\" font-size=\"10\" fill=\"#444141\" text-anchor=\"middle\">B2<\u002Ftext>\n        <text x=\"635\" y=\"172\" font-size=\"10\" fill=\"#444141\" text-anchor=\"middle\">B3<\u002Ftext>\n        <text x=\"380\" y=\"196\" font-size=\"11\" fill=\"#790e3d\">Every bot's next refresh reinforces the<\u002Ftext>\n        <text x=\"380\" y=\"210\" font-size=\"11\" fill=\"#790e3d\">defender's topology rather than the operator's.<\u002Ftext>\n      <\u002Fsvg>\n      <figcaption style=\"font-size:10.5px;color:#7d7979;border-top:1px solid #d7d3d3;padding-top:7px;margin-top:12px\">Source: CrowdStrike 2026, reconstructed. Structural note: a P2P botnet has no root to cut, which is precisely why it was considered disruption-resistant.<\u002Ffigcaption>\n    <\u002Ffigure>\n  <\u002Fdiv>\n\n  <div style=\"break-before:page\">\n    <h3 style=\"font-size:20px;margin:0 0 10px\">7.5 What the DOJ release adds — and what it conspicuously omits<\u002Fh3>\n    <p style=\"font-size:15.5px;line-height:1.6;margin:0 0 6px;max-width:38em\">The DOJ release is the only account of this operation not written by the party that ran it. Reading it against the CrowdStrike post is therefore the most useful single analytic exercise available.<\u002Fp>\n\n    <figure style=\"margin:20px 0 26px\">\n      <div style=\"border-top:2px solid #201e1d;padding-top:9px\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0\">Exhibit 18<\u002Fdiv>\n        <div style=\"font-size:17px;margin:2px 0 14px\">Corroboration matrix — what two sources agree on, and what rests on one<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-raw-table class=\"table\" style=\"font-size:13.5px\">\n        <sc-raw-thead><sc-raw-tr><sc-raw-th>Claim<\u002Fsc-raw-th><sc-raw-th style=\"width:110px\">CrowdStrike<\u002Fsc-raw-th><sc-raw-th style=\"width:110px\">DOJ<\u002Fsc-raw-th><sc-raw-th style=\"width:28%\">Note<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n        <sc-raw-tbody>\n          <sc-raw-tr><sc-raw-td>Executed Monday 31 Aug 2026<\u002Fsc-raw-td><sc-raw-td style=\"color:#0088b0\">Yes<\u002Fsc-raw-td><sc-raw-td style=\"color:#0088b0\">Yes<\u002Fsc-raw-td><sc-raw-td><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>A peer-to-peer <strong>sinkhole<\u002Fstrong> operation<\u002Fsc-raw-td><sc-raw-td style=\"color:#0088b0\">Yes<\u002Fsc-raw-td><sc-raw-td style=\"color:#0088b0\">Yes<\u002Fsc-raw-td><sc-raw-td>Settles sinkholing versus partitioning from a second source<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Domain seizures, United States<\u002Fsc-raw-td><sc-raw-td style=\"color:#0088b0\">Yes<\u002Fsc-raw-td><sc-raw-td style=\"color:#0088b0\">Yes<\u002Fsc-raw-td><sc-raw-td>By DOJ, FBI and DCIS<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Domain seizures, Europe<\u002Fsc-raw-td><sc-raw-td style=\"color:#0088b0\">Yes<\u002Fsc-raw-td><sc-raw-td style=\"color:#0088b0\">Yes<\u002Fsc-raw-td><sc-raw-td>Bulgaria, Hungary, Romania<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Europol and Eurojust participation<\u002Fsc-raw-td><sc-raw-td style=\"color:#0088b0\">Yes<\u002Fsc-raw-td><sc-raw-td style=\"color:#0088b0\">Yes<\u002Fsc-raw-td><sc-raw-td><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Shadowserver victim notification<\u002Fsc-raw-td><sc-raw-td style=\"color:#0088b0\">Yes<\u002Fsc-raw-td><sc-raw-td style=\"color:#0088b0\">Yes<\u002Fsc-raw-td><sc-raw-td>Explicitly via ISPs and CSIRTs<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Sality active since 2003<\u002Fsc-raw-td><sc-raw-td style=\"color:#0088b0\">Yes<\u002Fsc-raw-td><sc-raw-td style=\"color:#0088b0\">Yes<\u002Fsc-raw-td><sc-raw-td><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Cryptocurrency theft as the harm<\u002Fsc-raw-td><sc-raw-td style=\"color:#0088b0\">Yes<\u002Fsc-raw-td><sc-raw-td style=\"color:#0088b0\">Yes<\u002Fsc-raw-td><sc-raw-td><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"background:#fff1f4\"><sc-raw-td>The ~15,000 figure; v3/v4 structure; the peer-list mechanism; EggJagger; the RUB 12.1M / 147M financials; the three DDoS campaigns; the YARA rules and IOCs<\u002Fsc-raw-td><sc-raw-td style=\"color:#0088b0\">Yes<\u002Fsc-raw-td><sc-raw-td style=\"color:#d6006c\">Silent<\u002Fsc-raw-td><sc-raw-td><strong>Not contradicted — simply not independently attested.<\u002Fstrong> Confidence unchanged and remains vendor-sourced<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Any named suspect, charge, indictment, forfeiture or sanction<\u002Fsc-raw-td><sc-raw-td style=\"color:#d6006c\">Silent<\u002Fsc-raw-td><sc-raw-td style=\"color:#d6006c\">Silent<\u002Fsc-raw-td><sc-raw-td>KJ-13 — conspicuously absent from both<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n      <figcaption style=\"font-size:10.5px;color:#7d7979;border-top:1px solid #d7d3d3;padding-top:7px;margin-top:12px\">Sources: CrowdStrike, 1 Sep 2026; DOJ/USAO-CDCA release 26-149, 1 Sep 2026. This matrix is the basis on which X-1 is treated as partially discharged.<\u002Ffigcaption>\n    <\u002Ffigure>\n\n    <h3 style=\"font-size:20px;margin:26px 0 10px\">7.6 The DoD nexus — read carefully<\u002Fh3>\n    <p style=\"font-size:15.5px;line-height:1.6;margin:0 0 14px;max-width:38em\">DCIS's participation is unusual enough to warrant explanation, and the release supplies one: SAC DeChellis frames DCIS's involvement around protecting the integrity of the <strong>Department of Defense Information Network<\u002Fstrong> from threats of this kind.<\u002Fp>\n    <sc-raw-table class=\"table\" style=\"font-size:13.5px;margin-bottom:16px\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th>Reading<\u002Fsc-raw-th><sc-raw-th style=\"width:52px\">Type<\u002Fsc-raw-th><sc-raw-th style=\"width:30%\">Confidence<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td>DCIS framed its participation in terms of DoDIN protection<\u002Fsc-raw-td><sc-raw-td>[F]<\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fadfda;color:#7d2018\">High<\u002Fspan> — direct quotation<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>DCIS participates because Sality falls within its DoDIN-protection remit<\u002Fsc-raw-td><sc-raw-td>[A]<\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fbe6cd;color:#7a4a13\">Moderate<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><strong>Sality infections were actually present on DoDIN or defence-contractor systems<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>[A]<\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fbeec2;color:#6e5307\">Low<\u002Fspan> — <em>not stated.<\u002Fem> The quotation describes a mission priority, not a finding<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n    <div class=\"keep\" style=\"margin:0 0 8px;padding-top:12px;border-top:1px solid #d6006c;max-width:38em\">\n      <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#d6006c;margin-bottom:6px\">Do not over-read this<\u002Fdiv>\n      <p style=\"font-size:14.5px;line-height:1.55;margin:0\">The temptation is to convert \"DCIS was involved\" plus \"DoDIN is our priority\" into \"Sality was on defence networks.\" The release does not say that. It is, however, the most plausible explanation for DCIS's presence and worth one line in a management summary — flagged at Low confidence.<\u002Fp>\n    <\u002Fdiv>\n\n    <h3 style=\"font-size:20px;margin:26px 0 10px\">7.7 Policy framing<\u002Fh3>\n    <p style=\"font-size:15.5px;line-height:1.6;margin:0 0 12px;max-width:38em\">DOJ situates the operation as advancing the first pillar of the US <em>Cyber Strategy for America<\u002Fem> — \"Shape Adversary Behavior\" — and describes public-private coordination as central to it. The same framing appeared in the QScan/QTRouter PRC botnet disruption announced a week earlier.<\u002Fp>\n    <p style=\"font-size:15.5px;line-height:1.6;margin:0;max-width:38em\"><strong>[A, Moderate]<\u002Fstrong> that this reflects a sustained US policy posture favouring publicised, private-sector-partnered disruption operations rather than a one-off. Relevant to Section 15: if your organisation ever contemplates participating in such an operation, the current US posture is receptive, and the legal vehicle is a US Attorney's Office working with named foreign cybercrime units.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"break-before:page\">\n    <div style=\"font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0;margin-bottom:8px\">Section 08<\u002Fdiv>\n    <h2 style=\"font-size:32px;margin:0 0 18px;padding-bottom:12px;border-bottom:2px solid #201e1d\">NAT, the seizures, and the residual-tasking race<\u002Fh2>\n    <p style=\"font-size:16px;line-height:1.5;margin:0 0 6px;max-width:36em\">Most of the population was never reachable from outside. P2PWNED measured only <strong>36.9% (v3)<\u002Fstrong> and <strong>40.0% (v4)<\u002Fstrong> of enumerated peers as routable, and found that crawling underestimated the true population by factors of 110.6 and 113.3 respectively. CrowdStrike confirms the majority sit behind firewalls or NAT. <strong>[F, High]<\u002Fstrong><\u002Fp>\n\n    <figure style=\"margin:22px 0 28px\" data-om-raster=\"\">\n      <div style=\"border-top:2px solid #201e1d;padding-top:9px\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0\">Exhibit 19<\u002Fdiv>\n        <div style=\"font-size:17px;margin:2px 0 14px\">The passive approach — the hidden majority walks into the trap by itself<\u002Fdiv>\n      <\u002Fdiv>\n      <svg sc-camel-view-box=\"0 0 700 160\" style=\"width:100%;height:auto;font-family:'Source Serif 4',serif\">\n        <defs>\n          <marker id=\"sal-ah5\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"8\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"7\" sc-camel-marker-height=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 1 L 9 5 L 0 9 z\" fill=\"#201e1d\"><\u002Fpath><\u002Fmarker>\n        <\u002Fdefs>\n        <rect x=\"0\" y=\"56\" width=\"150\" height=\"48\" fill=\"#eae7e7\"><\u002Frect>\n        <text x=\"75\" y=\"76\" font-size=\"12.5\" fill=\"#201e1d\" text-anchor=\"middle\">NAT'd bot<\u002Ftext>\n        <text x=\"75\" y=\"92\" font-size=\"10.5\" fill=\"#605d5d\" text-anchor=\"middle\">no inbound reachability<\u002Ftext>\n        <path d=\"M 150 80 L 232 80\" stroke=\"#201e1d\" stroke-width=\"1.4\" marker-end=\"url(#sal-ah5)\"><\u002Fpath>\n        <text x=\"156\" y=\"72\" font-size=\"10.5\" fill=\"#605d5d\">normal outbound refresh<\u002Ftext>\n        <text x=\"156\" y=\"96\" font-size=\"10.5\" fill=\"#605d5d\">every ~40 minutes<\u002Ftext>\n        <rect x=\"234\" y=\"56\" width=\"196\" height=\"48\" fill=\"#cbeeff\" stroke=\"#0088b0\" stroke-width=\"1.8\"><\u002Frect>\n        <text x=\"332\" y=\"76\" font-size=\"12.5\" fill=\"#004961\" text-anchor=\"middle\">CrowdStrike sinkhole node<\u002Ftext>\n        <text x=\"332\" y=\"92\" font-size=\"10.5\" fill=\"#006786\" text-anchor=\"middle\">answers the handshake correctly<\u002Ftext>\n        <path d=\"M 430 80 L 512 80\" stroke=\"#d6006c\" stroke-width=\"1.4\" marker-end=\"url(#sal-ah5)\"><\u002Fpath>\n        <text x=\"436\" y=\"72\" font-size=\"10.5\" fill=\"#790e3d\">manipulated peer state<\u002Ftext>\n        <text x=\"436\" y=\"96\" font-size=\"10.5\" fill=\"#790e3d\">returned in the reply<\u002Ftext>\n        <rect x=\"514\" y=\"56\" width=\"186\" height=\"48\" fill=\"#ffdee6\" stroke=\"#d6006c\" stroke-width=\"1.5\"><\u002Frect>\n        <text x=\"607\" y=\"76\" font-size=\"12.5\" fill=\"#790e3d\" text-anchor=\"middle\">Useful peers disappear<\u002Ftext>\n        <text x=\"607\" y=\"92\" font-size=\"10.5\" fill=\"#aa0b56\" text-anchor=\"middle\">permanent isolation<\u002Ftext>\n        <text x=\"0\" y=\"26\" font-size=\"11\" fill=\"#605d5d\">The takedown requires access to no victim machine. It travels on legitimate protocol behaviour that the malware<\u002Ftext>\n        <text x=\"0\" y=\"40\" font-size=\"11\" fill=\"#605d5d\">performs on its own schedule.<\u002Ftext>\n        <text x=\"0\" y=\"132\" font-size=\"11\" fill=\"#605d5d\">Every 40-minute cycle a hidden bot runs, it walks further into the trap. [A, Moderate–High] — CrowdStrike's<\u002Ftext>\n        <text x=\"0\" y=\"146\" font-size=\"11\" fill=\"#605d5d\">characterisation; convergence rate and completeness are not published.<\u002Ftext>\n      <\u002Fsvg>\n      <figcaption style=\"font-size:10.5px;color:#7d7979;border-top:1px solid #d7d3d3;padding-top:7px;margin-top:12px\">Source: CrowdStrike 2026, reconstructed. P2PWNED 2013 for the routability measurements.<\u002Ffigcaption>\n    <\u002Ffigure>\n\n    <h3 style=\"font-size:20px;margin:26px 0 10px\">8.1 Why the domain seizures were not optional<\u002Fh3>\n    <p style=\"font-size:15.5px;line-height:1.6;margin:0 0 6px;max-width:38em\">Peer-list poisoning does not erase tasking a bot <strong>already holds<\u002Fstrong>. A bot still carrying a valid signed URL pack will keep fetching from those URLs. CrowdStrike is explicit that the URL takedowns ensure such bots cannot retrieve payloads <em>during the transition period<\u002Fem>.<\u002Fp>\n\n    <figure style=\"margin:20px 0 28px\">\n      <div style=\"border-top:2px solid #201e1d;padding-top:9px\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0\">Exhibit 20<\u002Fdiv>\n        <div style=\"font-size:17px;margin:2px 0 14px\">Two prongs, one outcome — neither is sufficient alone<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:2px\">\n        <div style=\"background:#cbeeff;padding:14px 16px\">\n          <div style=\"font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#004961;margin-bottom:6px\">Prong one · CrowdStrike<\u002Fdiv>\n          <div style=\"font-size:17px;color:#004961;margin-bottom:6px\">Poison the P2P topology<\u002Fdiv>\n          <p style=\"font-size:13.5px;line-height:1.45;margin:0;color:#006786\">No <strong>new<\u002Fstrong> tasking can reach a bot.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#cbeeff;padding:14px 16px\">\n          <div style=\"font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#004961;margin-bottom:6px\">Prong two · law enforcement<\u002Fdiv>\n          <div style=\"font-size:17px;color:#004961;margin-bottom:6px\">Remove the payload URLs<\u002Fdiv>\n          <p style=\"font-size:13.5px;line-height:1.45;margin:0;color:#006786\"><strong>Old<\u002Fstrong> tasking a bot still holds cannot fetch anything.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#201e1d;color:#f3f2f2;padding:13px 16px;margin-top:2px;display:flex;justify-content:space-between;align-items:center\">\n        <span style=\"font-size:17px\">Botnet inert<\u002Fspan>\n        <span style=\"font-size:12px;color:#bab6b6\">not remediated — see Section 13<\u002Fspan>\n      <\u002Fdiv>\n      <figcaption style=\"font-size:10.5px;color:#7d7979;border-top:1px solid #d7d3d3;padding-top:7px;margin-top:12px\">Sources: CrowdStrike 2026; DOJ release 26-149. P2PWNED formalised the second prong as <em>fallback prevention<\u002Fem>, the third mandatory step of any P2P sinkholing operation alongside sinkhole announcement and node isolation.<\u002Ffigcaption>\n    <\u002Ffigure>\n\n    <h3 style=\"font-size:20px;margin:26px 0 10px\">8.2 The doctrine, and 8.3 seizure scope<\u002Fh3>\n    <p style=\"font-size:15.5px;line-height:1.6;margin:0 0 12px;max-width:38em\">P2PWNED's Sality entry notes that no backup C&amp;C mechanism exists, but warns that as a downloader it could recover through previously dropped malware, and that one must first verify no delivered payload retains download-and-execute capability. The 2026 operation follows that doctrine. <strong>[A, Moderate]<\u002Fstrong> — the correspondence is clear, but CrowdStrike does not cite P2PWNED.<\u002Fp>\n    <p style=\"font-size:15.5px;line-height:1.6;margin:0 0 12px;max-width:38em\">DOJ, FBI and DCIS seized Sality-linked domains in the United States; Bulgaria, Hungary and Romania acted against Sality-linked domains hosted in Europe. Europol and Eurojust participation is confirmed by the primary source. <strong>[F, High]<\u002Fstrong><\u002Fp>\n\n    <h3 style=\"font-size:20px;margin:26px 0 10px\">8.4 Does propagation continue? A reasoned inference<\u002Fh3>\n    <p style=\"font-size:15.5px;line-height:1.6;margin:0 0 6px;max-width:38em\">Falliere established that all infection routines are disabled if the peer list is empty. Had poisoned peer lists ended up <em>empty<\u002Fem>, file infection — and therefore lateral spread via shares and USB — would have stopped as a side effect. They did not.<\u002Fp>\n\n    <figure style=\"margin:20px 0 26px\" data-om-raster=\"\">\n      <div style=\"border-top:2px solid #201e1d;padding-top:9px\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0\">Exhibit 21<\u002Fdiv>\n        <div style=\"font-size:17px;margin:2px 0 14px\">The branch that decides whether Sality still spreads<\u002Fdiv>\n      <\u002Fdiv>\n      <svg sc-camel-view-box=\"0 0 700 178\" style=\"width:100%;height:auto;font-family:'Source Serif 4',serif\">\n        <defs>\n          <marker id=\"sal-ah6\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"8\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"7\" sc-camel-marker-height=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 1 L 9 5 L 0 9 z\" fill=\"#201e1d\"><\u002Fpath><\u002Fmarker>\n        <\u002Fdefs>\n        <rect x=\"0\" y=\"66\" width=\"180\" height=\"46\" fill=\"#eae7e7\"><\u002Frect>\n        <text x=\"90\" y=\"86\" font-size=\"12\" fill=\"#201e1d\" text-anchor=\"middle\">Peer list purged of<\u002Ftext>\n        <text x=\"90\" y=\"102\" font-size=\"12\" fill=\"#201e1d\" text-anchor=\"middle\">legitimate peers<\u002Ftext>\n        <path d=\"M 180 89 L 210 89 M 210 30 L 210 148 M 210 30 L 246 30 M 210 148 L 246 148\" stroke=\"#201e1d\" stroke-width=\"1.2\"><\u002Fpath>\n        <path d=\"M 240 30 L 252 30\" stroke=\"#201e1d\" stroke-width=\"1.2\" marker-end=\"url(#sal-ah6)\"><\u002Fpath>\n        <path d=\"M 240 148 L 252 148\" stroke=\"#201e1d\" stroke-width=\"1.2\" marker-end=\"url(#sal-ah6)\"><\u002Fpath>\n        <rect x=\"254\" y=\"12\" width=\"200\" height=\"36\" fill=\"#eae7e7\"><\u002Frect>\n        <text x=\"264\" y=\"27\" font-size=\"11.5\" fill=\"#605d5d\">If left EMPTY<\u002Ftext>\n        <text x=\"264\" y=\"42\" font-size=\"11.5\" fill=\"#605d5d\">— counterfactual, did not happen<\u002Ftext>\n        <path d=\"M 454 30 L 486 30\" stroke=\"#7d7979\" stroke-width=\"1.2\" marker-end=\"url(#sal-ah6)\"><\u002Fpath>\n        <rect x=\"488\" y=\"12\" width=\"212\" height=\"36\" fill=\"#f3f2f2\" stroke=\"#7d7979\" stroke-width=\"1\"><\u002Frect>\n        <text x=\"498\" y=\"27\" font-size=\"11.5\" fill=\"#605d5d\">Infector disabled<\u002Ftext>\n        <text x=\"498\" y=\"42\" font-size=\"11.5\" fill=\"#605d5d\">spread would stop<\u002Ftext>\n        <rect x=\"254\" y=\"130\" width=\"200\" height=\"36\" fill=\"#ffdee6\"><\u002Frect>\n        <text x=\"264\" y=\"145\" font-size=\"11.5\" fill=\"#790e3d\">Sinkholes INSERTED<\u002Ftext>\n        <text x=\"264\" y=\"160\" font-size=\"11.5\" fill=\"#790e3d\">peer list is non-empty<\u002Ftext>\n        <path d=\"M 454 148 L 486 148\" stroke=\"#d6006c\" stroke-width=\"1.2\" marker-end=\"url(#sal-ah6)\"><\u002Fpath>\n        <rect x=\"488\" y=\"118\" width=\"212\" height=\"60\" fill=\"#d6006c\"><\u002Frect>\n        <text x=\"498\" y=\"136\" font-size=\"11.5\" fill=\"#fff1f4\">Infector remains enabled<\u002Ftext>\n        <text x=\"498\" y=\"152\" font-size=\"11.5\" fill=\"#ffdee6\">file infection continues<\u002Ftext>\n        <text x=\"498\" y=\"168\" font-size=\"11.5\" fill=\"#ffdee6\">USB and SMB spread continues<\u002Ftext>\n      <\u002Fsvg>\n      <figcaption style=\"font-size:10.5px;color:#7d7979;border-top:1px solid #d7d3d3;padding-top:7px;margin-top:12px\">The inference chain: CrowdStrike states sinkhole entries are injected into the emptied peer lists, and that all Sality-infected machines now beacon to CrowdStrike sinkholes. A machine that beacons must hold at least one sinkhole entry. A peer list holding entries is not empty. Therefore the infector is not disabled.<\u002Ffigcaption>\n    <\u002Ffigure>\n\n    <sc-raw-table class=\"table\" style=\"font-size:13.5px;margin-bottom:18px\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th>Step in the chain<\u002Fsc-raw-th><sc-raw-th style=\"width:52px\">Type<\u002Fsc-raw-th><sc-raw-th style=\"width:26%\">Confidence<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td>Falliere: infection routines disabled on an empty peer list (2011 code)<\u002Fsc-raw-td><sc-raw-td>[F]<\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fadfda;color:#7d2018\">High<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>That behaviour is unchanged in 2026 builds<\u002Fsc-raw-td><sc-raw-td>[A]<\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fbe6cd;color:#7a4a13\">Moderate<\u002Fspan> — rests on X-2<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Post-disruption peer lists contain sinkhole entries<\u002Fsc-raw-td><sc-raw-td>[F]<\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fadfda;color:#7d2018\">High<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr style=\"background:#fff1f4\"><sc-raw-td><strong>Therefore file infection and lateral spread continue<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>[A]<\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fbe6cd;color:#7a4a13\">Moderate<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n\n    <div class=\"keep\" style=\"margin:0;padding-top:12px;border-top:1px solid #d6006c;max-width:38em\">\n      <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#d6006c;margin-bottom:6px\">Defensive implication<\u002Fdiv>\n      <p style=\"font-size:14.5px;line-height:1.55;margin:0\">The disruption cuts <em>tasking<\u002Fem>, not <em>propagation<\u002Fem>. Treat any Sality-infected host as still spreading to mapped drives, shares and removable media. <strong>The recommendation is robust to the inference being wrong<\u002Fstrong> — remediate regardless. Note that the infection is now <em>quieter<\u002Fem>: no new payloads means fewer behavioural symptoms to trip on.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"break-before:page\">\n    <div style=\"font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0;margin-bottom:8px\">Section 09<\u002Fdiv>\n    <h2 style=\"font-size:32px;margin:0 0 18px;padding-bottom:12px;border-bottom:2px solid #201e1d\">Scale and trajectory<\u002Fh2>\n    <p style=\"font-size:16px;line-height:1.5;margin:0 0 16px;max-width:36em\">Confirmed: over <strong>15,000<\u002Fstrong> infected machines were reachable for payload delivery. <strong>[F, High]<\u002Fstrong> Everything else about magnitude is a comparison between measurements that were never designed to be compared.<\u002Fp>\n\n    <figure style=\"margin:22px 0 30px\">\n      <div style=\"border-top:2px solid #201e1d;padding-top:9px\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0\">Exhibit 22<\u002Fdiv>\n        <div style=\"font-size:17px;margin:2px 0 4px\">Measured points only — no interpolation, and three incompatible measures<\u002Fdiv>\n        <div style=\"font-size:12px;color:#7d7979;margin-bottom:16px\">Bars are logarithmic. They are <strong>not<\u002Fstrong> comparable across measures; the colour tells you which measure each bar belongs to.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;gap:20px;margin-bottom:16px;font-size:11.5px\">\n        <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:14px;height:10px;background:#0088b0;display:inline-block\"><\u002Fspan>Unique IPs per day<\u002Fspan>\n        <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:14px;height:10px;background:#7d7979;display:inline-block\"><\u002Fspan>Total enumerated peers<\u002Fspan>\n        <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:14px;height:10px;background:#d6006c;display:inline-block\"><\u002Fspan>Payload-reachable machines<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:118px 1fr 118px;gap:7px 12px;align-items:center;font-size:12.5px\">\n        <div style=\"color:#605d5d\">2011-07 · Falliere<\u002Fdiv>\n        <div><div style=\"height:17px;width:83.3%;background:#0088b0\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"text-align:right;font-variant-numeric:tabular-nums\">&gt;1,000,000<\u002Fdiv>\n        <div style=\"color:#605d5d\">2012-11 · P2PWNED<\u002Fdiv>\n        <div><div style=\"height:17px;width:83.4%;background:#0088b0\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"text-align:right;font-variant-numeric:tabular-nums\">1,007,899<\u002Fdiv>\n        <div style=\"color:#605d5d\">2015-09 · Kleissner<\u002Fdiv>\n        <div><div style=\"height:17px;width:93.4%;background:#0088b0\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"text-align:right;font-variant-numeric:tabular-nums\">~2,000,000<\u002Fdiv>\n        <div style=\"color:#605d5d;padding-top:8px\">2014-07 · Kleissner<\u002Fdiv>\n        <div style=\"padding-top:8px\"><div style=\"height:17px;width:73.5%;background:#7d7979\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"text-align:right;font-variant-numeric:tabular-nums;padding-top:8px\">507,692<\u002Fdiv>\n        <div style=\"color:#605d5d\">2015-09 · Kleissner<\u002Fdiv>\n        <div><div style=\"height:17px;width:66.9%;background:#7d7979\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"text-align:right;font-variant-numeric:tabular-nums\">320,652<\u002Fdiv>\n        <div style=\"color:#201e1d;padding-top:8px\"><strong>2026-08 · CrowdStrike<\u002Fstrong><\u002Fdiv>\n        <div style=\"padding-top:8px\"><div style=\"height:17px;width:22.5%;background:#d6006c\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"text-align:right;font-variant-numeric:tabular-nums;padding-top:8px\"><strong>&gt;15,000<\u002Fstrong><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:18px;padding-top:10px;border-top:1px solid #d7d3d3;font-size:12.5px;color:#790e3d\">Intermediate years 2016–2025: <strong>no data located.<\u002Fstrong> The decline curve is four measured points with a decade-wide hole.<\u002Fdiv>\n      <figcaption style=\"font-size:10.5px;color:#7d7979;border-top:1px solid #d7d3d3;padding-top:7px;margin-top:12px\">Bar length is proportional to log₁₀ of the value, so visual differences understate the true ratios. Sources as labelled.<\u002Ffigcaption>\n    <\u002Ffigure>\n\n    <sc-raw-table class=\"table\" style=\"font-size:13.5px;margin-bottom:20px\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:16%\">Date<\u002Fsc-raw-th><sc-raw-th style=\"width:18%\">Source<\u002Fsc-raw-th><sc-raw-th>Measurement<\u002Fsc-raw-th><sc-raw-th style=\"width:20%\">Figure<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td>Jan 2011<\u002Fsc-raw-td><sc-raw-td>Falliere<\u002Fsc-raw-td><sc-raw-td>v3 super peers, unique IPs seen by a rogue peer<\u002Fsc-raw-td><sc-raw-td>80,000<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Mar–Jul 2011<\u002Fsc-raw-td><sc-raw-td>Falliere<\u002Fsc-raw-td><sc-raw-td>v3 concurrent active super peers<\u002Fsc-raw-td><sc-raw-td>8,000–10,000<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Jul 2011<\u002Fsc-raw-td><sc-raw-td>Falliere<\u002Fsc-raw-td><sc-raw-td>v3 unique IPs contacting a rogue server, daily<\u002Fsc-raw-td><sc-raw-td><strong>&gt; 1,000,000<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Jul 2011<\u002Fsc-raw-td><sc-raw-td>Falliere<\u002Fsc-raw-td><sc-raw-td>v4 active super peers<\u002Fsc-raw-td><sc-raw-td>~300<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Nov 2012<\u002Fsc-raw-td><sc-raw-td>P2PWNED<\u002Fsc-raw-td><sc-raw-td>v3 / v4 unique IPs at sensor, 24 hours<\u002Fsc-raw-td><sc-raw-td>912,090 / 95,809<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Jul 2014<\u002Fsc-raw-td><sc-raw-td>Kleissner<\u002Fsc-raw-td><sc-raw-td>v3 / v4 total peers<\u002Fsc-raw-td><sc-raw-td>415,696 / 91,996<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Sep 2015<\u002Fsc-raw-td><sc-raw-td>Kleissner<\u002Fsc-raw-td><sc-raw-td>v3 / v4 total peers<\u002Fsc-raw-td><sc-raw-td>251,459 / 69,193<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Sep 2015<\u002Fsc-raw-td><sc-raw-td>Kleissner<\u002Fsc-raw-td><sc-raw-td>All Sality, \"up to\" unique IPs/day via sinkhole<\u002Fsc-raw-td><sc-raw-td>~2,000,000<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr style=\"background:#f8f4f4\"><sc-raw-td><strong>Aug 2026<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>CrowdStrike<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>Payload-reachable machines<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>&gt; 15,000<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n\n    <div class=\"keep\" style=\"margin:0 0 22px;padding-top:12px;border-top:1px solid #d6006c;max-width:38em\">\n      <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#d6006c;margin-bottom:6px\">Sourcing caution<\u002Fdiv>\n      <p style=\"font-size:14.5px;line-height:1.55;margin:0\">Kleissner's deck carries <strong>two<\u002Fstrong> population tables and they are frequently conflated. The 415,696 / 91,996 figures are from 22 July 2014; the September 2015 figures are 251,459 / 69,193. Citing the 2014 table as 2015 understates the 2014–15 decline and overstates the gap to 2026.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1.1fr 1fr;gap:28px\">\n      <div>\n        <div style=\"font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#605d5d;margin-bottom:10px\">Decline to 15,000, by baseline<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr auto;gap:0 12px;font-size:13px\">\n          <div style=\"padding:7px 0;border-bottom:1px solid #eae7e7\">Falliere Jul-2011, v3 unique IPs/day (1,000,000)<\u002Fdiv><div style=\"padding:7px 0;border-bottom:1px solid #eae7e7;font-variant-numeric:tabular-nums\">98.50%<\u002Fdiv>\n          <div style=\"padding:7px 0;border-bottom:1px solid #eae7e7\">P2PWNED Nov-2012, v3+v4 sensor (1,007,899)<\u002Fdiv><div style=\"padding:7px 0;border-bottom:1px solid #eae7e7;font-variant-numeric:tabular-nums\">98.51%<\u002Fdiv>\n          <div style=\"padding:7px 0;border-bottom:1px solid #eae7e7\">Kleissner 2015, \"up to\" IPs/day (2,000,000)<\u002Fdiv><div style=\"padding:7px 0;border-bottom:1px solid #eae7e7;font-variant-numeric:tabular-nums\">99.25%<\u002Fdiv>\n          <div style=\"padding:7px 0;border-bottom:1px solid #eae7e7\">Kleissner Jul-2014, total peers (507,692)<\u002Fdiv><div style=\"padding:7px 0;border-bottom:1px solid #eae7e7;font-variant-numeric:tabular-nums\">97.05%<\u002Fdiv>\n          <div style=\"padding:7px 0;border-bottom:1px solid #eae7e7\">Kleissner Sep-2015, total peers (320,652)<\u002Fdiv><div style=\"padding:7px 0;border-bottom:1px solid #eae7e7;font-variant-numeric:tabular-nums\">95.32%<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"padding-top:12px;border-top:2px solid #0088b0;margin-bottom:16px\">\n          <div style=\"font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#0088b0;margin-bottom:5px\">KJ-6a &nbsp;[A, High]<\u002Fdiv>\n          <p style=\"font-size:14px;line-height:1.5;margin:0\">The decline is very substantial. Every baseline agrees on direction and rough order.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding-top:12px;border-top:2px solid #d6006c\">\n          <div style=\"font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#d6006c;margin-bottom:5px\">KJ-6b &nbsp;[A, Low]<\u002Fdiv>\n          <p style=\"font-size:14px;line-height:1.5;margin:0\">The figure depends entirely on which baseline is chosen. Unique IPs/day is inflated by churn and NAT; total peers counts enumerated nodes; payload-reachable is narrower than both. <strong>State the range and the baseline, never a single headline percentage.<\u002Fstrong><\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p style=\"font-size:15.5px;line-height:1.6;margin:24px 0 12px;max-width:38em\"><strong>Causal explanation [A, Moderate]:<\u002Fstrong> Windows XP end-of-life, universal AV detection of Sality, and the disappearance of the pirated-Windows-without-updates estate that sustained it — Kleissner's reasoning, still plausible but untested against 2016–2025 data.<\u002Fp>\n\n    <div class=\"keep\" style=\"margin:8px 0 0;padding-top:14px;border-top:1px solid #201e1d;max-width:38em\">\n      <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0;margin-bottom:8px\">Framing for management<\u002Fdiv>\n      <p style=\"font-size:16px;line-height:1.5;margin:0\">The technical achievement is genuine and the <em>technique<\u002Fem> is the story. This closed a long decline; it did not decapitate an active giant. CrowdStrike itself frames the significance as architectural — that P2P, long considered a shield against disruption, is not invincible.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"break-before:page\">\n    <div style=\"font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0;margin-bottom:8px\">Section 10<\u002Fdiv>\n    <h2 style=\"font-size:32px;margin:0 0 18px;padding-bottom:12px;border-bottom:2px solid #201e1d\">Precedent — the technique lineage<\u002Fh2>\n    <p style=\"font-size:16px;line-height:1.5;margin:0 0 6px;max-width:36em\">CrowdStrike places Sality in the same class of technique as its 2014 GameOver Zeus and 2017 Kelihos disruptions, adapted to Sality's protocol. <strong>[F, High]<\u002Fstrong> The research thread underneath is one researcher's fifteen-year arc — which is a caution as much as a credential.<\u002Fp>\n\n    <figure style=\"margin:22px 0 30px\">\n      <div style=\"border-top:2px solid #201e1d;padding-top:9px\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0\">Exhibit 23<\u002Fdiv>\n        <div style=\"font-size:17px;margin:2px 0 16px\">Three operations, one abstraction — and the literature that produced it<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1.25fr;gap:32px\">\n        <div>\n          <div style=\"font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#605d5d;margin-bottom:10px\">Operational lineage<\u002Fdiv>\n          <div style=\"background:#eae7e7;padding:11px 13px\"><div style=\"font-size:15px\">GameOver Zeus<\u002Fdiv><div style=\"font-size:11.5px;color:#605d5d\">2014 · peer-list control<\u002Fdiv><\u002Fdiv>\n          <div style=\"text-align:center;font-size:14px;color:#0088b0;line-height:1.2;padding:3px 0\">↓<\u002Fdiv>\n          <div style=\"background:#eae7e7;padding:11px 13px\"><div style=\"font-size:15px\">Kelihos / ZOMBIE SPIDER<\u002Fdiv><div style=\"font-size:11.5px;color:#605d5d\">2017 · peer-list poisoning<\u002Fdiv><\u002Fdiv>\n          <div style=\"text-align:center;font-size:14px;color:#0088b0;line-height:1.2;padding:3px 0\">↓<\u002Fdiv>\n          <div style=\"background:#cbeeff;padding:11px 13px\"><div style=\"font-size:15px;color:#004961\">Sality / SALTY SPIDER<\u002Fdiv><div style=\"font-size:11.5px;color:#006786\">2026 · peer verification plus sinkhole<\u002Fdiv><\u002Fdiv>\n          <div style=\"text-align:center;font-size:14px;color:#d6006c;line-height:1.2;padding:3px 0\">↓<\u002Fdiv>\n          <div style=\"background:#201e1d;color:#f3f2f2;padding:12px 13px\"><div style=\"font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#bab6b6;margin-bottom:3px\">General technique<\u002Fdiv><div style=\"font-size:16px\">P2P overlay takeover<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#605d5d;margin-bottom:10px\">Research thread<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:auto 1fr;gap:11px 14px;font-size:13.5px;line-height:1.45\">\n            <span style=\"color:#0088b0\">2011<\u002Fspan><span>Falliere (Symantec) publishes the full protocol reverse-engineering, including both RSA public keys with an invitation to factorise them. Names the v3 DNS-takeover path; notes a \"cluster of rogue super peers\" as a possible route against v4.<\u002Fspan>\n            <span style=\"color:#0088b0\">2013<\u002Fspan><span>P2PWNED — Rossow, Andriesse, <strong>Werner<\u002Fstrong>, Stone-Gross, Plohmann, Dietrich, Bos. Models resilience formally. Finds the announcement port-overwrite eviction primitive. Rates Sality <em>extremely resilient<\u002Fem>.<\u002Fspan>\n            <span style=\"color:#0088b0\">2013<\u002Fspan><span>Werner takes down Kelihos live on stage at RSA.<\u002Fspan>\n            <span style=\"color:#0088b0\">2014<\u002Fspan><span>Werner and CrowdStrike contribute to the GameOver Zeus disruption.<\u002Fspan>\n            <span style=\"color:#0088b0\">2017<\u002Fspan><span>Kelihos / ZOMBIE SPIDER takedown.<\u002Fspan>\n            <span style=\"color:#d6006c\">2026<\u002Fspan><span>Werner runs the Sality disruption live on stage at Day Zero — <em>\"the most complex botnet takeover we have ever done.\"<\u002Fem> The YARA rules ship with the same key bytes Falliere published in 2011.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <figcaption style=\"font-size:10.5px;color:#7d7979;border-top:1px solid #d7d3d3;padding-top:7px;margin-top:16px\">[F, High] for the sequence; [A, Moderate] for reading it as a single deliberate arc. <strong>Independence caution:<\u002Fstrong> Tillmann Werner authors or co-authors P2PWNED, the 2026 CrowdStrike post and the public Sality dissector. The apparent convergence between the 2013 research and the 2026 operation is substantially the same researcher agreeing with himself — see 17.6.<\u002Ffigcaption>\n    <\u002Ffigure>\n  <\u002Fdiv>\n\n  <div style=\"break-before:page\">\n    <div style=\"font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0;margin-bottom:8px\">Section 11<\u002Fdiv>\n    <h2 style=\"font-size:32px;margin:0 0 18px;padding-bottom:12px;border-bottom:2px solid #201e1d\">Actor profile — SALTY SPIDER<\u002Fh2>\n\n    <h3 style=\"font-size:20px;margin:0 0 10px\">11.1 Attribution<\u002Fh3>\n    <p style=\"font-size:15.5px;line-height:1.6;margin:0 0 6px;max-width:38em\">The attribution rests on a chain of toponyms in twenty-one-year-old strings. It is strong on the Russia nexus and progressively weaker as it narrows.<\u002Fp>\n\n    <figure style=\"margin:20px 0 28px\">\n      <div style=\"border-top:2px solid #201e1d;padding-top:9px\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0\">Exhibit 24<\u002Fdiv>\n        <div style=\"font-size:17px;margin:2px 0 16px\">From string evidence to a place name — four links, each weaker than the last<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1.15fr 1fr;gap:30px\">\n        <div>\n          <div style=\"font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#605d5d;margin-bottom:8px\">String evidence, 2003–2005 samples<\u002Fdiv>\n          <div style=\"font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.85;background:#eae7e7;padding:12px 13px;color:#201e1d\">\"Message from ST v2.93 - Sector(c),<br>&nbsp;Salavat-city 2004\"<br>\"TROJ SECTOR v2.93 BETA\"<br>\"Copyright (c) by Sector\"<br>\"Thanx to iMAGER, Alien-Z\"<br>\"Simple Poly Engine v1.1a (c) Sector\"<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#605d5d;margin-top:8px\">Exfiltration: <span style=\"font-family:ui-monospace,Menlo,monospace\">11581@MAIL.RU<\u002Fspan> → <span style=\"font-family:ui-monospace,Menlo,monospace\">LAMERCOOL@RAMBLER.RU<\u002Fspan>, <span style=\"font-family:ui-monospace,Menlo,monospace\">IMAGER@MAIL.RU<\u002Fspan>, <span style=\"font-family:ui-monospace,Menlo,monospace\">ALIEN-Z@MAIL.RU<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#605d5d;margin-bottom:8px\">The chain<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:auto 1fr;gap:7px 12px;font-size:13.5px;line-height:1.4;margin-bottom:14px\">\n            <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:#0088b0\">Sality<\u002Fspan><span>derived from <strong>Salavat city<\u002Fstrong><\u002Fspan>\n            <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:#0088b0\">Kuku<\u002Fspan><span>Russian for hide-and-seek<\u002Fspan>\n            <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:#0088b0\">Sector<\u002Fspan><span>the author's handle<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"text-align:center;font-size:14px;color:#0088b0;line-height:1;padding:2px 0\">↓<\u002Fdiv>\n          <div style=\"background:#eae7e7;padding:10px 12px;font-size:13.5px;margin-bottom:6px\">Salavat is a city in the <strong>Republic of Bashkortostan<\u002Fstrong>, Russia<\u002Fdiv>\n          <div style=\"text-align:center;font-size:14px;color:#d6006c;line-height:1;padding:2px 0\">↓<\u002Fdiv>\n          <div style=\"background:#ffdee6;padding:10px 12px;font-size:13.5px;color:#790e3d\">CrowdStrike: SALTY SPIDER <em>\"likely operating out of the Republic of Bashkortostan, a region close to the Kazakhstan border\"<\u002Fem><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <figcaption style=\"font-size:10.5px;color:#7d7979;border-top:1px solid #d7d3d3;padding-top:7px;margin-top:16px\">Corroborating behavioural indicators from the 2026 post: proceeds denominated in rubles with purchasing power assessed in that economy; the Feb 2022 attack assessed as patriotically motivated; the Sep 2023 target a Russian exchange the operator likely used to cash out; and consistent reference to a single criminal actor.<\u002Ffigcaption>\n    <\u002Ffigure>\n\n    <sc-raw-table class=\"table\" style=\"font-size:13.5px;margin-bottom:22px\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th>Claim<\u002Fsc-raw-th><sc-raw-th style=\"width:52px\">Type<\u002Fsc-raw-th><sc-raw-th style=\"width:32%\">Confidence<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td>The 2003–05 author used the handle \"Sector\" and was associated with Salavat<\u002Fsc-raw-td><sc-raw-td>[F]<\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fadfda;color:#7d2018\">High<\u002Fspan> — direct string evidence, independently reported by Symantec, CrowdStrike and LookingGlass<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>The operation has a Russia nexus<\u002Fsc-raw-td><sc-raw-td>[A]<\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fadfda;color:#7d2018\">High<\u002Fspan> — language, targeting, cash-out channel, ruble economics and vendor attribution all converge<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Specifically Bashkortostan<\u002Fsc-raw-td><sc-raw-td>[A]<\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fbe6cd;color:#7a4a13\">Moderate<\u002Fspan> — rests on the Salavat toponym in 2003–05 strings; CrowdStrike hedges with \"likely\"<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>The 2026 operator is the same individual as the 2003 author<\u002Fsc-raw-td><sc-raw-td>[A]<\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fbeec2;color:#6e5307\">Low<\u002Fspan> — asserted by no source. String evidence is 21 years old; three handles appear in early material; Falliere referred to \"the authors\" and \"the same gang\"<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>A single operator rather than a group<\u002Fsc-raw-td><sc-raw-td>[A]<\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fbeec2;color:#6e5307\">Low–Moderate<\u002Fspan> — CrowdStrike's characterisation, unexplained; contradicted in tone by Falliere's plural<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n\n    <p style=\"font-size:15.5px;line-height:1.6;margin:0 0 22px;max-width:38em\"><strong>The operator remains publicly unidentified.<\u002Fstrong> No arrests, no indictment, no forfeiture, no sanctions — technical disruption only. <strong>[F, High<\u002Fstrong> — the DOJ release announces seizures and disruption only.<strong>]<\u002Fstrong><\u002Fp>\n\n    <h3 style=\"font-size:20px;margin:26px 0 10px\">11.1a Vendor attribution is not government attribution<\u002Fh3>\n    <p style=\"font-size:15.5px;line-height:1.6;margin:0 0 6px;max-width:38em\">This distinction matters enough to state separately, because it is easy to collapse and hard to un-say once published.<\u002Fp>\n\n    <figure style=\"margin:20px 0 26px\">\n      <div style=\"border-top:2px solid #201e1d;padding-top:9px\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0\">Exhibit 25<\u002Fdiv>\n        <div style=\"font-size:17px;margin:2px 0 14px\">Same day, same operation, two very different postures<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-raw-table class=\"table\" style=\"font-size:14px\">\n        <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:30%\"><\u002Fsc-raw-th><sc-raw-th style=\"width:35%\">CrowdStrike · 1 Sep 2026<\u002Fsc-raw-th><sc-raw-th>DOJ / USAO-CDCA · 1 Sep 2026<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n        <sc-raw-tbody>\n          <sc-raw-tr><sc-raw-td>Actor named<\u002Fsc-raw-td><sc-raw-td>SALTY SPIDER<\u002Fsc-raw-td><sc-raw-td style=\"color:#d6006c\">None<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Nationality<\u002Fsc-raw-td><sc-raw-td>Russian<\u002Fsc-raw-td><sc-raw-td style=\"color:#d6006c\">Not stated<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Location<\u002Fsc-raw-td><sc-raw-td>Bashkortostan (2019 post)<\u002Fsc-raw-td><sc-raw-td style=\"color:#d6006c\">Not stated<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Operator characterisation<\u002Fsc-raw-td><sc-raw-td>\"a single criminal actor\"<\u002Fsc-raw-td><sc-raw-td style=\"color:#d6006c\">None<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Motivation<\u002Fsc-raw-td><sc-raw-td>Assessed across three DDoS cases<\u002Fsc-raw-td><sc-raw-td style=\"color:#d6006c\">Not stated<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n      <div style=\"background:#201e1d;color:#f3f2f2;padding:13px 16px;margin-top:2px;font-size:16px\">The US government made no public attribution.<\u002Fdiv>\n      <figcaption style=\"font-size:10.5px;color:#7d7979;border-top:1px solid #d7d3d3;padding-top:7px;margin-top:12px\">Reuters reported that the Justice Department said Sality was based out of Russia, without further detail. That statement does <strong>not<\u002Fstrong> appear in the CDCA press release; it presumably came from a separate FBI or DOJ national statement or a press briefing. Locate that source before repeating it.<\u002Ffigcaption>\n    <\u002Ffigure>\n\n    <div class=\"keep\" style=\"margin:0 0 24px;padding-top:12px;border-top:1px solid #d6006c;max-width:38em\">\n      <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#d6006c;margin-bottom:6px\">Drafting instruction<\u002Fdiv>\n      <p style=\"font-size:14.5px;line-height:1.55;margin:0\">Write \"CrowdStrike assesses the operator to be Russian\" — never \"Sality is Russian-attributed\" unqualified, and never \"the US government attributes Sality to Russia.\" The absence of a charging document means there is no attribution that has been tested against an evidentiary standard.<\u002Fp>\n    <\u002Fdiv>\n\n    <h3 style=\"font-size:20px;margin:26px 0 10px\">11.2 Aliases<\u002Fh3>\n    <sc-raw-table class=\"table\" style=\"font-size:13.5px;margin-bottom:24px\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:26%\">Type<\u002Fsc-raw-th><sc-raw-th>Values<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td>Actor<\u002Fsc-raw-td><sc-raw-td>SALTY SPIDER (CrowdStrike)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Author handles<\u002Fsc-raw-td><sc-raw-td>Sector, iMAGER, Alien-Z<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Malware family<\u002Fsc-raw-td><sc-raw-td>Sality, KuKu, SalLoad, Kookoo, SaliCode, Kukacka, Win32.HLLP.Kuku<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>AV detections<\u002Fsc-raw-td><sc-raw-td>W32.Sality.AE, Virus.Win32.Sality, Virus:Win32/Sality<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Primary payload<\u002Fsc-raw-td><sc-raw-td>EggJagger (clipjacker)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Related tooling<\u002Fsc-raw-td><sc-raw-td>Win32/Pramro — SOCKS proxy trojan, shares code with Sality<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n\n    <h3 style=\"font-size:20px;margin:26px 0 10px\">11.3 Monetisation<\u002Fh3>\n    <figure style=\"margin:18px 0 26px\">\n      <div style=\"border-top:2px solid #201e1d;padding-top:9px\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0\">Exhibit 26<\u002Fdiv>\n        <div style=\"font-size:17px;margin:2px 0 14px\">Three business models in twenty-three years, and one abrupt pivot<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:5fr 9fr 9fr;gap:2px\">\n        <div style=\"background:#eae7e7;padding:12px 13px\">\n          <div style=\"font-size:11px;letter-spacing:0.1em;color:#605d5d\">2003–2008<\u002Fdiv>\n          <div style=\"font-size:15px;margin:4px 0 6px\">Info-stealer<\u002Fdiv>\n          <p style=\"font-size:12.5px;line-height:1.45;margin:0;color:#444141\">Basic file infector with email exfiltration.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#eae7e7;padding:12px 13px\">\n          <div style=\"font-size:11px;letter-spacing:0.1em;color:#605d5d\">2008–2017<\u002Fdiv>\n          <div style=\"font-size:15px;margin:4px 0 6px\">Pay-per-install<\u002Fdiv>\n          <p style=\"font-size:12.5px;line-height:1.45;margin:0;color:#444141\">Spam relay, SOCKS proxies, credential theft, website infection via stolen FTP credentials, distributed VoIP/SIP cracking, DDoS.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#cbeeff;padding:12px 13px\">\n          <div style=\"font-size:11px;letter-spacing:0.1em;color:#004961\">2017–2026<\u002Fdiv>\n          <div style=\"font-size:15px;margin:4px 0 6px;color:#004961\">Cryptocurrency<\u002Fdiv>\n          <p style=\"font-size:12.5px;line-height:1.45;margin:0;color:#006786\">EggJagger clipjacking. Proxy and spambot payloads dropped entirely in 2017 — an abrupt, complete pivot.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-raw-table class=\"table\" style=\"font-size:13.5px;margin-top:20px\">\n        <sc-raw-thead><sc-raw-tr><sc-raw-th>Metric<\u002Fsc-raw-th><sc-raw-th style=\"width:30%\">Value<\u002Fsc-raw-th><sc-raw-th style=\"width:26%\">Confidence<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n        <sc-raw-tbody>\n          <sc-raw-tr><sc-raw-td>Actual damages, EggJagger only<\u002Fsc-raw-td><sc-raw-td><strong>~RUB 12.1M (~US$150,000)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>[F] <span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fbe6cd;color:#7a4a13\">Moderate<\u002Fspan> — CrowdStrike estimate, method not published<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Peak never-spent portfolio value<\u002Fsc-raw-td><sc-raw-td><strong>~RUB 147M<\u002Fstrong>, January 2025<\u002Fsc-raw-td><sc-raw-td>[F] <span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fbe6cd;color:#7a4a13\">Moderate<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Nominal USD at peak<\u002Fsc-raw-td><sc-raw-td>~US$1.35M<\u002Fsc-raw-td><sc-raw-td>[F] <span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fbe6cd;color:#7a4a13\">Moderate<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>CrowdStrike's purchasing-power framing<\u002Fsc-raw-td><sc-raw-td>≈ US$4M in a Western capital<\u002Fsc-raw-td><sc-raw-td>[A] <span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fbeec2;color:#6e5307\">Low<\u002Fspan> — a rhetorical comparison, not a measurement<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n      <figcaption style=\"font-size:10.5px;color:#7d7979;border-top:1px solid #d7d3d3;padding-top:7px;margin-top:12px\"><strong>Do not combine these figures into a single conversion.<\u002Fstrong> RUB 12.1M ≈ US$150,000 implies ~81 RUB/USD; RUB 147M ≈ US$1.35M implies ~109 RUB/USD. The figures are from different periods — cumulative realised versus January 2025 peak — so the implied rates differ. Quote them separately with their periods attached.<\u002Ffigcaption>\n    <\u002Ffigure>\n\n    <p style=\
