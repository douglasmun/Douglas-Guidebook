document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

e full four-color set. Cyan and magenta are the system's own accents;\n     this yellow completes them, muted to the same press-ink register. A\n     print treatment color, not an interface accent — body copy and chrome\n     never take it. */\n  --color-process-yellow: #edbb00;\n\n  --font-heading: \"Source Serif 4\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Source Serif 4\", system-ui, sans-serif;\n\n  --space-1: 5.0px;\n  --space-2: 10.0px;\n  --space-3: 15.0px;\n  --space-4: 20.0px;\n  --space-6: 30.0px;\n  --space-8: 40.0px;\n\n  --radius-sm: 1px;\n  --radius-md: 2px;\n  --radius-lg: 4px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.halftone{position:relative;filter:grayscale(0.35) contrast(1.15);overflow:hidden}\n.halftone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background-image:radial-gradient(circle,rgba(0,0,0,0.22) 30%,transparent 32%);\n  background-size:3px 3px;mix-blend-mode:multiply}\n\n/* The four-color separation treatment (review round 3) — a photograph\n   printed as its misregistered process plates, after the Catalogue Three\n   grammar. Markup: a figure.cmyk holding five copies of the image — the\n   first is the layout sizer (hidden), then one per plate, each tagged\n   .sep-c/.sep-m/.sep-y/.sep-k. The plates are extracted live by the SVG\n   feColorMatrix filters in print-plates.js, the system's own defs —\n   inlined in the compiled bundle every template page loads, and a\n   page that links styles.css directly adds\n   <script src=\"print-plates.js\"><\u002Fscript> itself (the defs must be in\n   the document: a data-URI filter reference would not survive Chromium,\n   and external-file references are unreliable across engines) — nudged\n   a few pixels out of register, and multiplied\n   onto the paper ground; the halftone dot screens the recombined print.\n   The plate offsets live with the deck's projection-scale CSS, since\n   misregistration is sized to the output. */\n.cmyk{position:relative;overflow:hidden;background:var(--color-bg)}\n.cmyk img:first-child{opacity:0} /* layout sizer AND the alt-bearing image — opacity\n  keeps it in the accessibility tree (visibility:hidden would drop the figure's only\n  description); fully transparent, it adds nothing to the multiply backdrop */\n.cmyk img+img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}\n.cmyk .sep-c{filter:url(#sep-c)}\n.cmyk .sep-m{filter:url(#sep-m)}\n.cmyk .sep-y{filter:url(#sep-y)}\n.cmyk .sep-k{filter:url(#sep-k)}\n.cmyk::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background-image:radial-gradient(circle,rgba(0,0,0,0.22) 30%,transparent 32%);\n  background-size:3px 3px;mix-blend-mode:multiply}\n\n/* The one-image separation (review round 9, promoted from the deck in the\n   landing divergence) — the same four plates as ONE compound filter,\n   #sep-all in print-plates.js, for a single swappable image: a .print\n   wrapper inside the figure holds one <image-slot>, and the filter\n   extracts, offsets and multiplies the plates live from whatever the slot\n   shows. Markup: figure.cmyk > .print > image-slot (the page sizes the\n   .print — aspect-ratio, or absolute fill for bleeds). Hover resolves\n   the print into the photograph — the pressman checking registration on\n   the light table — so the source shows crisp and any swap chrome stays\n   legible; only the reduced-motion fallback below still lifts as a\n   single cut (a url() filter cannot CSS-transition; the press driver\n   animates the defs instead). */\n.cmyk .print{position:relative;width:100%;filter:url(#sep-all)}\n/* no hover end-state swap: the press driver (print-plates.js) eases the\n   plates into register while purifying their inks to the pure-process\n   separation on the same curve, so the converged four-plate merge IS\n   the photograph (their multiply equals SourceGraphic by construction)\n   — no cut anywhere on the animated path */\n@media (prefers-reduced-motion: reduce), (hover: none), (pointer: coarse) {\n  .cmyk .print:hover{filter:none} /* without the driver (it stands down on\n    exactly these conditions), hover stays the old single cut to the\n    crisp source */\n}\n.cmyk .print image-slot{width:100%;height:100%;display:block}\n\n/* The plate numeral (review rounds 3-4) — display figures set as\n   misregistered process plates, the catalog's cover grammar. Review\n   round 4 (Barron): THREE plates — C, M, Y only, no black plate — so the\n   dark core comes entirely from the C×M×Y multiply overlap (the inks\n   product to exact black), with the fringes the registration drift; and\n   the spread pulled in by half (less jumbled: one figure with plate\n   fringes rather than figures sliding apart). Markup: a .cmyk-num holding\n   a .paper span (the white of the sheet: the glyph's union, built from\n   offset text-shadow copies) and three .plate spans. The construction\n   carries its own ground (--cmyk-num-ground, defaulting to paper) painted\n   on its padding box, so the multiply plates always have their backdrop\n   even inside an isolated stacking context (entrance animations); the\n   padding bleeds wider than any plate offset and the negative margin\n   hands the layout box back. Offsets are em-scaled to the glyph. The\n   .paper span carries the text once for assistive tech; the .plate spans\n   are aria-hidden repeats. */\n.cmyk-num{--cmyk-num-ground:var(--color-bg);\n  position:relative;width:fit-content;line-height:0.9;\n  font-feature-settings:\"pnum\" 1;\n  background:var(--cmyk-num-ground);padding:0.12em;margin:-0.12em}\n.cmyk-num .paper{color:var(--color-bg); /* the white of the sheet — always paper,\n  whatever the ground: the plates read as printed on paper even when the\n  surrounding page is ink */\n  text-shadow:0.036em 0.025em 0 var(--color-bg),-0.031em -0.023em 0 var(--color-bg)}\n.cmyk-num .plate{position:absolute;inset:0.12em;mix-blend-mode:multiply;\n  text-box:trim-both cap alphabetic /* the host trims to its cap box; each\n  absolute plate must trim its own line the same way, or its glyphs sit a\n  half-leading below the paper union */}\n.cmyk-num .plate-c{color:var(--color-accent)}\n\n/* The plate headline (divergence round 3, Barron: \"use both\" — the\n   photograph's plates AND the cover grammar's text plates, on the same\n   page). The same three-plate construction as .cmyk-num — paper span\n   carrying the real text, C/M/Y plate repeats, dark core from the\n   multiply overlap — at HALF the numeral's round-4 offsets: the serif's\n   display hairlines are thinner than the numeral strokes the spread was\n   measured on, and the full offsets swallow them whole (probed at the\n   hero's 80px — the fringes read as an anaglyph poster, not a breath\n   out of register) — recut for display\n   headlines that sit in running text blocks on the page's own paper:\n   no ground painting and no padding bleed (the numeral's ground exists\n   for isolated stacking contexts; a headline on the page multiplies\n   straight onto the sheet), no width:fit-content and no line-height\n   override (the host display class owns its metrics — apply this to\n   each .line, which is position:relative for its plates), and the\n   plates are inert to the hand (pointer-events/user-select none, so a\n   triple-click selects the headline once, not four times). Plates take\n   the same pointer lean as .cmyk-num. */\n.cmyk-head{position:relative}\n.cmyk-head .paper{color:var(--color-bg);\n  text-shadow:0.027em 0.0185em 0 var(--color-bg),-0.0245em -0.0175em 0 var(--color-bg)\n  /* the union's copies sit at the construction's halved plate offsets\n     PLUS the full lean (0.018+0.009 / 0.0125+0.006, and mirrored), so\n     the union still backs the plates at viewport-edge lean — invisible\n     on the page's own paper, load-bearing on any other ground */}\n.cmyk-head .plate{position:absolute;inset:0;mix-blend-mode:multiply;\n  pointer-events:none;user-select:none;\n  text-box:trim-both cap alphabetic /* match the host's trim, or the\n  plates sit a half-leading below the paper union */}\n.cmyk-head .plate-c{color:var(--color-accent)}\n.cmyk-head .plate-m{color:var(--color-accent-2);\n  translate:calc(0.018em + 0.009em*var(--press-nx, 0)) calc(0.0125em + 0.006em*var(--press-ny, 0))}\n.cmyk-head .plate-y{color:var(--color-process-yellow);\n  translate:calc(-0.0155em + 0.009em*var(--press-nx, 0)) calc(-0.0115em + 0.006em*var(--press-ny, 0))}\n.cmyk-num .plate-m{color:var(--color-accent-2);\n  translate:calc(0.036em + 0.018em*var(--press-nx, 0)) calc(0.025em + 0.0125em*var(--press-ny, 0))}\n.cmyk-num .plate-y{color:var(--color-process-yellow);\n  translate:calc(-0.031em + 0.018em*var(--press-nx, 0)) calc(-0.023em + 0.0125em*var(--press-ny, 0))}\n/* --press-nx/--press-ny: the pointer lean as a bare -1..1 factor,\n   published on :root by the press driver (print-plates.js) and zero\n   whenever the driver stands down. Each construction scales the lean to\n   its own spread (half of it, here as everywhere) so the moving plates\n   drift a breath toward the cursor and the C plate holds. */\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input::placeholder { color: color-mix(in srgb, var(--color-text) 65%, transparent); opacity: 1; }\n  /* explicit, measured: the browser default gray misses the 4.5:1 small-text bar on\n     the surface fill; 65% ink measures 4.8:1 there, still a step quieter than typed\n     text (opacity:1 overrides Firefox's default placeholder fade) */\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n  <script src=\"3e850591-4f82-436f-a3d5-ee226c61d96c\"><\u002Fscript>\n  <script src=\"e5ae627e-3e43-4c94-938b-eb08478d2217\"><\u002Fscript>\n  <style>\n    doc-page:not(:defined) { visibility: hidden; }\n    body { margin: 0; }\n    a { color: #006786; text-decoration: none; border-bottom: 1px solid #99e0ff; }\n    a:hover { color: #d6006c; border-bottom-color: #ffc0d0; }\n    figure, .keep { break-inside: avoid; }\n    figure svg, figure img { break-inside: avoid; }\n    table.table { break-inside: avoid; }\n    table.splitok { break-inside: auto; }\n    .table thead { display: table-header-group; }\n    .table tr, .table td, .table th { break-inside: avoid; }\n    .table { border-collapse: collapse; border: 1px solid #c9c5c5; }\n    .table th, .table td { border: 1px solid #d7d3d3; vertical-align: top; }\n    .table thead th { background: #e4e1e1; border-bottom: 1px solid #c9c5c5; }\n    .table tbody tr:nth-child(even) { background: #ebe9e9; }\n    .table tbody tr:hover { background: inherit; }\n    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }\n    h2, h3, h4 { break-after: avoid; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<doc-page size=\"a4\" margin=\"0.7in\">\n\n  <div slot=\"header\" style=\"display:flex;justify-content:space-between;align-items:baseline;font-size:9.5px;letter-spacing:0.13em;text-transform:uppercase;color:#7d7979;padding-bottom:6px;border-bottom:1px solid #d7d3d3\">\n    <span>Sality / SALTY SPIDER — Technical and Actor Deep Dive<\u002Fspan>\n    <span>TLP:CLEAR<\u002Fspan>\n  <\u002Fdiv>\n\n  <div slot=\"footer\" style=\"display:flex;justify-content:space-between;align-items:baseline;font-size:9.5px;letter-spacing:0.13em;text-transform:uppercase;color:#7d7979;padding-top:6px;border-top:1px solid #d7d3d3\">\n    <span>Prepared from open sources · Version 1.0<\u002Fspan>\n    <span>2 September 2026<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"border-top:5px solid #201e1d;padding-top:7px;margin-top:34px\">\n    <div style=\"border-top:1px solid #201e1d;padding-top:9px;display:flex;justify-content:space-between;align-items:baseline;font-size:10.5px;letter-spacing:0.15em;text-transform:uppercase;color:#605d5d\">\n      <span>Counter-adversary assessment<\u002Fspan>\n      <span style=\"color:#0088b0\">Takedown-applicability baseline<\u002Fspan>\n      <span>Version 1.0 · 2 Sep 2026<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h1 style=\"font-size:60px;line-height:0.98;letter-spacing:-0.025em;margin:38px 0 0;max-width:20em\">Sality and the anatomy of a peer-to-peer takedown<\u002Fh1>\n\n  <p style=\"font-size:22px;line-height:1.32;font-style:italic;color:#444141;margin:20px 0 0;max-width:26em\">The Sality P2P botnet, the actor CrowdStrike tracks as SALTY SPIDER, and the multinational disruption executed on 31 August 2026 — read for what it teaches about attacking decentralised overlays.<\u002Fp>\n\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin:44px 0 0;padding-top:16px;border-top:1px solid #201e1d\">\n    <div>\n      <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0;margin-bottom:5px\">Machines reachable<\u002Fdiv>\n      <div style=\"font-size:38px;line-height:1;letter-spacing:-0.02em\">&gt;15,000<\u002Fdiv>\n      <div style=\"font-size:12px;color:#605d5d;margin-top:5px\">payload-reachable at disruption, down roughly two orders of magnitude from peak<\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0;margin-bottom:5px\">Years in operation<\u002Fdiv>\n      <div style=\"font-size:38px;line-height:1;letter-spacing:-0.02em\">23<\u002Fdiv>\n      <div style=\"font-size:12px;color:#605d5d;margin-top:5px\">first public sample June 2003; RSA keys unchanged since at least 2011<\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0;margin-bottom:5px\">Disjoint networks<\u002Fdiv>\n      <div style=\"font-size:38px;line-height:1;letter-spacing:-0.02em\">2<\u002Fdiv>\n      <div style=\"font-size:12px;color:#605d5d;margin-top:5px\">v3 and v4 — one codebase, one operator, incompatible protocols, different keys<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:34px;margin:40px 0 0;padding-top:18px;border-top:1px solid #d7d3d3\">\n    <div>\n      <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#7d7979;margin-bottom:4px\">Author<\u002Fdiv>\n      <p style=\"font-size:14.5px;margin:0 0 16px\">Douglas Mun, with AI assistance<\u002Fp>\n      <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#7d7979;margin-bottom:4px\">Purpose<\u002Fdiv>\n      <p style=\"font-size:14.5px;margin:0 0 16px\">Technical baseline for a takedown-applicability assessment<\u002Fp>\n      <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#7d7979;margin-bottom:4px\">Classification<\u002Fdiv>\n      <p style=\"font-size:14.5px;margin:0\">TLP:CLEAR — public, unrestricted distribution<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#7d7979;margin-bottom:4px\">Sourcing<\u002Fdiv>\n      <p style=\"font-size:14px;line-height:1.5;margin:0 0 10px\">Primary: CrowdStrike Counter Adversary Operations, <em>Peer Pressure: Inside the Sality Botnet Disruption Operation<\u002Fem>, 1 September 2026. Second primary source, independent of the vendor: U.S. Department of Justice, Central District of California, release 26-149, 1 September 2026.<\u002Fp>\n      <p style=\"font-size:14px;line-height:1.5;margin:0\">Technical depth from Falliere, <em>Sality: Story of a Peer-to-Peer Viral Network<\u002Fem> (Symantec, 2011); Rossow, Andriesse, Werner et al., <em>SoK: P2PWNED<\u002Fem> (IEEE S&amp;P 2013); Kleissner, <em>Sality 2003–Today<\u002Fem> (Botconf 2015); Dragos ICS research; open reporting.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"font-size:13.5px;line-height:1.55;font-style:italic;color:#444141;margin:30px 0 0;padding-top:14px;border-top:1px solid #d7d3d3\">Every judgement in this document carries its own confidence rating, defined in Section 1 and applied individually. There is no single overall confidence rating, because there should not be one.<\u002Fp>\n\n  <div style=\"break-before:page;padding-top:2px\">\n    <div style=\"font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0;margin-bottom:8px\">Contents<\u002Fdiv>\n    <h2 style=\"font-size:34px;margin:0 0 24px;padding-bottom:14px;border-bottom:2px solid #201e1d\">What is in this document<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:6px 40px;font-size:14px\">\n      <div style=\"display:flex;gap:12px;padding:5px 0;border-bottom:1px solid #eae7e7\"><span style=\"color:#0088b0;min-width:1.6em\">01<\u002Fspan><span>Analytic confidence lexicon<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:12px;padding:5px 0;border-bottom:1px solid #eae7e7\"><span style=\"color:#0088b0;min-width:1.6em\">10<\u002Fspan><span>Precedent — the technique lineage<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:12px;padding:5px 0;border-bottom:1px solid #eae7e7\"><span style=\"color:#0088b0;min-width:1.6em\">02<\u002Fspan><span>Key judgements<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:12px;padding:5px 0;border-bottom:1px solid #eae7e7\"><span style=\"color:#0088b0;min-width:1.6em\">11<\u002Fspan><span>Actor profile — SALTY SPIDER<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:12px;padding:5px 0;border-bottom:1px solid #eae7e7\"><span style=\"color:#0088b0;min-width:1.6em\">03<\u002Fspan><span>Timeline, 2003–2026<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:12px;padding:5px 0;border-bottom:1px solid #eae7e7\"><span style=\"color:#0088b0;min-width:1.6em\">12<\u002Fspan><span>Protocol ossification<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:12px;padding:5px 0;border-bottom:1px solid #eae7e7\"><span style=\"color:#0088b0;min-width:1.6em\">04<\u002Fspan><span>Host-side architecture<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:12px;padding:5px 0;border-bottom:1px solid #eae7e7\"><span style=\"color:#0088b0;min-width:1.6em\">13<\u002Fspan><span>Disruption is not remediation<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:12px;padding:5px 0;border-bottom:1px solid #eae7e7\"><span style=\"color:#0088b0;min-width:1.6em\">05<\u002Fspan><span>The peer-to-peer layer<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:12px;padding:5px 0;border-bottom:1px solid #eae7e7\"><span style=\"color:#0088b0;min-width:1.6em\">14<\u002Fspan><span>Detection, hunting and remediation<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:12px;padding:5px 0;border-bottom:1px solid #eae7e7\"><span style=\"color:#0088b0;min-width:1.6em\">06<\u002Fspan><span>The trust model — where the surface is<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:12px;padding:5px 0;border-bottom:1px solid #eae7e7\"><span style=\"color:#0088b0;min-width:1.6em\">15<\u002Fspan><span>Applicability assessment<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:12px;padding:5px 0;border-bottom:1px solid #eae7e7\"><span style=\"color:#0088b0;min-width:1.6em\">07<\u002Fspan><span>The disruption operation<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:12px;padding:5px 0;border-bottom:1px solid #eae7e7\"><span style=\"color:#0088b0;min-width:1.6em\">16<\u002Fspan><span>Residual gaps<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:12px;padding:5px 0;border-bottom:1px solid #eae7e7\"><span style=\"color:#0088b0;min-width:1.6em\">08<\u002Fspan><span>NAT, seizures and the tasking race<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:12px;padding:5px 0;border-bottom:1px solid #eae7e7\"><span style=\"color:#0088b0;min-width:1.6em\">17<\u002Fspan><span>Source list<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:12px;padding:5px 0;border-bottom:1px solid #eae7e7\"><span style=\"color:#0088b0;min-width:1.6em\">09<\u002Fspan><span>Scale and trajectory<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:12px;padding:5px 0;border-bottom:1px solid #eae7e7\"><span style=\"color:#7d7979;min-width:1.6em\">—<\u002Fspan><span style=\"color:#605d5d\">26 exhibits, numbered throughout<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"break-before:page\">\n    <div style=\"font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0;margin-bottom:8px\">Executive summary<\u002Fdiv>\n    <h2 style=\"font-size:34px;margin:0 0 20px;padding-bottom:14px;border-bottom:2px solid #201e1d;max-width:28em\">The technique is the story, not the botnet<\u002Fh2>\n\n    <p style=\"font-size:17px;line-height:1.5;margin:0 0 16px;max-width:36em\">On Monday 31 August 2026, CrowdStrike — working inside a coordinated law-enforcement operation with the DOJ, FBI, DCIS, Europol, Eurojust and national authorities in Bulgaria, Hungary and Romania — disrupted Sality, a peer-to-peer botnet that had run continuously since 2003. Two independent sources confirm the operation happened and describe its shape. Neither describes it as a decapitation of an active giant, and a write-up built on botnet size will not survive scrutiny.<\u002Fp>\n\n    <p style=\"margin:0 0 16px;font-size:15.5px;line-height:1.62;max-width:36em\">What was disrupted was a long decline: something over 15,000 machines were reachable for payload delivery, against measured populations in the hundreds of thousands to low millions between 2011 and 2015. What makes the operation significant is architectural. Sality was rated <em>extremely resilient<\u002Fem> in the peer-reviewed literature. It was taken apart without the operator's signing key, without access to a single victim machine, and by using the malware's own protocol against itself.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:22px 32px;margin:28px 0 4px\">\n      <div class=\"keep\" style=\"padding-top:12px;border-top:2px solid #0088b0\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0;margin-bottom:6px\">Finding one<\u002Fdiv>\n        <div style=\"font-size:18px;line-height:1.22;margin-bottom:7px\">An authentication asymmetry, not a cryptographic break<\u002Fdiv>\n        <p style=\"font-size:13.5px;line-height:1.5;margin:0;color:#444141\">Payload tasking was RSA-signed and unforgeable. Peer identity was not authenticated at all. The defender attacked the control plane and left the data plane alone.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"keep\" style=\"padding-top:12px;border-top:2px solid #0088b0\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0;margin-bottom:6px\">Finding two<\u002Fdiv>\n        <div style=\"font-size:18px;line-height:1.22;margin-bottom:7px\">The weakness was permanent by construction<\u002Fdiv>\n        <p style=\"font-size:13.5px;line-height:1.5;margin:0;color:#444141\">A file infector cannot patch its installed population: a new strain competes with the old for the same host files. The RSA keys are byte-identical between 2011 and 2026 — verified here directly.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"keep\" style=\"padding-top:12px;border-top:2px solid #0088b0\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0;margin-bottom:6px\">Finding three<\u002Fdiv>\n        <div style=\"font-size:18px;line-height:1.22;margin-bottom:7px\">Disruption is quarantine, not cleanup<\u002Fdiv>\n        <p style=\"font-size:13.5px;line-height:1.5;margin:0;color:#444141\">Every infected executable on every victim disk remains infected and active. File infection and lateral spread almost certainly continue, because sinkhole entries leave peer lists non-empty.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"keep\" style=\"padding-top:12px;border-top:2px solid #d6006c\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#d6006c;margin-bottom:6px\">Finding four<\u002Fdiv>\n        <div style=\"font-size:18px;line-height:1.22;margin-bottom:7px\">Vendor attribution is not government attribution<\u002Fdiv>\n        <p style=\"font-size:13.5px;line-height:1.5;margin:0;color:#444141\">CrowdStrike names SALTY SPIDER and places the actor in Bashkortostan, Russia. The DOJ release makes no attribution claim of any kind, and there is no charging document. Do not publish \"Russia-attributed\" as a government finding.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"keep\" style=\"margin:32px 0 0;padding-top:14px;border-top:1px solid #201e1d\">\n      <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#d6006c;margin-bottom:8px\">The one line to take away<\u002Fdiv>\n      <p style=\"font-size:20px;line-height:1.38;font-style:italic;margin:0;max-width:32em\">Attack the unauthenticated control-plane topology of a decentralised overlay, not its authenticated command payloads — by controlling who bots believe they should talk to, the defender never needs the operator's key.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:30px;padding-top:14px;border-top:1px solid #d7d3d3\">\n      <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#7d7979;margin-bottom:10px\">What to do about it<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:14.5px;line-height:1.45\">\n        <span style=\"color:#0088b0\">01<\u002Fspan><span>Alert on UDP traffic to <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13px\">188.166.101.148<\u002Fspan>. Any hit is a confirmed infection requiring remediation.<\u002Fspan>\n        <span style=\"color:#0088b0\">02<\u002Fspan><span>Deploy both published YARA rules against <em>running processes<\u002Fem>, not files on disk.<\u002Fspan>\n        <span style=\"color:#0088b0\">03<\u002Fspan><span>Treat every infected host as still spreading to mapped drives, shares and removable media — the symptoms are now quieter, not absent.<\u002Fspan>\n        <span style=\"color:#0088b0\">04<\u002Fspan><span>Where EDR cannot run, pre-create the <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13px\">uxJLpe1m<\u002Fspan> mutex as a compensating control. Test before fleet deployment.<\u002Fspan>\n        <span style=\"color:#0088b0\">05<\u002Fspan><span>Defer any regional exposure claim: the usable geography is eleven years old. Obtain CrowdStrike's infection-geography breakdown first.<\u002Fspan>\n        <span style=\"color:#0088b0\">06<\u002Fspan><span>Confirm victim-notification reach with SingCERT or your national CSIRT rather than assuming the Shadowserver pathway lands locally.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"break-before:page\">\n    <div style=\"font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0;margin-bottom:8px\">Section 01<\u002Fdiv>\n    <h2 style=\"font-size:32px;margin:0 0 18px;padding-bottom:12px;border-bottom:2px solid #201e1d\">Analytic confidence lexicon<\u002Fh2>\n    <p style=\"font-size:16px;line-height:1.5;margin:0 0 18px;max-width:36em\">Defined once, here, and applied per judgement everywhere else. Confidence expresses <em>how much weight the evidence and reasoning bear<\u002Fem>. It is not a probability that an event will occur, and it is not a measure of how strongly the analyst feels. A single overall rating for a whole report is not usable — attribution may rest on thin ground while the technical characterisation is solid.<\u002Fp>\n\n    <figure style=\"margin:26px 0 30px\">\n      <div style=\"border-top:2px solid #201e1d;padding-top:9px\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0\">Exhibit 1<\u002Fdiv>\n        <div style=\"font-size:17px;margin:2px 0 16px\">Three levels, and what each one licenses<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:20px\">\n        <div class=\"keep\" style=\"background:#fadfda;padding:16px 15px\">\n          <div style=\"font-size:22px;margin-bottom:8px;color:#7d2018\">High<\u002Fdiv>\n          <p style=\"font-size:12.5px;line-height:1.5;margin:0;color:#7d2018\">Primary or independently verifiable evidence. The inferential chain is short. Credible alternatives examined and set aside. New information would refine rather than overturn.<\u002Fp>\n          <div style=\"margin-top:12px;padding-top:8px;border-top:1px solid #eebdb4;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:#7d2018\">Can carry a decision<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"keep\" style=\"background:#fbe6cd;padding:16px 15px\">\n          <div style=\"font-size:22px;margin-bottom:8px;color:#7a4a13\">Moderate<\u002Fdiv>\n          <p style=\"font-size:12.5px;line-height:1.5;margin:0;color:#7a4a13\">Credible but incomplete — single-sourced, partially corroborated, dated, or reached through several inferential steps. Alternatives remain open. New information could reasonably shift it.<\u002Fp>\n          <div style=\"margin-top:12px;padding-top:8px;border-top:1px solid #edcfa8;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:#7a4a13\">Carries a decision with hedges<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"keep\" style=\"background:#fbeec2;padding:16px 15px\">\n          <div style=\"font-size:22px;margin-bottom:8px;color:#6e5307\">Low<\u002Fdiv>\n          <p style=\"font-size:12.5px;line-height:1.5;margin:0;color:#6e5307\">Fragmentary, uncorroborated, dated or interested reporting, or a long chain of inference. Recorded because the question is decision-relevant, not because the answer is secure.<\u002Fp>\n          <div style=\"margin-top:12px;padding-top:8px;border-top:1px solid #ecd894;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:#6e5307\">Must not carry a decision alone<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <figcaption style=\"font-size:10.5px;color:#7d7979;border-top:1px solid #d7d3d3;padding-top:7px;margin-top:14px\">Source: analytic standard applied in this document. Confidence and likelihood are orthogonal; likelihood uses a separate vocabulary — almost certainly, highly likely, likely, realistic possibility, unlikely, highly unlikely.<\u002Ffigcaption>\n    <\u002Ffigure>\n\n    <h3 style=\"font-size:20px;margin:26px 0 12px\">1.2 Rules of application<\u002Fh3>\n    <div style=\"display:grid;grid-template-columns:auto 1fr;gap:11px 16px;font-size:14.5px;line-height:1.5;max-width:38em\">\n      <span style=\"color:#0088b0\">1<\u002Fspan><span><strong>Confidence is not likelihood.<\u002Fstrong> One can hold high confidence that something is unlikely.<\u002Fspan>\n      <span style=\"color:#0088b0\">2<\u002Fspan><span><strong>Confidence is not source count.<\u002Fstrong> Ten outlets recycling one wire story are one source. Corroboration requires independent origin, not repetition.<\u002Fspan>\n      <span style=\"color:#0088b0\">3<\u002Fspan><span><strong>Confidence is not conviction.<\u002Fstrong> Analyst certainty is not evidence.<\u002Fspan>\n      <span style=\"color:#0088b0\">4<\u002Fspan><span><strong>Interested sourcing caps confidence.<\u002Fstrong> A vendor's account of its own operation is primary for <em>what was done<\u002Fem> and weaker for <em>how well it worked<\u002Fem>.<\u002Fspan>\n      <span style=\"color:#0088b0\">5<\u002Fspan><span><strong>Split compound judgements.<\u002Fstrong> Where an event and its interpretation carry different evidential weight, they are rated separately.<\u002Fspan>\n      <span style=\"color:#0088b0\">6<\u002Fspan><span><strong>Age degrades confidence.<\u002Fstrong> Technical facts about a 2011 protocol version do not automatically hold in 2026 unless continuity is separately evidenced.<\u002Fspan>\n    <\u002Fdiv>\n\n    <h3 style=\"font-size:20px;margin:30px 0 12px\">1.3 Statement-type tags<\u002Fh3>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:18px;font-size:13.5px;line-height:1.5\">\n      <div><span style=\"font-size:17px;color:#0088b0\">[F]<\u002Fspan> &nbsp;<strong>Fact<\u002Fstrong><p style=\"margin:5px 0 0;color:#444141\">Directly evidenced and attributable to a named source, or independently verifiable.<\u002Fp><\u002Fdiv>\n      <div><span style=\"font-size:17px;color:#0088b0\">[A]<\u002Fspan> &nbsp;<strong>Assessment<\u002Fstrong><p style=\"margin:5px 0 0;color:#444141\">Analyst judgement extending beyond what the evidence states.<\u002Fp><\u002Fdiv>\n      <div><span style=\"font-size:17px;color:#d6006c\">[X]<\u002Fspan> &nbsp;<strong>Assumption<\u002Fstrong><p style=\"margin:5px 0 0;color:#444141\">Accepted without direct evidence and load-bearing. If it fails, dependent judgements fail with it.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"font-size:20px;margin:32px 0 12px\">1.4 Load-bearing assumptions in this document<\u002Fh3>\n    <sc-raw-table class=\"table\" style=\"font-size:13.5px\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:52px\">#<\u002Fsc-raw-th><sc-raw-th style=\"width:33%\">Assumption<\u002Fsc-raw-th><sc-raw-th>If it fails<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td style=\"color:#d6006c\">X-1<\u002Fsc-raw-td><sc-raw-td>CrowdStrike's account of its own operation is accurate and complete in outline, even where it withholds specifics.<\u002Fsc-raw-td><sc-raw-td>Sections 6, 7 and 8 and all operational conclusions become unreliable. <strong>Partially discharged:<\u002Fstrong> the DOJ release independently corroborates the fact and shape of the operation — execution on Monday 31 August; a peer-to-peer sinkhole operation; domain seizures in the US and in Bulgaria, Hungary and Romania; Europol and Eurojust participation; Shadowserver's victim-notification role. <strong>Undischarged for mechanics, scale and effect:<\u002Fstrong> DOJ states no infection count, no technical mechanism, no financial figures, and makes no completeness claim.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"color:#d6006c\">X-2<\u002Fsc-raw-td><sc-raw-td>Protocol behaviour documented by Falliere in 2011 still describes the code live in August 2026.<\u002Fsc-raw-td><sc-raw-td>Section 3, Section 4 and the detection logic in 14.4 degrade. <strong>Partially discharged:<\u002Fstrong> the frozen RSA keys (12.1) and the <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">IPFILTERDRIVER<\u002Fspan> string in the 2026 YARA rules both evidence continuity, and CrowdStrike's description of the 40-minute cycle and peer-list semantics matches Falliere.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"color:#d6006c\">X-3<\u002Fsc-raw-td><sc-raw-td>The ~15,000 figure and the historical population figures measure comparable populations.<\u002Fsc-raw-td><sc-raw-td>Section 9 magnitude claims fail. <strong>This assumption is known to be weak<\u002Fstrong> and is treated as such throughout.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n  <\u002Fdiv>\n\n  <div style=\"break-before:page\">\n    <div style=\"font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0;margin-bottom:8px\">Section 02<\u002Fdiv>\n    <h2 style=\"font-size:32px;margin:0 0 18px;padding-bottom:12px;border-bottom:2px solid #201e1d\">Key judgements<\u002Fh2>\n    <p style=\"font-size:16px;line-height:1.5;margin:0 0 20px;max-width:36em\">Thirteen judgements, rated individually. Where an occurrence and its interpretation carry different evidential weight they are split — KJ-6, KJ-8 and KJ-9 each appear as lettered pairs for that reason. The table runs over three pages; the column headings repeat on each.<\u002Fp>\n    <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#7d7979;margin-bottom:10px\">Key judgements (1 of 3)<\u002Fdiv>\n\n    <sc-raw-table class=\"table\" style=\"font-size:13.5px\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:62px\">#<\u002Fsc-raw-th><sc-raw-th>Judgement<\u002Fsc-raw-th><sc-raw-th style=\"width:48px\">Type<\u002Fsc-raw-th><sc-raw-th style=\"width:24%\">Confidence<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td><strong>KJ-1<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Target is <strong>Sality<\u002Fstrong>, operated by <strong>SALTY SPIDER<\u002Fstrong>. Two disjoint P2P networks, <strong>v3 and v4<\u002Fstrong>, live at disruption — same codebase, same operator, incompatible protocols, different keys.<\u002Fsc-raw-td><sc-raw-td>[F]<\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fadfda;color:#7d2018\">High<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><strong>KJ-2<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>Layered disruption<\u002Fstrong>, not a single technique: P2P sinkholing via peer-list manipulation <em>plus<\u002Fem> coordinated payload-URL takedown, the latter explicitly covering the transition period.<\u002Fsc-raw-td><sc-raw-td>[F]<\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fadfda;color:#7d2018\">High<\u002Fspan><div style=\"font-size:11.5px;color:#605d5d;margin-top:4px\">Corroborated by DOJ, which independently describes a P2P sinkhole operation alongside domain seizures<\u002Fdiv><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><strong>KJ-3<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>The exploited weakness is an <strong>authentication asymmetry<\u002Fstrong>: payload tasking RSA-signed and unforgeable; peer identity not authenticated at all.<\u002Fsc-raw-td><sc-raw-td>[F]<\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fadfda;color:#7d2018\">High<\u002Fspan><div style=\"font-size:11.5px;color:#605d5d;margin-top:4px\">Stated by CrowdStrike, independently corroborated by Falliere (2011) and P2PWNED (2013)<\u002Fdiv><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><strong>KJ-4<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Generalisable technique: <em>attack the unauthenticated control-plane topology of a decentralised overlay, not its authenticated command payloads.<\u002Fem> The <strong>specific<\u002Fstrong> Sality primitive is not portable.<\u002Fsc-raw-td><sc-raw-td>[A]<\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fbe6cd;color:#7a4a13\">Moderate<\u002Fspan><div style=\"font-size:11.5px;color:#605d5d;margin-top:4px\">Sound abstraction, and CrowdStrike places Sality in the GameOver Zeus / Kelihos lineage, but transferability to any named future target is untested<\u002Fdiv><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><strong>KJ-5<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>Protocol ossification.<\u002Fstrong> A file infector cannot be patched without the new strain competing with the old for the same host files, fragmenting rather than upgrading the botnet. Weaknesses are therefore permanent.<\u002Fsc-raw-td><sc-raw-td>[A]<\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fadfda;color:#7d2018\">High<\u002Fspan><div style=\"font-size:11.5px;color:#605d5d;margin-top:4px\">Two independent lines: CrowdStrike's assertion, and the frozen RSA keys at KJ-9<\u002Fdiv><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n    <div style=\"break-before:page;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#7d7979;margin-bottom:10px\">Key judgements · continued (2 of 3)<\u002Fdiv>\n    <sc-raw-table class=\"table\" style=\"font-size:13.5px\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:62px\">#<\u002Fsc-raw-th><sc-raw-th>Judgement<\u002Fsc-raw-th><sc-raw-th style=\"width:48px\">Type<\u002Fsc-raw-th><sc-raw-th style=\"width:24%\">Confidence<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td><strong>KJ-6a<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>The botnet <strong>declined very substantially<\u002Fstrong> between its 2011–2015 peak and 2026.<\u002Fsc-raw-td><sc-raw-td>[A]<\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fadfda;color:#7d2018\">High<\u002Fspan><div style=\"font-size:11.5px;color:#605d5d;margin-top:4px\">Every available baseline shows the same direction<\u002Fdiv><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><strong>KJ-6b<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>The decline is specifically <strong>~95–99%<\u002Fstrong>.<\u002Fsc-raw-td><sc-raw-td>[A]<\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fbeec2;color:#6e5307\">Low<\u002Fspan><div style=\"font-size:11.5px;color:#605d5d;margin-top:4px\">Baselines are not methodologically comparable. Range varies by baseline chosen — see Section 9<\u002Fdiv><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><strong>KJ-7<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>Disruption is not remediation.<\u002Fstrong> Infected executables persist and remain active. Network quarantine at botnet scale.<\u002Fsc-raw-td><sc-raw-td>[F]<\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fadfda;color:#7d2018\">High<\u002Fspan><div style=\"font-size:11.5px;color:#605d5d;margin-top:4px\">Stated explicitly by CrowdStrike<\u002Fdiv><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><strong>KJ-8a<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>The three DDoS campaigns (Apr 2016, Feb 2022, Sep 2023) <strong>occurred as described<\u002Fstrong>.<\u002Fsc-raw-td><sc-raw-td>[F]<\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fbe6cd;color:#7a4a13\">Moderate<\u002Fspan><div style=\"font-size:11.5px;color:#605d5d;margin-top:4px\">Single-sourced to CrowdStrike, no independent corroboration located<\u002Fdiv><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><strong>KJ-8b<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>The Feb 2022 Kharkiv attack was <strong>patriotically motivated<\u002Fstrong>; the Sep 2023 attack was <strong>impulsive personal grievance<\u002Fstrong>.<\u002Fsc-raw-td><sc-raw-td>[A]<\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fbeec2;color:#6e5307\">Low–Moderate<\u002Fspan><div style=\"font-size:11.5px;color:#605d5d;margin-top:4px\">CrowdStrike's own hedged assessments, not findings — their language is \"likely aligned\" and \"suggesting\"<\u002Fdiv><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><strong>KJ-8c<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>Counter-attack risk against sinkhole infrastructure is real.<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>[A]<\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fbe6cd;color:#7a4a13\">Moderate<\u002Fspan><div style=\"font-size:11.5px;color:#605d5d;margin-top:4px\">Rests on Kleissner's independently sourced 2014–15 record of four DDoS attacks on a Sality sinkhole operator<\u002Fdiv><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n    <div style=\"break-before:page;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#7d7979;margin-bottom:10px\">Key judgements · continued (3 of 3)<\u002Fdiv>\n    <sc-raw-table class=\"table\" style=\"font-size:13.5px\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:62px\">#<\u002Fsc-raw-th><sc-raw-th>Judgement<\u002Fsc-raw-th><sc-raw-th style=\"width:48px\">Type<\u002Fsc-raw-th><sc-raw-th style=\"width:24%\">Confidence<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td><strong>KJ-9a<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>The <strong>v3 and v4 RSA public keys are byte-identical<\u002Fstrong> between Falliere's July 2011 publication and CrowdStrike's August 2026 YARA rules.<\u002Fsc-raw-td><sc-raw-td>[F]<\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fadfda;color:#7d2018\">High<\u002Fspan><div style=\"font-size:11.5px;color:#605d5d;margin-top:4px\">Independently verified by direct byte comparison (12.1)<\u002Fdiv><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><strong>KJ-9b<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>This demonstrates the operator <strong>could not rotate keys<\u002Fstrong>, because a new key means a new network.<\u002Fsc-raw-td><sc-raw-td>[A]<\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fbe6cd;color:#7a4a13\">Moderate–High<\u002Fspan><div style=\"font-size:11.5px;color:#605d5d;margin-top:4px\">Mechanism explained by Falliere in 2011 and consistent with KJ-5; the alternative — chose not to rotate — cannot be fully excluded<\u002Fdiv><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><strong>KJ-10<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>File infection and lateral spread almost certainly continue<\u002Fstrong> post-disruption, because sinkhole entries leave peer lists non-empty.<\u002Fsc-raw-td><sc-raw-td>[A]<\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fbe6cd;color:#7a4a13\">Moderate<\u002Fspan><div style=\"font-size:11.5px;color:#605d5d;margin-top:4px\">See 8.4. The operational recommendation is robust either way<\u002Fdiv><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><strong>KJ-11<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>The <strong>exact eviction primitive remains undisclosed<\u002Fstrong>; the P2PWNED port-overwrite hypothesis is inference, not fact.<\u002Fsc-raw-td><sc-raw-td>[F]/[A]<\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fadfda;color:#7d2018\">High<\u002Fspan> that it is undisclosed<div style=\"margin-top:4px\"><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fbeec2;color:#6e5307\">Low<\u002Fspan> that the hypothesis identifies what was used (6.3)<\u002Fdiv><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><strong>KJ-12<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>Vendor and government attribution diverge.<\u002Fstrong> CrowdStrike names SALTY SPIDER and places the actor in Bashkortostan, Russia. The DOJ release <strong>makes no attribution claim of any kind<\u002Fstrong>.<\u002Fsc-raw-td><sc-raw-td>[F]<\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fadfda;color:#7d2018\">High<\u002Fspan><div style=\"font-size:11.5px;color:#605d5d;margin-top:4px\">Verifiable by reading both documents. Do not present \"Russia-attributed\" as a government finding<\u002Fdiv><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><strong>KJ-13<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>There is <strong>no visible prosecution track<\u002Fstrong>. No charges, no indictment, no named defendant, no forfeiture, no sanctions. The operation was disruption-only.<\u002Fsc-raw-td><sc-raw-td>[F]<\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fadfda;color:#7d2018\">High<\u002Fspan><div style=\"font-size:11.5px;color:#605d5d;margin-top:4px\">Contrast Qakbot, same US Attorney's Office, which carried an $8.6M seizure and a later indictment<\u002Fdiv><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n  <\u002Fdiv>\n\n  <div style=\"break-before:page\">\n    <div style=\"font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0;margin-bottom:8px\">Section 03<\u002Fdiv>\n    <h2 style=\"font-size:32px;margin:0 0 18px;padding-bottom:12px;border-bottom:2px solid #201e1d\">Timeline, 2003 to 2026<\u002Fh2>\n    <p style=\"font-size:16px;line-height:1.5;margin:0 0 6px;max-width:36em\">Twenty-three years in three phases. The shape that matters is the middle one: every architectural decision that made Sality durable was taken between 2008 and 2010, and none of it could be revised afterwards.<\u002Fp>\n\n    <figure style=\"margin:26px 0 34px\">\n      <div style=\"border-top:2px solid #201e1d;padding-top:9px\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0\">Exhibit 2<\u002Fdiv>\n        <div style=\"font-size:17px;margin:2px 0 8px\">Three phases of one continuously operated botnet<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:5fr 9fr 10fr;gap:3px;margin-bottom:10px\">\n        <div style=\"background:#eae7e7;padding:6px 10px\">\n          <div style=\"font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#605d5d\">2003–2007<\u002Fdiv>\n          <div style=\"font-size:14px;margin-top:2px\">Origins<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#cbeeff;padding:6px 10px\">\n          <div style=\"font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#004961\">2008–2016<\u002Fdiv>\n          <div style=\"font-size:14px;margin-top:2px\">Peer-to-peer era and peak<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#ffdee6;padding:6px 10px\">\n          <div style=\"font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#790e3d\">2017–2026<\u002Fdiv>\n          <div style=\"font-size:14px;margin-top:2px\">Cryptocurrency, decline, disruption<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"keep\" style=\"margin-bottom:10px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px\">\n          <div style=\"font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#605d5d\">Phase I — Origins<\u002Fdiv>\n          <div style=\"font-size:11px;color:#7d7979\">A Russian file infector with hardcoded C2<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);align-items:end;min-height:60px\">\n          <div style=\"border-left:1px solid #bab6b6;padding:0 14px 10px 9px\">\n            <div style=\"font-size:11px;letter-spacing:0.08em;color:#0088b0;margin-bottom:3px\">JUN 2003<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.35\">First public Sality — Win32.HLLP.Kuku. Prepended UPX-packed code, keylogger and dial-up password theft, exfiltration by SMTP.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-left:1px solid #bab6b6;padding:0 14px 10px 9px\">\n            <div style=\"font-size:11px;letter-spacing:0.08em;color:#0088b0;margin-bottom:3px\">2004–2008<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.35\">Polymorphic and entry-point-obscuring rework. Payload separated from the virus body.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-left:1px solid #bab6b6;padding:0 14px 10px 9px\">\n            <div style=\"font-size:11px;letter-spacing:0.08em;color:#0088b0;margin-bottom:3px\">2006<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.35\">v3.09 — anti-AV routines and hardcoded HTTP C2. The single point of failure that P2P was later built to remove.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:2px solid #201e1d;display:grid;grid-template-columns:repeat(3,1fr)\">\n          <div><div style=\"width:9px;height:9px;border-radius:50%;background:#0088b0;margin:-5px 0 0 -4px;box-shadow:0 0 0 2px #f3f2f2\"><\u002Fdiv><\u002Fdiv>\n          <div><div style=\"width:9px;height:9px;border-radius:50%;background:#0088b0;margin:-5px 0 0 -4px;box-shadow:0 0 0 2px #f3f2f2\"><\u002Fdiv><\u002Fdiv>\n          <div><div style=\"width:9px;height:9px;border-radius:50%;background:#0088b0;margin:-5px 0 0 -4px;box-shadow:0 0 0 2px #f3f2f2\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"keep\" style=\"margin-bottom:10px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px\">\n          <div style=\"font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#605d5d\">Phase II — Peer-to-peer era and peak<\u002Fdiv>\n          <div style=\"font-size:11px;color:#7d7979\">Architecture frozen · population above one million<\u002Fdiv>\n
