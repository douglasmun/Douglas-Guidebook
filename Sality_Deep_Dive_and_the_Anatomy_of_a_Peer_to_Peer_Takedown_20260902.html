 <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(4,1fr);align-items:end;min-height:56px\">\n          <div style=\"border-left:1px solid #bab6b6;padding:0 12px 10px 9px\">\n            <div style=\"font-size:11px;letter-spacing:0.08em;color:#0088b0;margin-bottom:3px\">2008<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.35\">P2P component added to fix the hardcoded-URL weakness. Networks 1 and 2 created as tests — both die.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-left:1px solid #bab6b6;padding:0 12px 10px 9px\">\n            <div style=\"font-size:11px;letter-spacing:0.08em;color:#0088b0;margin-bottom:3px\">2009 · 2010<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.35\"><strong>Network 3<\u002Fstrong> (v3, RSA-1024), then <strong>Network 4<\u002Fstrong> (v4, RSA-2048, signed EXEs and EXE packs). The <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">amsint32<\u002Fspan> rootkit driver follows.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-left:1px solid #bab6b6;padding:0 12px 10px 9px\">\n            <div style=\"font-size:11px;letter-spacing:0.08em;color:#d6006c;margin-bottom:3px\">JUL 2011<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.35\">Falliere publishes the full protocol reverse-engineering <strong>including both RSA keys<\u002Fstrong>. More than 1M unique IPs/day on v3.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-left:1px solid #bab6b6;padding:0 12px 10px 9px\">\n            <div style=\"font-size:11px;letter-spacing:0.08em;color:#0088b0;margin-bottom:3px\">2013<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.35\">P2PWNED models resilience, finds the announcement port-overwrite eviction primitive, and rates Sality <em>extremely resilient<\u002Fem>.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:2px solid #201e1d;display:grid;grid-template-columns:repeat(4,1fr)\">\n          <div><div style=\"width:9px;height:9px;border-radius:50%;background:#0088b0;margin:-5px 0 0 -4px;box-shadow:0 0 0 2px #f3f2f2\"><\u002Fdiv><\u002Fdiv>\n          <div><div style=\"width:9px;height:9px;border-radius:50%;background:#0088b0;margin:-5px 0 0 -4px;box-shadow:0 0 0 2px #f3f2f2\"><\u002Fdiv><\u002Fdiv>\n          <div><div style=\"width:11px;height:11px;border-radius:50%;background:#d6006c;margin:-6px 0 0 -5px;box-shadow:0 0 0 2px #f3f2f2\"><\u002Fdiv><\u002Fdiv>\n          <div><div style=\"width:9px;height:9px;border-radius:50%;background:#0088b0;margin:-5px 0 0 -4px;box-shadow:0 0 0 2px #f3f2f2\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);align-items:start;margin-top:10px\">\n          <div style=\"border-left:1px solid #bab6b6;padding:0 12px 0 9px\">\n            <div style=\"font-size:11px;letter-spacing:0.08em;color:#0088b0;margin-bottom:3px\">2014–2015<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.35\">SALTY SPIDER DDoSes the Virus Tracker sinkhole four times, peaking at <strong>120 Gbps<\u002Fstrong>.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-left:1px solid #bab6b6;padding:0 12px 0 9px\">\n            <div style=\"font-size:11px;letter-spacing:0.08em;color:#0088b0;margin-bottom:3px\">JUL 2014 · SEP 2015<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.35\">Kleissner telemetry: v3/v4 total peers 415,696 / 91,996, then 251,459 / 69,193.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-left:1px solid #bab6b6;padding:0 12px 0 9px\">\n            <div style=\"font-size:11px;letter-spacing:0.08em;color:#0088b0;margin-bottom:3px\">APR 2016<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.35\">DDoS against <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">forex2030[.]com<\u002Fspan>, an Arabic natural-resources trading site.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"keep\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px\">\n          <div style=\"font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#605d5d\">Phase III — Cryptocurrency, decline, disruption<\u002Fdiv>\n          <div style=\"font-size:11px;color:#7d7979\">One payload for eight years, then Day Zero<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(4,1fr);align-items:end;min-height:56px\">\n          <div style=\"border-left:1px solid #bab6b6;padding:0 12px 10px 9px\">\n            <div style=\"font-size:11px;letter-spacing:0.08em;color:#0088b0;margin-bottom:3px\">2017<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.35\">Population surges via ETERNALBLUE. Proxy and spambot payloads dropped entirely; the business pivots to cryptocurrency theft.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-left:1px solid #bab6b6;padding:0 12px 10px 9px\">\n            <div style=\"font-size:11px;letter-spacing:0.08em;color:#0088b0;margin-bottom:3px\">2018–2026<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.35\"><strong>EggJagger<\u002Fstrong> clipjacker is the primary payload for roughly eight years.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-left:1px solid #bab6b6;padding:0 12px 10px 9px\">\n            <div style=\"font-size:11px;letter-spacing:0.08em;color:#d6006c;margin-bottom:3px\">25 FEB 2022<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.35\">HTTP flood against <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">kharkovforum[.]com<\u002Fspan> — one day after the invasion of Ukraine.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-left:1px solid #bab6b6;padding:0 12px 10px 9px\">\n            <div style=\"font-size:11px;letter-spacing:0.08em;color:#0088b0;margin-bottom:3px\">SEP 2023<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.35\">DDoS against AvanChange, a Russian crypto exchange. Payload compiled seconds before upload.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:2px solid #201e1d;display:grid;grid-template-columns:repeat(4,1fr)\">\n          <div><div style=\"width:9px;height:9px;border-radius:50%;background:#0088b0;margin:-5px 0 0 -4px;box-shadow:0 0 0 2px #f3f2f2\"><\u002Fdiv><\u002Fdiv>\n          <div><div style=\"width:9px;height:9px;border-radius:50%;background:#0088b0;margin:-5px 0 0 -4px;box-shadow:0 0 0 2px #f3f2f2\"><\u002Fdiv><\u002Fdiv>\n          <div><div style=\"width:11px;height:11px;border-radius:50%;background:#d6006c;margin:-6px 0 0 -5px;box-shadow:0 0 0 2px #f3f2f2\"><\u002Fdiv><\u002Fdiv>\n          <div><div style=\"width:9px;height:9px;border-radius:50%;background:#0088b0;margin:-5px 0 0 -4px;box-shadow:0 0 0 2px #f3f2f2\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);align-items:start;margin-top:10px\">\n          <div style=\"border-left:1px solid #bab6b6;padding:0 12px 0 9px\">\n            <div style=\"font-size:11px;letter-spacing:0.08em;color:#0088b0;margin-bottom:3px\">JAN 2025<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.35\">EggJagger portfolio peaks at approximately <strong>RUB 147M<\u002Fstrong> — never spent.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-left:1px solid #bab6b6;padding:0 12px 0 9px\">\n            <div style=\"font-size:11px;letter-spacing:0.08em;color:#0088b0;margin-bottom:3px\">18 AUG 2026<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.35\">CrowdStrike YARA rules dated — carrying the same key bytes published in 2011.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-left:2px solid #d6006c;padding:0 12px 0 9px;background:#fff1f4\">\n            <div style=\"font-size:11px;letter-spacing:0.08em;color:#d6006c;margin-bottom:3px\">31 AUG — 1 SEP 2026<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.35\"><strong>Disruption executed<\u002Fstrong>, live on stage at Day Zero, Las Vegas. CrowdStrike post and DOJ/CDCA announcement follow the next day.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <figcaption style=\"font-size:10.5px;color:#7d7979;border-top:1px solid #d7d3d3;padding-top:7px;margin-top:10px\">Phased, not linearly scaled — the era ribbon at the top carries the proportional span. Sources: Falliere 2011; P2PWNED 2013; Kleissner 2015; CrowdStrike 2019 and 2026; DOJ/CDCA release 26-149. Magenta markers denote the four events that determine the takedown's feasibility.<\u002Ffigcaption>\n    <\u002Ffigure>\n\n    <div class=\"keep\" style=\"margin:10px 0 0;padding-top:12px;border-top:1px solid #201e1d;max-width:38em\">\n      <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#d6006c;margin-bottom:6px\">Note on key continuity<\u002Fdiv>\n      <p style=\"font-size:14.5px;line-height:1.55;margin:0\">Direct evidence establishes the keys were unchanged between July 2011 and August 2026 <strong>[F, High]<\u002Fstrong>. That they were <em>also<\u002Fem> unchanged from network creation in 2009/2010 is an inference from Falliere's finding that a new protocol version implies a new embedded key <strong>[A, Moderate]<\u002Fstrong>.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"break-before:page\">\n    <div style=\"font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0;margin-bottom:8px\">Section 04<\u002Fdiv>\n    <h2 style=\"font-size:32px;margin:0 0 18px;padding-bottom:12px;border-bottom:2px solid #201e1d\">Host-side architecture<\u002Fh2>\n    <p style=\"font-size:16px;line-height:1.5;margin:0 0 6px;max-width:36em\">Falliere describes recent Sality as semi-independent components running in separate threads. Each one has a distinct defensive consequence, and three of them explain why single-process termination, Safe Mode recovery and antivirus updating all fail on an infected host.<\u002Fp>\n\n    <figure style=\"margin:26px 0 32px\">\n      <div style=\"border-top:2px solid #201e1d;padding-top:9px\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0\">Exhibit 3<\u002Fdiv>\n        <div style=\"font-size:17px;margin:2px 0 16px\">Five components, five defensive consequences<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:2px\">\n        <div style=\"background:#201e1d;color:#f3f2f2;padding:10px 11px 12px\"><div style=\"font-size:10px;letter-spacing:0.12em;text-transform:uppercase;opacity:0.6;margin-bottom:4px\">01<\u002Fdiv><div style=\"font-size:15px\">Injector<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#201e1d;color:#f3f2f2;padding:10px 11px 12px\"><div style=\"font-size:10px;letter-spacing:0.12em;text-transform:uppercase;opacity:0.6;margin-bottom:4px\">02<\u002Fdiv><div style=\"font-size:15px\">Protector<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#201e1d;color:#f3f2f2;padding:10px 11px 12px\"><div style=\"font-size:10px;letter-spacing:0.12em;text-transform:uppercase;opacity:0.6;margin-bottom:4px\">03<\u002Fdiv><div style=\"font-size:15px\">Infector<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#201e1d;color:#f3f2f2;padding:10px 11px 12px\"><div style=\"font-size:10px;letter-spacing:0.12em;text-transform:uppercase;opacity:0.6;margin-bottom:4px\">04<\u002Fdiv><div style=\"font-size:15px\">Downloader<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#0088b0;color:#f3f2f2;padding:10px 11px 12px\"><div style=\"font-size:10px;letter-spacing:0.12em;text-transform:uppercase;opacity:0.75;margin-bottom:4px\">05<\u002Fdiv><div style=\"font-size:15px\">P2P component<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:2px\">\n        <div style=\"background:#eae7e7;padding:11px;font-size:12.5px;line-height:1.45\">Injects into every process except <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:11.5px\">system<\u002Fspan>, <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:11.5px\">local service<\u002Fspan>, <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:11.5px\">network service<\u002Fspan>. Kill one instance and an injected process takes over.<\u002Fdiv>\n        <div style=\"background:#eae7e7;padding:11px;font-size:12.5px;line-height:1.45\">Deletes the SafeBoot keys, disables AV and firewall services, drops the <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:11.5px\">amsint32<\u002Fspan> kernel driver.<\u002Fdiv>\n        <div style=\"background:#eae7e7;padding:11px;font-size:12.5px;line-height:1.45\">Infects <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:11.5px\">.exe<\u002Fspan> and <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:11.5px\">.scr<\u002Fspan> on drives B: to Z:, network shares and removable media. Destroys security binaries.<\u002Fdiv>\n        <div style=\"background:#eae7e7;padding:11px;font-size:12.5px;line-height:1.45\">Fetches and executes the payloads named in the current URL pack. RC4-decrypts with a static key from the virus body.<\u002Fdiv>\n        <div style=\"background:#cbeeff;padding:11px;font-size:12.5px;line-height:1.45\">Client and server threads, a 40-minute cycle, a local peer list. <strong>This is the layer the takedown attacked.<\u002Fstrong><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:2px\">\n        <div style=\"border-top:2px solid #d6006c;padding:8px 11px;font-size:11.5px;line-height:1.4;color:#790e3d\">Termination is not remediation<\u002Fdiv>\n        <div style=\"border-top:2px solid #d6006c;padding:8px 11px;font-size:11.5px;line-height:1.4;color:#790e3d\">Safe Mode may be unavailable<\u002Fdiv>\n        <div style=\"border-top:2px solid #d6006c;padding:8px 11px;font-size:11.5px;line-height:1.4;color:#790e3d\">USB and SMB spread continues<\u002Fdiv>\n        <div style=\"border-top:2px solid #d6006c;padding:8px 11px;font-size:11.5px;line-height:1.4;color:#790e3d\">Cached tasking survives isolation<\u002Fdiv>\n        <div style=\"border-top:2px solid #d6006c;padding:8px 11px;font-size:11.5px;line-height:1.4;color:#790e3d\">No peer identity to authenticate<\u002Fdiv>\n      <\u002Fdiv>\n      <figcaption style=\"font-size:10.5px;color:#7d7979;border-top:1px solid #d7d3d3;padding-top:7px;margin-top:14px\">Source: Falliere, Symantec 2011, corroborated in outline by CrowdStrike 2026. [F, High]<\u002Ffigcaption>\n    <\u002Ffigure>\n\n    <h3 style=\"font-size:20px;margin:28px 0 10px\">4.1 Injector<\u002Fh3>\n    <p style=\"font-size:15.5px;line-height:1.6;margin:0 0 12px;max-width:38em\">Injects into all running processes except those under <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:14px\">system<\u002Fspan>, <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:14px\">local service<\u002Fspan> and <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:14px\">network service<\u002Fspan>. If privileged, it grants itself <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:14px\">SeDebugPrivilege<\u002Fspan> and retries. If one instance is killed, an injected process takes over — <strong>single-process termination does not remediate<\u002Fstrong>. Per-process mutexes named <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:14px\">&lt;ProcessName&gt;M_&lt;PID&gt;_<\u002Fspan> prevent double-injection; many of these on a live host is a strong infection indicator. <strong>[F, High]<\u002Fstrong><\u002Fp>\n\n    <h3 style=\"font-size:20px;margin:26px 0 10px\">4.2 Protector<\u002Fh3>\n    <div style=\"display:grid;grid-template-columns:auto 1fr;gap:9px 14px;font-size:15px;line-height:1.55;max-width:38em;margin-bottom:14px\">\n      <span style=\"color:#0088b0\">—<\u002Fspan><span>Deletes <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13.5px\">SafeBoot<\u002Fspan> subkeys under both <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13.5px\">HKCU<\u002Fspan> and <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13.5px\">HKLM\\System\\CurrentControlSet\\Control\\SafeBoot<\u002Fspan> — blocking Safe Mode recovery.<\u002Fspan>\n      <span style=\"color:#0088b0\">—<\u002Fspan><span>Stops and disables a long hardcoded list of AV and firewall services.<\u002Fspan>\n      <span style=\"color:#0088b0\">—<\u002Fspan><span>Drops a kernel driver to a pseudo-random name in <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13.5px\">%System%\\drivers<\u002Fspan>, registered as service <strong><span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13.5px\">amsint32<\u002Fspan><\u002Fstrong> — the service name is stable across variants — creating <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13.5px\">\\Device\\amsint32<\u002Fspan>. Some variants drop the driver as <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13.5px\">amsint32.sys<\u002Fspan> directly.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:16px\">\n      <div class=\"keep\"><div style=\"font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#0088b0;margin-bottom:5px\">Driver function 1<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.4\"><strong>Process killer.<\u002Fstrong> Terminates matched security processes from kernel mode via <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13px\">NtTerminateProcess<\u002Fspan>.<\u002Fdiv><\u002Fdiv>\n      <div class=\"keep\"><div style=\"font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#0088b0;margin-bottom:5px\">Driver function 2<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.4\"><strong>Packet filter.<\u002Fstrong> Registers an IPFilter callback via <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13px\">IOCTL_PF_SET_EXTENSION_POINTER<\u002Fspan> and drops packets containing security-vendor strings — <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13px\">symantec.<\u002Fspan>, <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13px\">kaspersky<\u002Fspan>, <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13px\">virustotal.<\u002Fspan>, <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13px\">sality-remov<\u002Fspan> and around twenty more.<\u002Fdiv><\u002Fdiv>\n      <div class=\"keep\"><div style=\"font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#0088b0;margin-bottom:5px\">Driver function 3<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.4\"><strong>SMTP blocking.<\u002Fstrong> Botmaster-enableable; the code remains in later variants but is unreachable.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"keep\" style=\"margin:20px 0;padding-top:12px;border-top:1px solid #201e1d;max-width:38em\">\n      <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0;margin-bottom:6px\">Continuity evidence<\u002Fdiv>\n      <p style=\"font-size:14.5px;line-height:1.55;margin:0\">CrowdStrike's 2026 YARA rules include the string <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13.5px\">IPFILTERDRIVER<\u002Fspan> as a required condition. The packet-filtering mechanism Falliere documented in 2011 was present in samples live at disruption. <strong>[F, High]<\u002Fstrong> — this materially discharges assumption X-2.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"keep\" style=\"margin:20px 0;padding-top:12px;border-top:1px solid #d6006c;max-width:38em\">\n      <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#d6006c;margin-bottom:6px\">Compliance consequence — scope carefully<\u002Fdiv>\n      <p style=\"font-size:14.5px;line-height:1.55;margin:0\">Dragos flagged that because Sality blocks outbound AV connections, antivirus cannot update, breaching <strong>NERC CIP-007-6<\u002Fstrong>. NERC CIP is a North American bulk-electric-system standard and <strong>does not apply in Singapore<\u002Fstrong>. Cite it as illustrating the <em>class<\u002Fem> of consequence; the local analogue for CII operators is the Cybersecurity Act and the sector Codes of Practice. <strong>[F]<\u002Fstrong> for the Dragos finding; <strong>[A, Moderate]<\u002Fstrong> that an equivalent finding arises under SG CII obligations.<\u002Fp>\n    <\u002Fdiv>\n\n    <h3 style=\"font-size:20px;margin:26px 0 10px\">4.3 Infector<\u002Fh3>\n    <p style=\"font-size:15.5px;line-height:1.6;margin:0 0 12px;max-width:38em\">Infection targets, in order of preference:<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:15px;line-height:1.5;max-width:38em;margin-bottom:14px\">\n      <span style=\"color:#0088b0\">1<\u002Fspan><span>Files under <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13.5px\">HKCU\\Software\\Microsoft\\Windows\\ShellNoRoam\\MUICache<\u002Fspan> — an effective installed-app inventory<\u002Fspan>\n      <span style=\"color:#0088b0\">2<\u002Fspan><span>Files under both <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13.5px\">Run<\u002Fspan> keys, HKCU and HKLM<\u002Fspan>\n      <span style=\"color:#0088b0\">3<\u002Fspan><span>All <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13.5px\">.exe<\u002Fspan> and <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13.5px\">.scr<\u002Fspan> on all mapped drives <strong>B: through Z:<\u002Fstrong><\u002Fspan>\n      <span style=\"color:#0088b0\">4<\u002Fspan><span>Root folders of non-Windows drives — drops an infected Calculator or Minesweeper copy under a random <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13.5px\">.exe<\u002Fspan>/<span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13.5px\">.cmd<\u002Fspan>/<span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13.5px\">.pif<\u002Fspan> name and writes or modifies <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13.5px\">autorun.inf<\u002Fspan>. <strong>The USB and external-drive vector.<\u002Fstrong><\u002Fspan>\n      <span style=\"color:#0088b0\">5<\u002Fspan><span>All executables found by enumerating network resources<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"font-size:15.5px;line-height:1.6;margin:0 0 12px;max-width:38em\">Security-software files are instead <strong>destroyed<\u002Fstrong> — the entry point is overwritten with <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:14px\">CC C3 CC C3 CC C3 CC C3<\u002Fspan> (<span style=\"font-family:ui-monospace,Menlo,monospace;font-size:14px\">int 3<\u002Fspan> / <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:14px\">ret<\u002Fspan>) — or deleted. <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:14px\">.vdb<\u002Fspan> and <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:14px\">.avc<\u002Fspan> definition files are hunted and deleted. <strong>[F, High]<\u002Fstrong><\u002Fp>\n    <p style=\"font-size:15.5px;line-height:1.6;margin:0 0 12px;max-width:38em\"><strong>The behavioural detail with direct takedown consequences:<\u002Fstrong> all infection routines are disabled <em>if the peer list is empty<\u002Fem>. See 8.4 — this is the hinge of the propagation question.<\u002Fp>\n\n    <h3 style=\"font-size:20px;margin:26px 0 10px\">4.4 Execution flow of an infected file<\u002Fh3>\n    <p style=\"font-size:15.5px;line-height:1.6;margin:0 0 6px;max-width:38em\">The entry-point <em>address<\u002Fem> is unchanged; the <em>code<\u002Fem> at the entry point is replaced by a variable stub from Sality's polymorphic generator, self-labelled <em>\"Simple Poly Engine v1.1a (c) Sector\"<\u002Fem>. This is why file-based scanning underperforms and memory scanning works.<\u002Fp>\n\n    <figure style=\"margin:24px 0 30px\" data-om-raster=\"\">\n      <div style=\"border-top:2px solid #201e1d;padding-top:9px\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0\">Exhibit 4<\u002Fdiv>\n        <div style=\"font-size:17px;margin:2px 0 14px\">Falliere Figure 4, reconstructed — the host runs normally and the user sees nothing<\u002Fdiv>\n      <\u002Fdiv>\n      <svg sc-camel-view-box=\"0 0 700 306\" style=\"width:100%;height:auto;font-family:'Source Serif 4',serif\">\n        <defs>\n          <marker id=\"sal-ah\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"8\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"7\" sc-camel-marker-height=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 1 L 9 5 L 0 9 z\" fill=\"#201e1d\"><\u002Fpath><\u002Fmarker>\n          <marker id=\"sal-ahc\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"8\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"7\" sc-camel-marker-height=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 1 L 9 5 L 0 9 z\" fill=\"#0088b0\"><\u002Fpath><\u002Fmarker>\n        <\u002Fdefs>\n        <text x=\"34\" y=\"16\" font-size=\"10.5\" letter-spacing=\"1.6\" fill=\"#605d5d\">INFECTED PE ON DISK<\u002Ftext>\n        <rect x=\"34\" y=\"24\" width=\"266\" height=\"176\" fill=\"none\" stroke=\"#201e1d\" stroke-width=\"1.5\"><\u002Frect>\n        <rect x=\"46\" y=\"36\" width=\"242\" height=\"72\" fill=\"#eae7e7\"><\u002Frect>\n        <text x=\"56\" y=\"52\" font-size=\"12\" fill=\"#444141\">Host code<\u002Ftext>\n        <rect x=\"56\" y=\"60\" width=\"222\" height=\"38\" fill=\"#f3f2f2\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Frect>\n        <text x=\"66\" y=\"77\" font-size=\"12\" fill=\"#201e1d\">EPO stub<\u002Ftext>\n        <text x=\"66\" y=\"91\" font-size=\"10.5\" fill=\"#7d7979\">replaces host code, polymorphic<\u002Ftext>\n        <circle cx=\"34\" cy=\"79\" r=\"5.5\" fill=\"#d6006c\"><\u002Fcircle>\n        <text x=\"14\" y=\"222\" font-size=\"10.5\" fill=\"#d6006c\">PE entry point — address UNCHANGED<\u002Ftext>\n        <path d=\"M 24 79 L 24 214\" stroke=\"#d6006c\" stroke-width=\"1\" stroke-dasharray=\"3 3\"><\u002Fpath>\n        <rect x=\"46\" y=\"124\" width=\"242\" height=\"62\" fill=\"#cbeeff\"><\u002Frect>\n        <text x=\"56\" y=\"142\" font-size=\"12\" fill=\"#004961\">Viral body — appended, last section<\u002Ftext>\n        <text x=\"56\" y=\"158\" font-size=\"10.5\" fill=\"#006786\">polymorphic decryptor plus junk<\u002Ftext>\n        <text x=\"56\" y=\"172\" font-size=\"10.5\" fill=\"#006786\">anti-emulation instructions<\u002Ftext>\n        <path d=\"M 167 98 L 167 122\" stroke=\"#201e1d\" stroke-width=\"1.2\" marker-end=\"url(#sal-ah)\"><\u002Fpath>\n        <text x=\"174\" y=\"115\" font-size=\"10.5\" fill=\"#605d5d\">jump<\u002Ftext>\n        <path d=\"M 288 155 L 352 155\" stroke=\"#0088b0\" stroke-width=\"1.4\" marker-end=\"url(#sal-ahc)\"><\u002Fpath>\n        <text x=\"296\" y=\"147\" font-size=\"10.5\" fill=\"#006786\">decrypt<\u002Ftext>\n        <rect x=\"354\" y=\"124\" width=\"140\" height=\"62\" fill=\"#f3f2f2\" stroke=\"#0088b0\" stroke-width=\"1.5\"><\u002Frect>\n        <text x=\"366\" y=\"150\" font-size=\"12.5\" fill=\"#201e1d\">Loader region<\u002Ftext>\n        <text x=\"366\" y=\"167\" font-size=\"10.5\" fill=\"#605d5d\">in memory only<\u002Ftext>\n        <path d=\"M 494 155 L 552 155\" stroke=\"#0088b0\" stroke-width=\"1.4\" marker-end=\"url(#sal-ahc)\"><\u002Fpath>\n        <text x=\"497\" y=\"147\" font-size=\"10.5\" fill=\"#006786\">new thread<\u002Ftext>\n        <rect x=\"554\" y=\"124\" width=\"130\" height=\"62\" fill=\"#201e1d\"><\u002Frect>\n        <text x=\"566\" y=\"150\" font-size=\"12.5\" fill=\"#f3f2f2\">PAYLOAD<\u002Ftext>\n        <text x=\"566\" y=\"167\" font-size=\"10.5\" fill=\"#bab6b6\">Sality core<\u002Ftext>\n        <path d=\"M 424 186 L 424 236\" stroke=\"#201e1d\" stroke-width=\"1.2\" marker-end=\"url(#sal-ah)\"><\u002Fpath>\n        <text x=\"432\" y=\"214\" font-size=\"10.5\" fill=\"#605d5d\">restore original entry point<\u002Ftext>\n        <rect x=\"354\" y=\"238\" width=\"330\" height=\"54\" fill=\"#eae7e7\"><\u002Frect>\n        <text x=\"366\" y=\"260\" font-size=\"12.5\" fill=\"#201e1d\">Original entry-point code<\u002Ftext>\n        <text x=\"366\" y=\"277\" font-size=\"10.5\" fill=\"#605d5d\">host runs normally — the user sees nothing<\u002Ftext>\n      <\u002Fsvg>\n      <figcaption style=\"font-size:10.5px;color:#7d7979;border-top:1px solid #d7d3d3;padding-top:7px;margin-top:12px\">Reconstructed from the technical description in Falliere 2011, original figure numbering preserved for cross-reference. [F, High] for the mechanism.<\u002Ffigcaption>\n    <\u002Ffigure>\n\n    <div class=\"keep\" style=\"margin:20px 0;padding-top:12px;border-top:1px solid #d6006c;max-width:38em\">\n      <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#d6006c;margin-bottom:6px\">Scoping caution<\u002Fdiv>\n      <p style=\"font-size:14.5px;line-height:1.55;margin:0\">The figures often quoted for this mechanism — \"122 bytes replaced, original stashed 1,422 bytes from the start of the last section\" — come from F-Secure's write-up of <strong>W32/Sality.Q specifically<\u002Fstrong> and must not be generalised to the family. Falliere describes the mechanism without fixed byte counts, and the stub is polymorphic by design. <strong>[F, High]<\u002Fstrong> for the mechanism; the byte counts are variant-specific.<\u002Fp>\n    <\u002Fdiv>\n\n    <p style=\"font-size:15.5px;line-height:1.6;margin:0 0 12px;max-width:38em\">Global mutex <strong><span style=\"font-family:ui-monospace,Menlo,monospace;font-size:14px\">uxJLpe1m<\u002Fspan><\u002Fstrong> synchronises instances and is unique across variants (Falliere). Kleissner separately records <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:14px\">purity_control_4428<\u002Fspan> and <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:14px\">kukutrusted!<\u002Fspan> as run-check mutexes in the variants he analysed — treat all three as candidate indicators rather than assuming one canonical value. <strong>[F, High]<\u002Fstrong> for the first; <strong>[F, Moderate]<\u002Fstrong> for the others.<\u002Fp>\n\n    <div class=\"keep\" style=\"margin:20px 0 0;padding-top:12px;border-top:1px solid #201e1d;max-width:38em\">\n      <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0;margin-bottom:6px\">Both the best host IOC and an inoculation vector<\u002Fdiv>\n      <p style=\"font-size:14.5px;line-height:1.55;margin:0\">Falliere notes that <em>pre-creating<\u002Fem> the <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13.5px\">uxJLpe1m<\u002Fspan> mutex prevents infection. For legacy or OT estate that cannot run EDR, a startup task holding this mutex is a cheap compensating control. <strong>[A, Moderate]<\u002Fstrong> that this still works against 2026 variants — the mechanism is unchanged in principle but untested by us. Test before fleet deployment.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"break-before:page\">\n    <div style=\"font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0;margin-bottom:8px\">Section 05<\u002Fdiv>\n    <h2 style=\"font-size:32px;margin:0 0 18px;padding-bottom:12px;border-bottom:2px solid #201e1d\">The peer-to-peer layer<\u002Fh2>\n    <p style=\"font-size:16px;line-height:1.5;margin:0 0 6px;max-width:36em\">Each infected host starts two threads: a <em>client<\u002Fem> thread that queries peers, and a <em>server<\u002Fem> thread listening on a UDP port derived from the computer name. Reachable from the internet, a host is promotable to <strong>super peer<\u002Fstrong>. Behind NAT or a firewall, the server thread is useless and the host stays a <strong>simple peer<\u002Fstrong>.<\u002Fp>\n\n    <h3 style=\"font-size:20px;margin:26px 0 10px\">5.1 Topology — super peers and ordinary peers<\u002Fh3>\n\n    <figure style=\"margin:20px 0 30px\" data-om-raster=\"\">\n      <div style=\"border-top:2px solid #201e1d;padding-top:9px\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0\">Exhibit 5<\u002Fdiv>\n        <div style=\"font-size:17px;margin:2px 0 14px\">The overlay is a delivery fabric with a small reachable backbone<\u002Fdiv>\n      <\u002Fdiv>\n      <svg sc-camel-view-box=\"0 0 700 320\" style=\"width:100%;height:auto;font-family:'Source Serif 4',serif\">\n        <defs>\n          <marker id=\"sal-ah2\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"8\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"7\" sc-camel-marker-height=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 1 L 9 5 L 0 9 z\" fill=\"#201e1d\"><\u002Fpath><\u002Fmarker>\n        <\u002Fdefs>\n        <rect x=\"255\" y=\"10\" width=\"190\" height=\"34\" fill=\"#201e1d\"><\u002Frect>\n        <text x=\"350\" y=\"32\" font-size=\"13\" fill=\"#f3f2f2\" text-anchor=\"middle\" letter-spacing=\"0.8\">SALTY SPIDER<\u002Ftext>\n        <path d=\"M 350 44 L 350 78\" stroke=\"#201e1d\" stroke-width=\"1.2\" marker-end=\"url(#sal-ah2)\"><\u002Fpath>\n        <text x=\"358\" y=\"60\" font-size=\"10.5\" fill=\"#605d5d\">creates and RSA-signs tasking<\u002Ftext>\n        <rect x=\"235\" y=\"80\" width=\"230\" height=\"30\" fill=\"#eae7e7\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Frect>\n        <text x=\"350\" y=\"100\" font-size=\"11.5\" fill=\"#201e1d\" text-anchor=\"middle\">signed URL packs · signed file packs<\u002Ftext>\n        <path d=\"M 350 110 L 350 128\" stroke=\"#201e1d\" stroke-width=\"1.2\"><\u002Fpath>\n        <path d=\"M 140 128 L 560 128\" stroke=\"#201e1d\" stroke-width=\"1.2\"><\u002Fpath>\n        <path d=\"M 140 128 L 140 150\" stroke=\"#201e1d\" stroke-width=\"1.2\" marker-end=\"url(#sal-ah2)\"><\u002Fpath>\n        <path d=\"M 350 128 L 350 150\" stroke=\"#201e1d\" stroke-width=\"1.2\" marker-end=\"url(#sal-ah2)\"><\u002Fpath>\n        <path d=\"M 560 128 L 560 150\" stroke=\"#201e1d\" stroke-width=\"1.2\" marker-end=\"url(#sal-ah2)\"><\u002Fpath>\n        <rect x=\"70\" y=\"152\" width=\"140\" height=\"46\" fill=\"#cbeeff\" stroke=\"#0088b0\" stroke-width=\"1.5\"><\u002Frect>\n        <text x=\"140\" y=\"172\" font-size=\"12.5\" fill=\"#004961\" text-anchor=\"middle\">Super peer<\u002Ftext>\n        <text x=\"140\" y=\"188\" font-size=\"10.5\" fill=\"#006786\" text-anchor=\"middle\">public IP · reachable<\u002Ftext>\n        <rect x=\"280\" y=\"152\" width=\"140\" height=\"46\" fill=\"#cbeeff\" stroke=\"#0088b0\" stroke-width=\"1.5\"><\u002Frect>\n        <text x=\"350\" y=\"172\" font-size=\"12.5\" fill=\"#004961\" text-anchor=\"middle\">Super peer<\u002Ftext>\n        <text x=\"350\" y=\"188\" font-size=\"10.5\" fill=\"#006786\" text-anchor=\"middle\">public IP · reachable<\u002Ftext>\n        <rect x=\"490\" y=\"152\" width=\"140\" height=\"46\" fill=\"#cbeeff\" stroke=\"#0088b0\" stroke-width=\"1.5\"><\u002Frect>\n        <text x=\"560\" y=\"172\" font-size=\"12.5\" fill=\"#004961\" text-anchor=\"middle\">Super peer<\u002Ftext>\n        <text x=\"560\" y=\"188\" font-size=\"10.5\" fill=\"#006786\" text-anchor=\"middle\">public IP · reachable<\u002Ftext>\n        <path d=\"M 210 175 L 280 175\" stroke=\"#0088b0\" stroke-width=\"1\" stroke-dasharray=\"4 3\"><\u002Fpath>\n        <path d=\"M 420 175 L 490 175\" stroke=\"#0088b0\" stroke-width=\"1\" stroke-dasharray=\"4 3\"><\u002Fpath>\n        <path d=\"M 140 198 C 140 224, 560 224, 560 198\" stroke=\"#0088b0\" stroke-width=\"1\" stroke-dasharray=\"4 3\" fill=\"none\"><\u002Fpath>\n        <text x=\"350\" y=\"228\" font-size=\"10.5\" fill=\"#006786\" text-anchor=\"middle\">P2P overlay — peer exchange, one coordinate at a time<\u002Ftext>\n        <rect x=\"70\" y=\"252\" width=\"230\" height=\"46\" fill=\"#eae7e7\"><\u002Frect>\n        <text x=\"185\" y=\"272\" font-size=\"12.5\" fill=\"#201e1d\" text-anchor=\"middle\">Ordinary bots behind NAT<\u002Ftext>\n        <text x=\"185\" y=\"288\" font-size=\"10.5\" fill=\"#605d5d\" text-anchor=\"middle\">outbound refresh only — no direct inbound<\u002Ftext>\n        <rect x=\"400\" y=\"252\" width=\"230\" height=\"46\" fill=\"#eae7e7\"><\u002Frect>\n        <text x=\"515\" y=\"272\" font-size=\"12.5\" fill=\"#201e1d\" text-anchor=\"middle\">Ordinary bots behind NAT<\u002Ftext>\n        <text x=\"515\" y=\"288\" font-size=\"10.5\" fill=\"#605d5d\" text-anchor=\"middle\">outbound refresh only — no direct inbound<\u002Ftext>\n        <path d=\"M 185 250 L 185 200\" stroke=\"#7d7979\" stroke-width=\"1.2\" marker-end=\"url(#sal-ah2)\"><\u002Fpath>\n        <path d=\"M 515 250 L 515 200\" stroke=\"#7d7979\" stroke-width=\"1.2\" marker-end=\"url(#sal-ah2)\"><\u002Fpath>\n      <\u002Fsvg>\n      <figcaption style=\"font-size:10.5px;color:#7d7979;border-top:1px solid #d7d3d3;padding-top:7px;margin-top:12px\">Reconstructed from Falliere 2011 and CrowdStrike 2026. P2PWNED measured only 36.9% (v3) and 40.0% (v4) of enumerated peers as routable — the backbone is a minority of the population, which is why it was targeted first.<\u002Ffigcaption>\n    <\u002Ffigure>\n\n    <sc-raw-table class=\"table\" style=\"font-size:14px;margin-bottom:14px\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:33%\">Peer ID<\u002Fsc-raw-th><sc-raw-th>Meaning<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td><span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13.5px\">0<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Not promoted — keeps sending Announcement &amp; Promotion queries<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13.5px\">&lt; 16,000,000<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Low peer ID — not externally reachable<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13.5px\">≥ 16,000,000<\u002Fspan><\u002Fsc-raw-td><sc-raw-td><strong>Super peer<\u002Fstrong> — added to other bots' peer lists<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n    <p style=\"font-size:15.5px;line-height:1.6;margin:0 0 12px;max-width:38em\">Studied variants return <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:14px\">0<\u002Fspan> rather than a low ID, making clients <strong>inherently aggressive about becoming super peers<\u002Fstrong>. That aggression is precisely what lets a defender-controlled reachable node get promoted and adopted. <strong>[F, High]<\u002Fstrong><\u002Fp>\n\n    <h3 style=\"font-size:20px;margin:28px 0 10px\">5.2 The peer list and goodcount<\u002Fh3>\n    <p style=\"font-size:15.5px;line-height:1.6;margin:0 0 6px;max-width:38em\">Goodcount is the anti-poisoning control, and it is strictly local: never exchanged over the network, never stored in bootstrap lists. An attacker cannot claim a reputation — which is why the eviction primitive matters so much (6.3): it bypasses goodcount rather than beating it.<\u002Fp>\n\n    <figure style=\"margin:22px 0 28px\">\n      <div style=\"border-top:2px solid #201e1d;padding-top:9px\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0\">Exhibit 6<\u002Fdiv>\n        <div style=\"font-size:17px;margin:2px 0 14px\">The reputation loop, and the six mechanics that bound it<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1.15fr;gap:26px\">\n        <div>\n          <div style=\"font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#605d5d;margin-bottom:8px\">Local peer list<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr auto;gap:0 10px;font-size:13.5px\">\n            <div style=\"padding:6px 0;border-bottom:1px solid #eae7e7\">Peer A<\u002Fdiv><div style=\"padding:6px 0;border-bottom:1px solid #eae7e7;color:#0088b0;letter-spacing:0.08em\">+ + +<\u002Fdiv>\n            <div style=\"padding:6px 0;border-bottom:1px solid #eae7e7\">Peer B<\u002Fdiv><div style=\"padding:6px 0;border-bottom:1px solid #eae7e7;color:#0088b0;letter-spacing:0.08em\">+ +<\u002Fdiv>\n            <div style=\"padding:6px 0;border-bottom:1px solid #eae7e7\">Peer C<\u002Fdiv><div style=\"padding:6px 0;border-bottom:1px solid #eae7e7;color:#d6006c;letter-spacing:0.08em\">−<\u002Fdiv>\n            <div style=\"padding:6px 0;border-bottom:1px solid #eae7e7\">Peer D<\u002Fdiv><div style=\"padding:6px 0;border-bottom:1px solid #eae7e7;color:#0088b0;letter-spacing:0.08em\">+ + +<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:14px;padding:10px 12px;background:#201e1d;color:#f3f2f2;font-size:12.5px;text-align:center;letter-spacing:0.08em\">EVERY ~40 MINUTES — PROBE KNOWN PEERS<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px\">\n            <div style=\"background:#cbeeff;padding:9px 10px;font-size:12px;line-height:1.4;color:#004961\">Valid response<br><strong>improve reputation<\u002Fstrong><\u002Fdiv>\n            <div style=\"background:#ffdee6;padding:9px 10px;font-size:12px;line-height:1.4;color:#790e3d\">Failure or malformed<br><strong>degrade reputation<\u002Fstrong><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:8px;padding:9px 10px;border-top:2px solid #d6006c;font-size:12px;color:#790e3d\">Sustained failure → eventual peer removal<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#605d5d;margin-bottom:8px\">Mechanics<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:auto 1fr;gap:9px 12px;font-size:13.5px;line-height:1.45\">\n            <span style=\"color:#0088b0\">01<\u002Fspan><span><strong>Bootstrap list<\u002Fstrong> embedded in every infected file, maximum <strong>1,000 entries<\u002Fstrong>. When Sality infects a file it embeds its current local list — the bootstrap list travels with the infection.<\u002Fspan>\n            <span style=\"color:#0088b0\">02<\u002Fspan><span><strong>Local list<\u002Fstrong> stored in the registry under a username-seeded pseudo-random <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">HKCU<\u002Fspan> key, adding last-contact time, goodcount and PeerID.<\u002Fspan>\n            <span style=\"color:#0088b0\">03<\u002Fspan><span><strong>Goodcount<\u002Fstrong> incremented on a protocol-conformant reply, decremented otherwise.<\u002Fspan>\n            <span style=\"color:#0088b0\">04<\u002Fspan><span><strong>Never exchanged, never stored<\u002Fstrong> in bootstrap lists. Strictly local — the anti-poisoning control.<\u002Fspan>\n            <span style=\"color:#0088b0\">05<\u002Fspan><span><strong>Cleanup:<\u002Fstrong> discard entries below −30, but only if the list holds <strong>≥ 500<\u002Fstrong> peers.<\u002Fspan>\n            <span style=\"color:#0088b0\">06<\u002Fspan><span><strong>Peer Exchange<\u002Fstrong> requested when the list holds <strong>&lt; 980<\u002Fstrong> entries (older builds: as low as 200), and it returns <strong>exactly one<\u002Fstrong> peer, chosen at random from entries with strictly positive goodcount.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <figcaption style=\"font-size:10.5px;color:#7d7979;border-top:1px solid #d7d3d3;padding-top:7px;margin-top:14px\">Source: Falliere 2011, confirmed in outline by CrowdStrike 2026. [F, High]<\u002Ffigcaption>\n    <\u002Ffigure>\n\n    <h3 style=\"font-size:20px;margin:28px 0 10px\">5.3 Transport and packet format<\u002Fh3>\n    <p style=\"font-size:15.5px;line-height:1.6;margin:0 0 6px;max-width:38em\">The server thread's port is derived from the computer name. One implementation Falliere observed: if the name is shorter than two characters the port is 9674; otherwise <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:14px\">Port = 2199 + name[last] × name[first]<\u002Fspan>.<\u002Fp>\n\n    <figure style=\"margin:22px 0 28px\">\n      <div style=\"border-top:2px solid #201e1d;padding-top:9px\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0\">Exhibit 7<\u002Fdiv>\n        <div style=\"font-size:17px;margin:2px 0 14px\">Port range, packet layout, and why any sensor can decrypt the traffic<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-bottom:20px\">\n        <div style=\"background:#eae7e7;padding:11px\"><div style=\"font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#605d5d\">Minimum<\u002Fdiv><div style=\"font-size:22px;margin-top:3px\">4,224<\u002Fdiv><div style=\"font-size:11px;color:#605d5d;margin-top:2px\">2199 + 45×45<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#eae7e7;padding:11px\"><div style=\"font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#605d5d\">Maximum<\u002Fdiv><div style=\"font-size:22px;margin-top:3px\">17,083<\u002Fdiv><div style=\"font-size:11px;color:#605d5d;margin-top:2px\">2199 + 122×122<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#eae7e7;padding:11px\"><div style=\"font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#605d5d\">Uppercase names<\u002Fdiv><div style=\"font-size:22px;margin-top:3px\">4,224–10,299<\u002Fdiv><div style=\"font-size:11px;color:#605d5d;margin-top:2px\">narrower subrange<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#cbeeff;padding:11px\"><div style=\"font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#004961\">Distinct ports<\u002Fdiv><div style=\"font-size:22px;margin-top:3px;color:#004961\">1,751<\u002Fdiv><div style=\"font-size:11px;color:#006786;margin-top:2px\">across the Windows charset<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <svg sc-camel-view-box=\"0 0 700 214\" style=\"width:100%;height:auto;font-family:'Source Serif 4',serif\">\n        <text x=\"0\" y=\"12\" font-size=\"10.5\" letter-spacing=\"1.6\" fill=\"#605d5d\">UDP PAYLOAD<\u002Ftext>\n        <rect x=\"0\" y=\"22\" width=\"90\" height=\"44\" fill=\"#cbeeff\" stroke=\"#0088b0\" stroke-width=\"1.2\"><\u002Frect>\n        <rect x=\"90\" y=\"22\" width=\"90\" height=\"44\" fill=\"#cbeeff\" stroke=\"#0088b0\" stroke-width=\"1.2\"><\u002Frect>\n        <rect x=\"180\" y=\"22\" width=\"520\" height=\"44\" fill=\"#eae7e7\" stroke=\"#7d7979\" stroke-width=\"1.2\"><\u002Frect>\n        <text x=\"45\" y=\"42\" font-size=\"11\" fill=\"#004961\" text-anchor=\"middle\">WORD h<\u002Ftext>\n        <text x=\"45\" y=\"57\" font-size=\"10\" fill=\"#006786\" text-anchor=\"middle\">hash<\u002Ftext>\n        <text x=\"135\" y=\"42\" font-size=\"11\" fill=\"#004961\" text-anchor=\"middle\">WORD n<\u002Ftext>\n        <text x=\"135\" y=\"57\" font-size=\"10\" fill=\"#006786\" text-anchor=\"middle\">size<\u002Ftext>\n        <text x=\"440\" y=\"42\" font-size=\"11\" fill=\"#201e1d\" text-anchor=\"middle\">BYTE[n] — RC4( data )<\u002Ftext>\n        <text x=\"440\" y=\"57\" font-size=\"10\" fill=\"#605d5d\" text-anchor=\"middle\">n = packet length − 4<\u002Ftext>\n        <text x=\"0\" y=\"80\" font-size=\"9.5\" fill=\"#7d7979\">0x00<\u002Ftext>\n        <text x=\"90\" y=\"80\" font-size=\"9.5\" fill=\"#7d7979\">0x02<\u002Ftext>\n        <text x=\"180\" y=\"80\" font-size=\"9.5\" fill=\"#7d7979\">0x04<\u002Ftext>\n        <rect x=\"0\" y=\"92\" width=\"270\" height=\"26\" fill=\"#d6006c\"><\u002Frect>\n        <text x=\"10\" y=\"109\" font-size=\"11\" fill=\"#fff1f4\">RC4 key k = MAKE_DWORD(h, n)<\u002Ftext>\n        <text x=\"278\" y=\"109\" font-size=\"11\" fill=\"#790e3d\">the first four bytes of the packet ARE the key<\u002Ftext>\n        <text x=\"0\" y=\"146\" font-size=\"10.5\" letter-spacing=\"1.6\" fill=\"#605d5d\">DECRYPTED DATA<\u002Ftext>\n        <rect x=\"0\" y=\"156\" width=\"70\" height=\"44\" fill=\"#eae7e7\" stroke=\"#7d7979\" stroke-width=\"1.2\"><\u002Frect>\n        <rect x=\"70\" y=\"156\" width=\"150\" height=\"44\" fill=\"#eae7e7\" stroke=\"#7d7979\" stroke-width=\"1.2\"><\u002Frect>\n        <rect x=\"220\" y=\"156\" width=\"90\" height=\"44\" fill=\"#cbeeff\" stroke=\"#0088b0\" stroke-width=\"1.2\"><\u002Frect>\n        <rect x=\"310\" y=\"156\" width=\"390\" height=\"44\" fill=\"#f3f2f2\" stroke=\"#7d7979\" stroke-width=\"1.2\"><\u002Frect>\n        <text x=\"35\" y=\"176\" font-size=\"10.5\" fill=\"#201e1d\" text-anchor=\"middle\">BYTE<\u002Ftext>\n        <text x=\"35\" y=\"191\" font-size=\"10\" fill=\"#605d5d\" text-anchor=\"middle\">Version<\u002Ftext>\n        <text x=\"145\" y=\"176\" font-size=\"10.5\" fill=\"#201e1d\" text-anchor=\"middle\">DWORD<\u002Ftext>\n        <text x=\"145\" y=\"191\" font-size=\"10\" fill=\"#605d5d\" text-anchor=\"middle\">URL Pack Sequence ID<\u002Ftext>\n        <text x=\"265\" y=\"176\" font-size=\"10.5\" fill=\"#004961\" text-anchor=\"middle\">BYTE<\u002Ftext>\n        <text x=\"265\" y=\"191\" font-size=\"10\" fill=\"#006786\" text-anchor=\"middle\">Command<\u002Ftext>\n        <text x=\"505\" y=\"176\" font-size=\"10.5\" fill=\"#201e1d\" text-anchor=\"middle\">BYTE[m]<\u002Ftext>\n        <text x=\"505\" y=\"191\" font-size=\"10\" fill=\"#605d5d\" text-anchor=\"middle\">Content (m = n − 6)<\u002Ftext>\n      <\u002Fsvg>\n      <figcaption style=\"font-size:10.5px;color:#7d7979;border-top:1px solid #d7d3d3;padding-top:7px;margin-top:12px\">Source: Falliere 2011. The constants C and f are implementation-specific — treat the port range as indicative, not exhaustive. Note that 9674 is also reachable via the formula, so it does not reliably identify the short-name fallback case.<\u002Ffigcaption>\n    <\u002Ffigure>\n\n    <div class=\"keep\" style=\"margin:20px 0;padding-top:12px;border-top:1px solid #d6006c;max-width:38em\">\n      <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#d6006c;margin-bottom:6px\">Two distinct RC4 keys — do not conflate<\u002Fdiv>\n      <p style=\"font-size:14.5px;line-height:1.55;margin:0\">The <strong>P2P packet<\u002Fstrong> key is derived per-packet from the header. The <strong>downloaded payload<\u002Fstrong> key is a static string hardcoded in the virus body: <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13.5px\">kukutrusted!.<\u002Fspan> in older versions, <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13.5px\">GdiPlus.dll<\u002Fspan> in newer ones. Kleissner independently observed <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13.5px\">GdiPlus.dll<\u002Fspan> applied in 1,024-byte blocks. <strong>[F, High]<\u002Fstrong><\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"keep\" style=\"margin:20px 0 0;padding-top:12px;border-top:1px solid #201e1d;max-width:38em\">\n      <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0;margin-bottom:6px\">Detection value<\u002Fdiv>\n      <p style=\"font-size:14.5px;line-height:1.55;margin:0\">Because the packet key derives from the packet's own first four bytes, <strong>any sensor can decrypt Sality traffic with no secret material<\u002Fstrong>. Version and command then sit at fixed offsets. <strong>[F, High]<\u002Fstrong> for the mechanism; <strong>[A, Moderate]<\u002Fstrong> that signatures built this way would have caught 2026 traffic unmodified — the port formula constants are implementation-specific.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"break-before:page\">\n    <h3 style=\"font-size:20px;margin:0 0 10px\">5.4 Protocol commands<\u002Fh3>\n    <p style=\"font-size:15.5px;line-height:1.6;margin:0 0 14px;max-width:38em\">In conceptual form the entire protocol is three sentences: <em>\"Do you have a newer URL pack?\" · \"Here is my URL pack.\" · \"Tell me another peer IP and port.\"<\u002Fem> That is the whole vocabulary — which is both why it survived twenty-three years and why it had so little surface to defend.<\u002Fp>\n    <sc-raw-table class=\"table\" style=\"font-size:14px;margin-bottom:22px\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:52px\">Cmd<\u002Fsc-raw-th><sc-raw-th style=\"width:26%\">Name<\u002Fsc-raw-th><sc-raw-th>Function<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td style=\"color:#0088b0\"><strong>1<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>Announcement &amp; Promotion<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Peer advertises its <strong>UDP port<\u002Fstrong>. The IP is <em>not<\u002Fem> sent — the server derives it from the packet source. The server probes back; on success the peer gets a High Peer ID.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"color:#0088b0\"><strong>2<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>Peer Exchange<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Exchanges <strong>one<\u002Fstrong> super-peer coordinate at a time. The whole peer list can never transfer at once.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"color:#0088b0\"><strong>3<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>Pack Exchange<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Compares URL Pack Sequence IDs; the higher wins and is transferred.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n\n    <h3 style=\"font-size:20px;margin:26px 0 10px\">5.5 URL pack structure<\u002Fh3>\n\n    <figure style=\"margin:20px 0 30px\">\n      <div style=\"border-top:2px solid #201e1d;padding-top:9px\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0\">Exhibit 8<\u002Fdiv>\n        <div style=\"font-size:17px;margin:2px 0 14px\">Tasking is replay-immune and forge-immune — this half of the design held<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1.35fr 1fr;gap:26px\">\n        <div>\n          <div style=\"border:1.5px solid #201e1d\">\n            <div style=\"background:#201e1d;color:#f3f2f2;padding:9px 12px;font-size:12.5px\">Digital signature blob<div style=\"font-size:10.5px;color:#bab6b6;margin-top:2px\">RSA-1024 (v3) / RSA-2048 (v4), MD5, e = 65537<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1.4fr 1fr 1fr;border-bottom:1px solid #d7d3d3\">\n              <div style=\"padding:9px 12px;font-size:12px;border-right:1px solid #d7d3d3\">Sequence ID<div style=\"font-size:10.5px;color:#7d7979\">inside the signed data<\u002Fdiv><\u002Fdiv>\n              <div style=\"padding:9px 12px;font-size:12px;border-right:1px solid #d7d3d3\">Flags<\u002Fdiv>\n              <div style=\"padding:9px 12px;font-size:12px\">URL count<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:10px 12px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.7;color:#444141\">http://&lt;compromised-site&gt;/logo.gif<br>http://&lt;compromised-site&gt;/bottom.gif<br>…<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#605d5d;margin-bottom:8px\">Install rules<\u002Fdiv>\n          <div style=\"background:#cbeeff;padding:12px 14px;margin-bottom:8px\">\n            <div style=\"font-size:14px;color:#004961\">Signature <strong>must<\u002Fstrong> verify<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:center;font-size:12px;color:#605d5d;margin-bottom:8px\">AND<\u002Fdiv>\n          <div style=\"background:#cbeeff;padding:12px 14px;margin-bottom:14px\">\n            <div style=\"font-size:14px;color:#004961\">Sequence ID strictly <strong>greater<\u002Fstrong> than current<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding-top:10px;border-top:2px solid #201e1d;font-size:13.5px;line-height:1.45\">Together these make the tasking channel <strong>replay-immune and forge-immune<\u002Fstrong>. No defender attack was ever available here.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <figcaption style=\"font-size:10.5px;color:#7d7979;border-top:1px solid #d7d3d3;padding-top:7px;margin-top:14px\">Source: Falliere 2011. In v4 the URL-fetched executables are themselves signed, with the signature following the ASCII marker <span style=\"font-family:ui-monospace,Menlo,monospace\">e#o203kjl,!<\u002Fspan> and verified before execution.<\u002Ffigcaption>\n    <\u002Ffigure>\n\n    <h3 style=\"font-size:20px;margin:26px 0 10px\">5.6 The distribution scheme<\u002Fh3>\n    <p style=\"font-size:15.5px;line-height:1.6;margin:0 0 6px;max-width:38em\">The Sality P2P layer is only a <strong>delivery fabric<\u002Fstrong>. CrowdStrike states that Sality's sole technical capability was deploying additional payloads — and the secondary malware it delivered used conventional, centralised C2.<\u002Fp>\n\n    <figure style=\"margin:20px 0 30px\" data-om-raster=\"\">\n      <div style=\"border-top:2px solid #201e1d;padding-top:9px\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0\">Exhibit 9<\u002Fdiv>\n        <div style=\"font-size:17px;margin:2px 0 14px\">Falliere Figure 6, reconstructed — a delivery fabric feeding conventional botnets<\u002Fdiv>\n      <\u002Fdiv>\n      <svg sc-camel-view-box=\"0 0 700 330\" style=\"width:100%;height:auto;font-family:'Source Serif 4',serif\">\n        <defs>\n          <marker id=\"sal-ah3\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"8\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"7\" sc-camel-marker-height=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 1 L 9 5 L 0 9 z\" fill=\"#201e1d\"><\u002Fpath><\u002Fmarker>\n        <\u002Fdefs>\n        <rect x=\"0\" y=\"26\" width=\"170\" height=\"58\" fill=\"#f3f2f2\" stroke=\"#201e1d\" stroke-width=\"1.5\"><\u002Frect>\n        <text x=\"12\" y=\"46\" font-size=\"12\" fill=\"#201e1d\">Infected file<\u002Ftext>\n        <text x=\"12\" y=\"62\" font-size=\"10.5\" fill=\"#605d5d\">bootstrap list inside,<\u002Ftext>\n        <text x=\"12\" y=\"75\" font-size=\"10.5\" fill=\"#605d5d\">max 1,000 entries<\u002Ftext>\n        <rect x=\"255\" y=\"20\" width=\"180\" height=\"70\" fill=\"#cbeeff\" stroke=\"#0088b0\" stroke-width=\"2\"><\u002Frect>\n        <text x=\"345\" y=\"52\" font-size=\"14\" fill=\"#004961\" text-anchor=\"middle\">P2P overlay<\u002Ftext>\n        <text x=\"345\" y=\"70\" font-size=\"10.5\" fill=\"#006786\" text-anchor=\"middle\">v3 and v4, disjoint<\u002Ftext>\n        <rect x=\"520\" y=\"26\" width=\"180\" height=\"58\" fill=\"#201e1d\"><\u002Frect>\n        <text x=\"610\" y=\"48\" font-size=\"12.5\" fill=\"#f3f2f2\" text-anchor=\"middle\">SALTY SPIDER<\u002Ftext>\n        <text x=\"610\" y=\"66\" font-size=\"10.5\" fill=\"#bab6b6\" text-anchor=\"middle\">pushes signed URL packs<\u002Ftext>\n        <path d=\"M 170 44 L 251 44\" stroke=\"#201e1d\" stroke-width=\"1.2\" marker-end=\"url(#sal-ah3)\"><\u002Fpath>\n        <text x=\"178\" y=\"37\" font-size=\"10\" fill=\"#605d5d\">1 · joins<\u002Ftext>\n        <path d=\"M 251 70 L 170 70\" stroke=\"#201e1d\" stroke-width=\"1.2\" marker-end=\"url(#sal-ah3)\"><\u002Fpath>\n        <text x=\"178\" y=\"84\" font-size=\"10\" fill=\"#605d5d\">2 · gets latest pack<\u002Ftext>\n        <path d=\"M 516 55 L 439 55\" stroke=\"#201e1d\" stroke-width=\"1.2\" marker-end=\"url(#sal-ah3)\"><\u002Fpath>\n        <path d=\"M 85 84 L 85 122\" stroke=\"#0088b0\" stroke-width=\"1.4\" marker-end=\"url(#sal-ah3)\"><\u002Fpath>\n        <text x=\"94\" y=\"108\" font-size=\"10.5\" fill=\"#006786\">3 · downloads and executes<\u002Ftext>\n        <rect x=\"0\" y=\"126\" width=\"167\" height=\"40\" fill=\"#eae7e7\"><\u002Frect>\n        <rect x=\"178\" y=\"126\" width=\"167\" height=\"40\" fill=\"#eae7e7\"><\u002Frect>\n        <rect x=\"356\" y=\"126\" width=\"167\" height=\"40\" fill=\"#eae7e7\"><\u002Frect>\n        <rect x=\"533\" y=\"126\" width=\"167\" height=\"40\" fill=\"#eae7e7\"><\u002Frect>\n        <text x=\"83\" y=\"151\" font-size=\"12\" fill=\"#201e1d\" text-anchor=\"middle\">Relays / proxies<\u002Ftext>\n        <text x=\"261\" y=\"151\" font-size=\"12\" fill=\"#201e1d\" text-anchor=\"middle\">Spambots<\u002Ftext>\n        <text x=\"439\" y=\"151\" font-size=\"12\" fill=\"#201e1d\" text-anchor=\"middle\">Hacktools<\u002Ftext>\n        <text x=\"616\" y=\"151\" font-size=\"12\" fill=\"#201e1d\" text-anchor=\"middle\">Trojans / stealers<\u002Ftext>\n        <path d=\"M 83 166 L 83 200\" stroke=\"#7d7979\" stroke-width=\"1.2\" marker-end=\"url(#sal-ah3)\"><\u002Fpath>\n        <path d=\"M 261 166 L 261 200\" stroke=\"#7d7979\" stroke-width=\"1.2\" marker-end=\"url(#sal-ah3)\"><\u002Fpath>\n        <path d=\"M 439 166 L 439 200\" stroke=\"#7d7979\" stroke-width=\"1.2\" marker-end=\"url(#sal-ah3)\"><\u002Fpath>\n        <path d=\"M 616 166 L 616 200\" stroke=\"#7d7979\" stroke-width=\"1.2\" marker-end=\"url(#sal-ah3)\"><\u002Fpath>\n        <rect x=\"43\" y=\"202\" width=\"80\" height=\"32\" fill=\"#f3f2f2\" stroke=\"#7d7979\" stroke-width=\"1\"><\u002Frect>\n        <rect x=\"221\" y=\"202\" width=\"80\" height=\"32\" fill=\"#f3f2f2\" stroke=\"#7d7979\" stroke-width=\"1\"><\u002Frect>\n        <rect x=\"399\" y=\"202\" width=\"80\" height=\"32\" fill=\"#f3f2f2\" stroke=\"#7d7979\" stroke-width=\"1\"><\u002Frect>\n        <rect x=\"576\" y=\"202\" width=\"80\" height=\"32\" fill=\"#f3f2f2\" stroke=\"#7d7979\" stroke-width=\"1\"><\u002Frect>\n        <text x=\"83\" y=\"223\" font-size=\"11\" fill=\"#201e1d\" text-anchor=\"middle\">C&amp;C<\u002Ftext>\n        <text x=\"261\" y=\"223\" font-size=\"11\" fill=\"#201e1d\" text-anchor=\"middle\">C&amp;C<\u002Ftext>\n        <text x=\"439\" y=\"223\" font-size=\"11\" fill=\"#201e1d\" text-anchor=\"middle\">C&amp;C<\u002Ftext>\n        <text x=\"616\" y=\"223\" font-size=\"11\" fill=\"#201e1d\" text-anchor=\"middle\">C&amp;C<\u002Ftext>\n        <text x=\"0\" y=\"258\" font-size=\"11\" fill=\"#790e3d\">Secondary malware uses conventional, centralised C2 — it does not inherit Sality's resilience.<\u002Ftext>\n        <path d=\"M 0 274 L 700 274\" stroke=\"#d7d3d3\" stroke-width=\"1\"><\u002Fpath>\n        <text x=\"0\" y=\"296\" font-size=\"11\" fill=\"#605d5d\">Historical payloads: spam generators and relays, HTTP proxies, information stealers with IE injection, a website<\u002Ftext>\n        <text x=\"0\" y=\"311\" font-size=\"11\" fill=\"#605d5d\">infector stealing FTP credentials to inject IFRAMEs, a distributed SIP/VoIP cracker (Feb 2011), DDoS modules,<\u002Ftext>\n        <text x=\"0\" y=\"326\" font-size=\"11\" fill=\"#605d5d\">experimental Facebook app registration. For the last eight years: EggJagger.<\u002Ftext>\n      <\u002Fsvg>\n      <figcaption style=\"font-size:10.5px;color:#7d7979;border-top:1px solid #d7d3d3;padding-top:7px;margin-top:12px\">Reconstructed from Falliere 2011; payload summary corroborated by CrowdStrike 2026 (credential theft, spam, proxy services, network exploitation, DDoS). Falliere assessed the delivered malware shares a code signature with Sality itself and inferred the same gang wrote it — note the plural, which bears on 11.1. [A, Moderate].<\u002Ffigcaption>\n    <\u002Ffigure>\n\n    <h3 style=\"font-size:20px;margin:26px 0 10px\">5.7 The v3 client-thread cycle<\u002Fh3>\n    <p style=\"font-size:15.5px;line-height:1.6;margin:0 0 6px;max-width:38em\">This is the single most important exhibit in the document. Every forty minutes, each bot walks this ladder for each peer in its list. CrowdStrike's description of the operation maps directly onto it. <strong>[F, High]<\u002Fstrong><\u002Fp>\n\n    <figure style=\"margin:22px 0 30px\">\n      <div style=\"border-top:2px solid #201e1d;padding-top:9px\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0\">Exhibit 10<\u002Fdiv>\n        <div style=\"font-size:17px;margin:2px 0 4px\">Falliere Figure 10, reconstructed — the 40-minute loop is the attack surface<\u002Fdiv>\n        <div style=\"font-size:12px;color:#7d7979;margin-bottom:16px\">Spine on the left is the sequential path; the right column is what happens when a decision branches.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1.15fr 1fr;gap:0 20px;font-size:13.5px\">\n        <div style=\"grid-column:1;padding:9px 12px;background:#201e1d;color:#f3f2f2\">Initialise peer list from registry, or from the bootstrap list embedded in the infected file<\u002Fdiv>\n        <div style=\"grid-column:2\"><\u002Fdiv>\n        <div style=\"grid-column:1;padding:9px 12px;border-left:3px solid #0088b0;background:#f8f4f4;margin-top:2px\"><strong>Send URL Pack query<\u002Fstrong> &nbsp;<span style=\"color:#0088b0;font-size:11.5px\">cmd 3<\u002Fspan><\u002Fdiv>\n        <div style=\"grid-column:2\"><\u002Fdiv>\n        <div style=\"grid-column:1;padding:9px 12px;border-left:3px solid #0088b0;background:#f8f4f4;margin-top:2px\">Process response<\u002Fdiv>\n        <div style=\"grid-column:2\"><\u002Fdiv>\n        <div style=\"grid-column:1;padding:9px 12px;border-left:3px solid #bab6b6;margin-top:2px\">No response, or malformed?<\u002Fdiv>\n        <div style=\"grid-column:2;padding:9px 12px;background:#ffdee6;color:#790e3d;margin-top:2px\"><strong>YES<\u002Fstrong> &nbsp;→&nbsp; decrease goodcount, move on<\u002Fdiv>\n        <div style=\"grid-column:1;padding:9px 12px;border-left:3px solid #bab6b6;margin-top:2px\">Peer has a <em>newer<\u002Fem> URL pack?<\u002Fdiv>\n        <div style=\"grid-column:2;padding:9px 12px;background:#cbeeff;color:#004961;margin-top:2px\"><strong>YES<\u002Fstrong> &nbsp;→&nbsp; install it: RSA verify, then Sequence ID check, then hand URLs to the downloader<\u002Fdiv>\n        <div style=\"grid-column:1;padding:9px 12px;border-left:3px solid #bab6b6;margin-top:2px\">Peer has an <em>older<\u002Fem> URL pack?<\u002Fdiv>\n        <div style=\"grid-column:2;padding:9px 12px;background:#cbeeff;color:#004961;margin-top:2px\"><strong>YES<\u002Fstrong> &nbsp;→&nbsp; give own pack to the server<\u002Fdiv>\n        <div style=\"grid-column:1;padding:9px 12px;border-left:3px solid #0088b0;background:#f8f4f4;margin-top:2px\">Increase goodcount<\u002Fdiv>\n        <div style=\"grid-column:2\"><\u002Fdiv>\n        <div style=\"grid-column:1;padding:9px 12px;border-left:3px solid #bab6b6;margin-top:2px\">Do I already have a Peer ID?<\u002Fdiv>\n        <div style=\"grid-column:2;padding:9px 12px;background:#ffdee6;color:#790e3d;margin-top:2px\"><strong>NO<\u002Fstrong> &nbsp;→&nbsp; send Announcement &amp; Promotion query <span style=\"font-size:11.5px\">cmd 1<\u002Fspan> — <em>the promotion path a defender node rides<\u002Fem><\u002Fdiv>\n        <div style=\"grid-column:1;padding:9px 12px;border-left:3px solid #bab6b6;margin-top:2px\">Is the peer list big enough? &nbsp;<span style=\"color:#605d5d;font-size:11.5px\">≥ 980<\u002Fspan><\u002Fdiv>\n        <div style=\"grid-column:2;padding:9px 12px;background:#ffdee6;color:#790e3d;margin-top:2px\"><strong>NO<\u002Fstrong> &nbsp;→&nbsp; send Peer Exchange query <span style=\"font-size:11.5px\">cmd 2<\u002Fspan> — returns exactly one peer<\u002Fdiv>\n        <div style=\"grid-column:1;padding:9px 12px;border-left:3px solid #bab6b6;margin-top:2px\">Another client left in the peer list?<\u002Fdiv>\n        <div style=\"grid-column:2;padding:9px 12px;background:#eae7e7;color:#444141;margin-top:2px\"><strong>YES<\u002Fstrong> &nbsp;→&nbsp; back to the URL Pack query<\u002Fdiv>\n        <div style=\"grid-column:1;padding:9px 12px;border-left:3px solid #bab6b6;margin-top:2px\">Peer list ≥ 500 entries?<\u002Fdiv>\n        <div style=\"grid-column:2;padding:9px 12px;background:#eae7e7;color:#444141;margin-top:2px\"><strong>YES<\u002Fstrong> &nbsp;→&nbsp; clean the peer list, dropping entries below −30<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:14px;padding:13px 16px;background:#0088b0;color:#f3f2f2;display:flex;justify-content:space-between;align-items:center\">\n        <span style=\"font-size:16px;letter-spacing:0.06em\">WAIT 40 MINUTES<\u002Fspan>\n        <span style=\"font-size:12px;opacity:0.85\">then back to the start of the cycle — indefinitely, as long as the peer list is non-empty<\u002Fspan>\n      <\u002Fdiv>\n      <figcaption style=\"font-size:10.5px;color:#7d7979;border-top:1px solid #d7d3d3;padding-top:7px;margin-top:12px\">Reconstructed from Falliere 2011, Figure 10. Note that the <em>server<\u002Fem> thread never modifies goodcounts — only the client thread does — which is why spoofing malformed packets from known-good peers to tank their reputation does not work.<\u002Ffigcaption>\n    <\u002Ffigure>\n\n    <h3 style=\"font-size:20px;margin:26px 0 10px\">5.8 What v4 added<\u002Fh3>\n    <figure style=\"margin:20px 0 28px\">\n      <div style=\"border-top:2px solid #201e1d;padding-top:9px\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0\">Exhibit 11<\u002Fdiv>\n        <div style=\"font-size:17px;margin:2px 0 14px\">Falliere Figure 11, reconstructed — EXE pack exchange, and the transport split<\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:13px;color:#605d5d;margin:0 0 12px\">Identical to v3 up to the goodcount, Peer ID and Peer Exchange logic. The addition triggers when URL Pack exchange returns the <em>same<\u002Fem> Sequence ID: the client then asks for the peer's EXE Pack Sequence ID.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:1.2fr 1fr;gap:0 20px;font-size:13.5px;margin-bottom:20px\">\n        <div style=\"grid-column:1;padding:9px 12px;border-left:3px solid #bab6b6\">Peer has a <em>newer<\u002Fem> EXE pack?<\u002Fdiv>\n        <div style=\"grid-column:2;padding:9px 12px;background:#cbeeff;color:#004961\"><strong>YES<\u002Fstrong> &nbsp;→&nbsp; get it from the server over TCP<\u002Fdiv>\n        <div style=\"grid-column:1;padding:9px 12px;border-left:3px solid #bab6b6;margin-top:2px\">Peer has an <em>older<\u002Fem> EXE pack?<\u002Fdiv>\n        <div style=\"grid-column:2;padding:9px 12px;background:#cbeeff;color:#004961;margin-top:2px\"><strong>YES<\u002Fstrong> &nbsp;→&nbsp; give own EXE pack to the server over TCP<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:26px\">\n        <div>\n          <div style=\"font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#605d5d;margin-bottom:8px\">EXE pack structure<\u002Fdiv>\n          <div style=\"border:1.5px solid #201e1d;font-size:12.5px\">\n            <div style=\"padding:7px 11px;border-bottom:1px solid #d7d3d3\">Size and CRC<\u002Fdiv>\n            <div style=\"padding:7px 11px;border-bottom:1px solid #d7d3d3\">Digital signature<\u002Fdiv>\n            <div style=\"padding:7px 11px;border-bottom:1px solid #d7d3d3\">Sequence ID<\u002Fdiv>\n            <div style=\"padding:7px 11px;border-bottom:1px solid #d7d3d3\">Number of executables<\u002Fdiv>\n            <div style=\"padding:7px 11px;background:#eae7e7\">Encrypted executables<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#605d5d;margin-bottom:8px\">Transport<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:13.5px;line-height:1.45\">\n            <span style=\"color:#0088b0;font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">UDP<\u002Fspan><span>Signalling, on port <strong>P<\u002Fstrong><\u002Fspan>\n            <span style=\"color:#0088b0;font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">TCP<\u002Fspan><span>Bulk data, on port <strong>P + 19<\u002Fstrong><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-top:12px;padding-top:10px;border-top:2px solid #d6006c;font-size:13px;line-height:1.45;color:#790e3d\">If P+19 is already in use by another process, EXE pack delivery <strong>silently fails<\u002Fstrong>.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <figcaption style=\"font-size:10.5px;color:#7d7979;border-top:1px solid #d7d3d3;padding-top:7px;margin-top:14px\">CrowdStrike's terminology is \"file packs\" for what Falliere called EXE packs, and confirms both channels stop once bots are isolated. Also new in v4: RSA raised to 2048 bits, and URL-fetched executables signed with the marker <span style=\"font-family:ui-monospace,Menlo,monospace\">e#o203kjl,!<\u002Fspan>. [F, High]<\u002Ffigcaption>\n    <\u002Ffigure>\n  <\u002Fdiv>\n\n  <div style=\"break-before:page\">\n    <div style=\"font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0;margin-bottom:8px\">Section 06<\u002Fdiv>\n    <h2 style=\"font-size:32px;margin:0 0 18px;padding-bottom:12px;border-bottom:2px solid #201e1d\">The trust model — where the attack surface is<\u002Fh2>\n    <p style=\"font-size:16px;line-height:1.5;margin:0 0 6px;max-width:36em\">CrowdStrike's framing: bots trusted the network without verifying who was in it. Any publicly reachable machine that answered the handshake correctly was accepted — no authentication, no cryptographic identity, no allowlist. The sole requirement was availability, which made a defender node indistinguishable from a genuinely infected one. <strong>[F, High]<\u002Fstrong><\u002Fp>\n\n    <figure style=\"margin:24px 0 30px\">\n      <div style=\"border-top:2px solid #201e1d;padding-top:9px\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0\">Exhibit 12<\u002Fdiv>\n        <div style=\"font-size:17px;margin:2px 0 14px\">One row is authenticated. Three are not. The takedown lives in the fourth.<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-raw-table class=\"table\" style=\"font-size:14px\">\n        <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:38%\">What Sality trusts<\u002Fsc-raw-th><sc-raw-th style=\"width:22%\">Authenticated?<\u002Fsc-raw-th><sc-raw-th>Consequence<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n        <sc-raw-tbody>\n          <sc-raw-tr><sc-raw-td><strong>Payload and tasking<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fadfda;color:#7d2018\">Yes — RSA signed<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Unforgeable. No defender attack was ever available here.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td><strong>Peer identity<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fbe6cd;color:#7a4a13\">No<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Anyone answering the handshake is a peer.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td><strong>Peer discovery<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fbe6cd;color:#7a4a13\">No<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Peers propagate coordinates they were told, not coordinates they verified.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"background:#fff1f4\"><sc-raw-td><strong>Peer-list updates<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#d6006c;color:#fff1f4\">Vulnerable<\u002Fspan><\u002Fsc-raw-td><sc-raw-td><strong>The exploited row.<\u002Fstrong> Remote behaviour can mutate an existing entry — see 6.3.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n      <figcaption style=\"font-size:10.5px;color:#7d7979;border-top:1px solid #d7d3d3;padding-top:7px;margin-top:12px\">Confirmed by the primary source. Independently corroborated by Falliere 2011 and P2PWNED 2013. [F, High]<\u002Ffigcaption>\n    <\u002Ffigure>\n\n    <h3 style=\"font-size:20px;margin:28px 0 10px\">6.1 v3 versus v4 — the signing evolution<\u002Fh3>\n    <figure style=\"margin:18px 0 26px\">\n      <div style=\"border-top:2px solid #201e1d;padding-top:9px\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0\">Exhibit 13<\u002Fdiv>\n        <div style=\"font-size:17px;margin:2px 0 14px\">v4 closed three holes and left the fourth open<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-raw-table class=\"table\" style=\"font-size:14px\">\n        <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:34%\"><\u002Fsc-raw-th><sc-raw-th style=\"width:33%\">v3 &nbsp;<span style=\"font-weight:400;text-transform:none;letter-spacing:0;font-size:12px\">2009<\u002Fspan><\u002Fsc-raw-th><sc-raw-th>v4 &nbsp;<span style=\"font-weight:400;text-transform:none;letter-spacing:0;font-size:12px\">2010<\u002Fspan><\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n        <sc-raw-tbody>\n          <sc-raw-tr><sc-raw-td>URL pack signed?<\u002Fsc-raw-td><sc-raw-td>Yes — RSA-1024<\u002Fsc-raw-td><sc-raw-td>Yes — RSA-2048<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Payload executable signed?<\u002Fsc-raw-td><sc-raw-td><span style=\"color:#d6006c\"><strong>No<\u002Fstrong> — fatal in v3<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Yes — marker <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13px\">e#o203kjl,!<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Direct executable transfer?<\u002Fsc-raw-td><sc-raw-td>No<\u002Fsc-raw-td><sc-raw-td>Yes — signed file packs over TCP<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"background:#fff1f4\"><sc-raw-td><strong>Peer identity signed?<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>No<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong style=\"color:#d6006c\">No — still the hole<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n      <figcaption style=\"font-size:10.5px;color:#7d7979;border-top:1px solid #d7d3d3;padding-top:7px;margin-top:12px\">Source: Falliere 2011. The common claim that \"Sality's payload channel is unauthenticated\" is true of v3 only — scope any such statement to v3. Kleissner's 2015 observation that payloads were merely RC4'd with no certificate, so anyone re-registering an expired C2 domain could push executables, describes the v3 condition. [F, High]<\u002Ffigcaption>\n    <\u002Ffigure>\n\n    <h3 style=\"font-size:20px;margin:26px 0 10px\">6.2 Falliere's 2011 predictions — both came true<\u002Fh3>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:16px\">\n      <div class=\"keep\" style=\"padding-top:12px;border-top:2px solid #0088b0\">\n        <div style=\"font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#0088b0;margin-bottom:6px\">On v3's external weakness<\u002Fdiv>\n        <p style=\"font-size:14px;line-height:1.5;margin:0 0 8px\">An entity able to take control of the DNS entries in a URL pack and replace the executable could take control of the whole botnet.<\u002Fp>\n        <p style=\"font-size:13px;line-height:1.45;margin:0;color:#0088b0\">→ the law-enforcement domain-seizure component of 2026<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"keep\" style=\"padding-top:12px;border-top:2px solid #0088b0\">\n        <div style=\"font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#0088b0;margin-botto
