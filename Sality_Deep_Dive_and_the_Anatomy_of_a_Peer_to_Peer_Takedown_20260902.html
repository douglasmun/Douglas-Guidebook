aw-tr>\n        <sc-raw-tr><sc-raw-td><strong>Q<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>CSO Online / Computerworld, <em>Do-it-yourself plan to take down Sality botnet outlined on public mailing list<\u002Fem>, Mar 2012<\u002Fsc-raw-td><sc-raw-td>Symantec's position that unilateral remediation of third-party machines is legally and ethically impermissible<\u002Fsc-raw-td><sc-raw-td>Independent<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n\n    <h3 style=\"font-size:18px;margin:22px 0 10px\">17.6 Contemporaneous reporting<\u002Fh3>\n    <sc-raw-table class=\"table\" style=\"font-size:12.5px;margin-bottom:24px\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:40px\">Ref<\u002Fsc-raw-th><sc-raw-th style=\"width:30%\">Source<\u002Fsc-raw-th><sc-raw-th>Value<\u002Fsc-raw-th><sc-raw-th style=\"width:24%\">Independence<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td><strong>G1<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Reuters (Raphael Satter, Las Vegas; Anton Zverev, London), <em>Russian cybercrime operation being dismantled after two decades<\u002Fem>, 1 Sep 2026<\u002Fsc-raw-td><sc-raw-td>Werner quotes; Shadowserver's David Watson on residual risk and possible operator response; <strong>the reported DOJ statement of a Russia nexus that does not appear in F<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Reports E's claims; the Shadowserver comment is independent<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><strong>G2<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Same Reuters wire, republished<\u002Fsc-raw-td><sc-raw-td>Duplicate of G1 for access<\u002Fsc-raw-td><sc-raw-td>Same wire — <strong>not independent corroboration<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n\n    <div class=\"keep\" style=\"margin:0 0 18px;padding-top:14px;border-top:1px solid #d6006c;max-width:40em\">\n      <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#d6006c;margin-bottom:8px\">Independence note — read before citing<\u002Fdiv>\n      <p style=\"font-size:14.5px;line-height:1.55;margin:0\">Tillmann Werner authors or co-authors sources <strong>B, E and I<\u002Fstrong>. The apparent convergence between the 2013 P2PWNED research and the 2026 operation is therefore substantially <strong>the same researcher agreeing with himself<\u002Fstrong>, not independent corroboration. This is why 6.3 rates the eviction-primitive hypothesis [A, Low]. Similarly, sources <strong>D, D2, J1, J2 and J3<\u002Fstrong> are all CrowdStrike, and <strong>G1/G2<\u002Fstrong> are one wire story. Counting these as separate sources would overstate corroboration; the rule at 1.2(2) applies.<\u002Fp>\n    <\u002Fdiv>\n\n    <p style=\"font-size:13.5px;line-height:1.55;color:#605d5d;margin:0 0 24px;max-width:40em\"><strong>Retrieval note.<\u002Fstrong> Source A's original Symantec URL is offline following the Broadcom acquisition; a mirror is available. All other URLs were live as of 2 September 2026.<\u002Fp>\n\n    <p style=\"font-size:13.5px;line-height:1.6;font-style:italic;color:#605d5d;margin:0;padding-top:14px;border-top:2px solid #201e1d;max-width:40em\">Prepared from open sources. The Symantec figures are reconstructed as designed exhibits from the technical descriptions in source A, with the original figure numbering preserved for cross-reference. The RSA modulus comparison at 12.1 and the UDP port-range derivation at 14.4 were independently computed and verified during preparation.<\u002Fp>\n  <\u002Fdiv>\n\n<\u002Fdoc-page>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;pageMargin&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;0.6in&quot;,&quot;0.7in&quot;,&quot;0.85in&quot;],&quot;default&quot;:&quot;0.7in&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Print&quot;},&quot;showSourceNotes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Print&quot;}}\">class Component extends DCLogic {\n  apply() {\n    const root = this.el || document;\n    const page = root.querySelector ? root.querySelector('doc-page') : null;\n    if (page) page.setAttribute('margin', this.props.pageMargin ?? '0.7in');\n    const showSources = this.props.showSourceNotes ?? true;\n    (root.querySelectorAll ? root.querySelectorAll('figcaption') : []).forEach(function (c) {\n      c.style.display = showSources ? '' : 'none';\n    });\n  }\n  componentDidMount() {\n    this.el = null;\n    this.apply();\n    this._t = setTimeout(() => this.apply(), 300);\n  }\n  componentDidUpdate() { this.apply(); }\n  componentWillUnmount() { clearTimeout(this._t); }\n  renderVals() { return {}; }\n}<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
