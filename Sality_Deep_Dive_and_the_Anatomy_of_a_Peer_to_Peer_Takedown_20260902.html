"font-size:15.5px;line-height:1.6;margin:0 0 24px;max-width:38em\">The estimate covers <strong>EggJagger only<\u002Fstrong>; other payload families provided additional revenue. Around US$150k realised over eight years is modest for the world's most resilient P2P botnet — consistent with an operator extracting rather than reinvesting, which is one plausible contributor to the population decline <strong>[A, Low–Moderate]<\u002Fstrong>.<\u002Fp>\n\n    <h3 style=\"font-size:20px;margin:26px 0 10px\">11.4 Victimology<\u002Fh3>\n    <p style=\"font-size:15.5px;line-height:1.6;margin:0 0 14px;max-width:38em\">Fundamentally <strong>non-targeted<\u002Fstrong>. CrowdStrike observed no consistent nation or sector selection, with two unexplained anomalies: higher v3 volumes in Romania, higher v4 volumes in Venezuela. <strong>[F, Moderate]<\u002Fstrong> — from the 2019 profile, not restated in 2026.<\u002Fp>\n    <sc-raw-table class=\"table\" style=\"font-size:13.5px;margin-bottom:18px\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:22%\">Source<\u002Fsc-raw-th><sc-raw-th>Top affected<\u002Fsc-raw-th><sc-raw-th style=\"width:20%\">Confidence<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td>Falliere 2011 (v3 super peers)<\u002Fsc-raw-td><sc-raw-td>Romania, India, Brazil<\u002Fsc-raw-td><sc-raw-td>[F] High for 2011<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Kleissner 2015 (% per day)<\u002Fsc-raw-td><sc-raw-td>India 19.7, Egypt 9.0, <strong>Vietnam 8.7<\u002Fstrong>, Pakistan 6.3, Iran 5.5, <strong>Indonesia 4.7<\u002Fstrong>, China 4.0, <strong>Thailand 3.3<\u002Fstrong>, Turkey 2.6, <strong>Philippines 2.6<\u002Fstrong>, Brazil 2.5, Russia 2.3<\u002Fsc-raw-td><sc-raw-td>[F] High for 2015<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n    <div class=\"keep\" style=\"margin:0 0 20px;padding-top:12px;border-top:1px solid #d6006c;max-width:38em\">\n      <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#d6006c;margin-bottom:6px\">Regional relevance &nbsp;[A, Low–Moderate]<\u002Fdiv>\n      <p style=\"font-size:14.5px;line-height:1.55;margin:0\">Four of the top eleven in 2015 were ASEAN. But this distribution is <strong>eleven years old<\u002Fstrong>, and the population has since fallen by roughly two orders of magnitude — there is no reason to assume the geographic mix survived the decline unchanged. CrowdStrike's post contains an infection-geography map whose per-country breakdown is not in the text. <strong>Obtain that before making any regional exposure claim.<\u002Fstrong><\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:auto 1fr;gap:12px 16px;font-size:14.5px;line-height:1.5;max-width:38em;margin-bottom:22px\">\n      <span style=\"color:#0088b0\">—<\u002Fspan><span><strong>LookingGlass (2022):<\u002Fstrong> Sality in 13% of financial services and 11.87% of energy organisations in its dataset. <strong>[F, Low–Moderate]<\u002Fstrong> — vendor marketing material, methodology and denominator unpublished.<\u002Fspan>\n      <span style=\"color:#0088b0\">—<\u002Fspan><span><strong>Dragos MIMICS:<\u002Fstrong> Sality among the most common malware families in ICS environments, 1,225 detections. <strong>[F, Moderate]<\u002Fstrong> — MIMICS dates to the 2017 SANS ICS Summit. Treat as historical.<\u002Fspan>\n      <span style=\"color:#d6006c\">—<\u002Fspan><span><strong>Dragos PLC-cracker campaign (2022, assessed ongoing):<\u002Fstrong> Sality distributed inside fake PLC/HMI password-cracking tools advertised on social media — ABB, Allen Bradley, Automation Direct, Fuji Electric, LG, Mitsubishi, Omron, Panasonic, Pro-Face, Siemens, Vigor, Weintek. The Automation Direct tool genuinely retrieved passwords by exploiting <strong>CVE-2022-2003<\u002Fstrong> while dropping Sality. <strong>[F, High]<\u002Fstrong> — primary vendor research with a CVE and a vendor firmware fix.<\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"keep\" style=\"margin:0 0 24px;padding-top:12px;border-top:1px solid #201e1d;max-width:38em\">\n      <p style=\"font-size:15px;line-height:1.55;margin:0\">The PLC-cracker campaign is the <strong>highest-concern delivery vector<\u002Fstrong>: it targets engineers with engineering-workstation access and a strong operational incentive to run an untrusted binary. It is independent of the botnet and continues regardless of the takedown <strong>[A, Moderate]<\u002Fstrong> — no source states it has stopped.<\u002Fp>\n    <\u002Fdiv>\n\n    <h3 style=\"font-size:20px;margin:26px 0 10px\">11.5 Behavioural traits<\u002Fh3>\n    <p style=\"font-size:15.5px;line-height:1.6;margin:0 0 16px;max-width:38em\">CrowdStrike's assessment is that although operations were primarily financially motivated, three campaigns show willingness to weaponise the botnet for personal or political ends at short notice.<\u002Fp>\n    <sc-raw-table class=\"table\" style=\"font-size:13.5px;margin-bottom:22px\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:15%\">Date<\u002Fsc-raw-th><sc-raw-th style=\"width:32%\">Target<\u002Fsc-raw-th><sc-raw-th>Assessed motivation<\u002Fsc-raw-th><sc-raw-th style=\"width:22%\">Confidence<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td><strong>Apr 2016<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">forex2030[.]com<\u002Fspan> — Arabic-language natural-resource trading site, rendered unresponsive<\u002Fsc-raw-td><sc-raw-td>Unclear; possibly extortion or suppressing unfavourable information<\u002Fsc-raw-td><sc-raw-td>Occurrence [F] Moderate; motivation [A] <span style=\"color:#790e3d\">Low<\u002Fspan> — CrowdStrike states it remains unclear<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><strong>25 Feb 2022<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">kharkovforum[.]com<\u002Fspan> — Ukrainian forum with a live thread on the Kharkiv offensive. HTTP flood<\u002Fsc-raw-td><sc-raw-td>Patriotic; suppression of invasion discussion<\u002Fsc-raw-td><sc-raw-td>Occurrence [F] Moderate; motivation [A] <span style=\"color:#790e3d\">Low–Moderate<\u002Fspan> — CrowdStrike's wording is \"likely aligned\"<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><strong>Sep 2023<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>AvanChange, a Russian cryptocurrency exchange<\u002Fsc-raw-td><sc-raw-td>Impulsive personal grievance; payload compiled seconds before upload<\u002Fsc-raw-td><sc-raw-td>Occurrence [F] Moderate; motivation [A] <span style=\"color:#790e3d\">Low<\u002Fspan> — inferred from compile timing alone<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n\n    <h4 style=\"font-size:16px;margin:20px 0 10px\">Independently sourced retaliation against researchers<\u002Fh4>\n    <p style=\"font-size:14.5px;line-height:1.55;margin:0 0 12px;max-width:38em\">Kleissner 2015; not mentioned by CrowdStrike. In each case the sole TCP-source attacker was a known Sality infection and the target was the Virus Tracker sinkhole.<\u002Fp>\n    <sc-raw-table class=\"table\" style=\"font-size:13.5px;margin-bottom:22px\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:48px\">#<\u002Fsc-raw-th><sc-raw-th style=\"width:22%\">Date<\u002Fsc-raw-th><sc-raw-th style=\"width:22%\">Volume<\u002Fsc-raw-th><sc-raw-th>Vectors<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td>1<\u002Fsc-raw-td><sc-raw-td>27 Nov 2014<\u002Fsc-raw-td><sc-raw-td>1 Gbps<\u002Fsc-raw-td><sc-raw-td>ICMP + UDP + TCP<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>2<\u002Fsc-raw-td><sc-raw-td>30 Jan 2015<\u002Fsc-raw-td><sc-raw-td>10 Gbps<\u002Fsc-raw-td><sc-raw-td>UDP + TCP + NTP amplification<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>3<\u002Fsc-raw-td><sc-raw-td>13 Mar 2015<\u002Fsc-raw-td><sc-raw-td><strong>120 Gbps<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>NTP + DNS amplification<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>4<\u002Fsc-raw-td><sc-raw-td>21 Jun 2015<\u002Fsc-raw-td><sc-raw-td>10 Gbps<\u002Fsc-raw-td><sc-raw-td>UDP<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n\n    <figure style=\"margin:20px 0 26px\">\n      <div style=\"border-top:2px solid #201e1d;padding-top:9px\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0\">Exhibit 27<\u002Fdiv>\n        <div style=\"font-size:17px;margin:2px 0 14px\">Four behavioural inputs, one conclusion about residual risk<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr auto;gap:0 14px;font-size:14px;align-items:center\">\n        <div style=\"padding:9px 12px;background:#eae7e7\">Financially motivated — the 23-year baseline<\u002Fdiv><div style=\"font-size:11px;color:#605d5d\">[A, High]<\u002Fdiv>\n        <div style=\"text-align:center;color:#7d7979;font-size:13px;padding:2px 0\">+<\u002Fdiv><div><\u002Fdiv>\n        <div style=\"padding:9px 12px;background:#eae7e7\">Patriotic alignment — Kharkiv, 24 hours after the invasion<\u002Fdiv><div style=\"font-size:11px;color:#605d5d\">[A, Low–Moderate]<\u002Fdiv>\n        <div style=\"text-align:center;color:#7d7979;font-size:13px;padding:2px 0\">+<\u002Fdiv><div><\u002Fdiv>\n        <div style=\"padding:9px 12px;background:#eae7e7\">Impulsive retaliation — AvanChange compile timing<\u002Fdiv><div style=\"font-size:11px;color:#605d5d\">[A, Low]<\u002Fdiv>\n        <div style=\"text-align:center;color:#7d7979;font-size:13px;padding:2px 0\">+<\u002Fdiv><div><\u002Fdiv>\n        <div style=\"padding:9px 12px;background:#ffdee6;color:#790e3d\">Anti-researcher DDoS — four attacks on a sinkhole operation<\u002Fdiv><div style=\"font-size:11px;color:#790e3d\">[F, Moderate]<\u002Fdiv>\n        <div style=\"text-align:center;color:#201e1d;font-size:13px;padding:4px 0\">=<\u002Fdiv><div><\u002Fdiv>\n        <div style=\"padding:12px;background:#201e1d;color:#f3f2f2;font-size:15px\">An operator who has previously attacked exactly the kind of infrastructure CrowdStrike has now stood up.<\u002Fdiv><div style=\"font-size:11px;color:#605d5d\">[A, Moderate]<\u002Fdiv>\n      <\u002Fdiv>\n      <figcaption style=\"font-size:10.5px;color:#7d7979;border-top:1px solid #d7d3d3;padding-top:7px;margin-top:14px\">P2PWNED specifically warns that sinkholes are conspicuous and invite counter-attack, whereas partitioning attacks do not expose that surface. CrowdStrike chose sinkholing for the victim-notification benefit. That is a considered trade, and the residual risk sits with the sinkhole infrastructure. [A, Moderate]<\u002Ffigcaption>\n    <\u002Ffigure>\n\n    <h4 style=\"font-size:16px;margin:20px 0 10px\">Other traits<\u002Fh4>\n    <div style=\"display:grid;grid-template-columns:auto 1fr;gap:11px 16px;font-size:14.5px;line-height:1.5;max-width:38em\">\n      <span style=\"color:#0088b0\">—<\u002Fspan><span><strong>Disciplined key management [A, High]<\u002Fstrong> — 23 years, no key compromise after v2. Now evidenced at 12.1, though see KJ-9b: discipline and inability are hard to separate.<\u002Fspan>\n      <span style=\"color:#0088b0\">—<\u002Fspan><span><strong>Iterative engineering against defenders [A, High]<\u002Fstrong> — v4 exists specifically to close the unsigned-executable hole in v3.<\u002Fspan>\n      <span style=\"color:#0088b0\">—<\u002Fspan><span><strong>Low profile as strategy [A, Moderate]<\u002Fstrong> — no ransomware, no extortion, no leak site, no brand. Whether deliberate strategy or simply a small operation is not evidenced.<\u002Fspan>\n      <span style=\"color:#0088b0\">—<\u002Fspan><span><strong>Persistent OPSEC failures [F, High]<\u002Fstrong> — the <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13.5px\">Sector(c), Salavat-city<\u002Fspan> strings; Network 4 URL packs containing entries that could never resolve — a non-existent <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13.5px\">.ds<\u002Fspan> TLD, the bare string <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13.5px\">slwocfd<\u002Fspan> — left uncorrected for years.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"break-before:page\">\n    <div style=\"font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0;margin-bottom:8px\">Section 12<\u002Fdiv>\n    <h2 style=\"font-size:32px;margin:0 0 18px;padding-bottom:12px;border-bottom:2px solid #201e1d\">Protocol ossification<\u002Fh2>\n    <p style=\"font-size:16px;line-height:1.5;margin:0 0 6px;max-width:36em\">Confirmed by the primary source <strong>[F, High]<\u002Fstrong>: Sality's P2P protocol cannot be patched. Because it spreads by attaching to executables on disk, releasing an updated variant would mean competing with the existing strain for the same host files — fragmenting the botnet rather than upgrading it. The protocol behaviour bots exhibit today is what they exhibited twenty years ago.<\u002Fp>\n\n    <figure style=\"margin:24px 0 30px\">\n      <div style=\"border-top:2px solid #201e1d;padding-top:9px\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0\">Exhibit 28<\u002Fdiv>\n        <div style=\"font-size:17px;margin:2px 0 14px\">Resilience bought longevity at the cost of adaptability<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:2px\">\n        <div style=\"background:#eae7e7;padding:13px\"><div style=\"font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#605d5d;margin-bottom:5px\">Step one<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.3\">A protocol defect ships in 2009 and 2010<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#eae7e7;padding:13px\"><div style=\"font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#605d5d;margin-bottom:5px\">Step two<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.3\">The installed population cannot be cleanly patched<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#ffdee6;padding:13px\"><div style=\"font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#790e3d;margin-bottom:5px\">Step three<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.3;color:#790e3d\">The weakness becomes permanent<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#d6006c;padding:13px\"><div style=\"font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#ffdee6;margin-bottom:5px\">Step four<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.3;color:#fff1f4\">A defender eventually reverse-engineers it — catastrophic, systemic, unrecoverable<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <figcaption style=\"font-size:10.5px;color:#7d7979;border-top:1px solid #d7d3d3;padding-top:7px;margin-top:12px\">Source: CrowdStrike 2026, with the same reasoning applied by Falliere to the v2→v3 transition in 2011. The provable form of this chain is the key comparison below.<\u002Ffigcaption>\n    <\u002Ffigure>\n\n    <h3 style=\"font-size:20px;margin:26px 0 10px\">12.1 The RSA keys — independently verified<\u002Fh3>\n    <p style=\"font-size:15.5px;line-height:1.6;margin:0 0 6px;max-width:38em\">CrowdStrike's 2026 YARA rules detect live Sality by scanning process memory for the botnet's hardcoded RSA public keys, alongside the string <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:14px\">IPFILTERDRIVER<\u002Fspan>. Falliere published those same moduli in Annex B of the July 2011 paper, inviting readers to factorise them. Both were normalised — whitespace stripped, case-folded — and compared byte for byte.<\u002Fp>\n\n    <figure style=\"margin:22px 0 28px\">\n      <div style=\"border-top:2px solid #201e1d;padding-top:9px\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0\">Exhibit 29<\u002Fdiv>\n        <div style=\"font-size:17px;margin:2px 0 14px\">Fifteen years apart, byte for byte identical<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:2px\">\n        <div style=\"background:#f8f4f4;padding:14px 16px\">\n          <div style=\"font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#605d5d;margin-bottom:8px\">Sality v3 modulus &nbsp;RSA-1024, e = 65537<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:13px\">\n            <span style=\"color:#444141\">CrowdStrike YARA, 2026-08-18<\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">128 bytes<\u002Fspan>\n            <span style=\"color:#444141\">Falliere Annex B, July 2011<\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">128 bytes<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-top:12px;padding:8px 10px;background:#0088b0;color:#f3f2f2;font-size:13.5px;letter-spacing:0.1em\">RESULT: IDENTICAL<\u002Fdiv>\n          <div style=\"margin-top:10px;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#605d5d;line-height:1.6\">begins 99 65 40 34 cd ae 9d b3 …<br>ends &nbsp;&nbsp;… 26 1a 32 9b<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#f8f4f4;padding:14px 16px\">\n          <div style=\"font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#605d5d;margin-bottom:8px\">Sality v4 modulus &nbsp;RSA-2048, e = 65537<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:13px\">\n            <span style=\"color:#444141\">CrowdStrike YARA, 2026-08-18<\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">256 bytes<\u002Fspan>\n            <span style=\"color:#444141\">Falliere Annex B, July 2011<\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">256 bytes<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-top:12px;padding:8px 10px;background:#0088b0;color:#f3f2f2;font-size:13.5px;letter-spacing:0.1em\">RESULT: IDENTICAL<\u002Fdiv>\n          <div style=\"margin-top:10px;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#605d5d;line-height:1.6\">begins bb d2 96 8e ed 0b 93 8a …<br>ends &nbsp;&nbsp;… 18 e0 d0 7b 3b<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <figcaption style=\"font-size:10.5px;color:#7d7979;border-top:1px solid #d7d3d3;padding-top:7px;margin-top:12px\">Comparison computed and verified during preparation of this document. Independently verifiable by anyone holding both documents. [F, High]<\u002Ffigcaption>\n    <\u002Ffigure>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:22px\">\n      <div class=\"keep\" style=\"padding-top:12px;border-top:2px solid #0088b0\">\n        <div style=\"font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#0088b0;margin-bottom:5px\">KJ-9a &nbsp;[F, High]<\u002Fdiv>\n        <p style=\"font-size:14px;line-height:1.5;margin:0\">The keys are byte-identical across fifteen years.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"keep\" style=\"padding-top:12px;border-top:2px solid #d6006c\">\n        <div style=\"font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#d6006c;margin-bottom:5px\">KJ-9b &nbsp;[A, Moderate–High]<\u002Fdiv>\n        <p style=\"font-size:14px;line-height:1.5;margin:0\">This shows the operator <em>could not<\u002Fem> rotate. A new embedded public key means a new protocol version, which means a separate network, abandoning the installed population. The alternative — that he simply chose not to — cannot be excluded, though it is hard to reconcile with an operator who twice rebuilt his network to close weaknesses.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:14.5px;line-height:1.5;max-width:38em;margin-bottom:22px\">\n      <span style=\"color:#0088b0\">1<\u002Fspan><span><strong>Anyone could have written these detection rules in 2011.<\u002Fstrong> The key material has been public for fifteen years. <strong>[F, High]<\u002Fstrong><\u002Fspan>\n      <span style=\"color:#0088b0\">2<\u002Fspan><span>The operator's most sensitive cryptographic asset was frozen and published. <strong>[F, High]<\u002Fstrong><\u002Fspan>\n      <span style=\"color:#0088b0\">3<\u002Fspan><span>This is the provable form of KJ-5. Where CrowdStrike <em>asserts<\u002Fem> the protocol could not be patched, the key comparison <em>evidences<\u002Fem> it. <strong>[A, High]<\u002Fstrong><\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"keep\" style=\"margin:0;padding-top:14px;border-top:1px solid #201e1d;max-width:38em\">\n      <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#d6006c;margin-bottom:8px\">The inversion worth putting in the assessment<\u002Fdiv>\n      <p style=\"font-size:17px;line-height:1.45;margin:0;font-style:italic\">The same architecture that made Sality immune to centralised takedown also froze its protocol <em>and its cryptography<\u002Fem>. A botnet that can push signed code updates to itself does not have this problem — which is precisely the property to test for in any candidate target.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"break-before:page\">\n    <div style=\"font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0;margin-bottom:8px\">Section 13<\u002Fdiv>\n    <h2 style=\"font-size:32px;margin:0 0 18px;padding-bottom:12px;border-bottom:2px solid #201e1d\">Disruption is not remediation<\u002Fh2>\n    <p style=\"font-size:16px;line-height:1.5;margin:0 0 6px;max-width:36em\">What was achieved is a <strong>network quarantine at botnet scale<\u002Fstrong>. Every infected executable on every victim disk is still infected and still active. Shadowserver supports ISPs and CSIRTs with infection identification and victim notification. <strong>[F, High]<\u002Fstrong><\u002Fp>\n\n    <figure style=\"margin:22px 0 28px\">\n      <div style=\"border-top:2px solid #201e1d;padding-top:9px\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0\">Exhibit 30<\u002Fdiv>\n        <div style=\"font-size:17px;margin:2px 0 14px\">What changed, and what did not<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:2px\">\n        <div style=\"background:#cbeeff;padding:14px 16px\">\n          <div style=\"font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#004961;margin-bottom:8px\">Changed<\u002Fdiv>\n          <div style=\"display:grid;gap:6px;font-size:13.5px;line-height:1.4;color:#004961\">\n            <span>The bot cannot receive useful C2<\u002Fspan>\n            <span>New URL packs and file packs cannot reach it<\u002Fspan>\n            <span>Payload delivery has stopped<\u002Fspan>\n            <span>Verified victim telemetry now exists<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#ffdee6;padding:14px 16px\">\n          <div style=\"font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#790e3d;margin-bottom:8px\">Unchanged<\u002Fdiv>\n          <div style=\"display:grid;gap:6px;font-size:13.5px;line-height:1.4;color:#790e3d\">\n            <span>The infected executable still exists and still runs<\u002Fspan>\n            <span>Malware already installed remains active<\u002Fspan>\n            <span>File infection and lateral spread continue (8.4)<\u002Fspan>\n            <span>Safe Mode may still be unavailable<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <figcaption style=\"font-size:10.5px;color:#7d7979;border-top:1px solid #d7d3d3;padding-top:7px;margin-top:12px\"><strong>Sinkholing, not partitioning [F, High — two independent sources].<\u002Fstrong> CrowdStrike states the sinkhole entries provide visibility into operation progress and enable infection tracking and victim notification; DOJ independently describes the action as a peer-to-peer sinkhole operation.<\u002Ffigcaption>\n    <\u002Ffigure>\n\n    <p style=\"font-size:15.5px;line-height:1.6;margin:0 0 16px;max-width:38em\"><strong>Notification pathway, now independently confirmed [F, High]:<\u002Fstrong> DOJ states that Shadowserver is working with internet service providers and Computer Security Incident Response Teams to identify infections and aid victim notification and remediation. Shadowserver's CSIRT distribution is global and includes national CERTs.<\u002Fp>\n\n    <sc-raw-table class=\"table\" style=\"font-size:13.5px\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th>Claim<\u002Fsc-raw-th><sc-raw-th style=\"width:52px\">Type<\u002Fsc-raw-th><sc-raw-th style=\"width:34%\">Confidence<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td>A victim-notification mechanism exists and runs through ISPs and CSIRTs<\u002Fsc-raw-td><sc-raw-td>[F]<\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fadfda;color:#7d2018\">High<\u002Fspan> — corroborated by DOJ, independent of the vendor<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>That pathway is capable of reaching national CERTs outside the US and EU<\u002Fsc-raw-td><sc-raw-td>[A]<\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fbe6cd;color:#7a4a13\">Moderate<\u002Fspan> — Shadowserver's ordinary distribution model, not stated for this operation specifically<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr style=\"background:#fff1f4\"><sc-raw-td>Singapore or regional constituents <strong>will in fact<\u002Fstrong> receive Sality notifications<\u002Fsc-raw-td><sc-raw-td>[A]<\u002Fsc-raw-td><sc-raw-td><span style=\"display:inline-block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;background:#fbeec2;color:#6e5307\">Low<\u002Fspan> — unevidenced. <strong>Action: confirm directly with SingCERT or your national CSIRT contact rather than assuming<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n  <\u002Fdiv>\n\n  <div style=\"break-before:page\">\n    <div style=\"font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0;margin-bottom:8px\">Section 14<\u002Fdiv>\n    <h2 style=\"font-size:32px;margin:0 0 18px;padding-bottom:12px;border-bottom:2px solid #201e1d\">Detection, hunting and remediation<\u002Fh2>\n\n    <h3 style=\"font-size:20px;margin:0 0 12px\">14.1 Confirmed post-disruption indicators<\u002Fh3>\n    <figure style=\"margin:16px 0 28px\">\n      <div style=\"border-top:2px solid #201e1d;padding-top:9px\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0\">Exhibit 31<\u002Fdiv>\n        <div style=\"font-size:17px;margin:2px 0 14px\">The single highest-value indicator, and the final tasking the botnet ever carried<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#d6006c;color:#fff1f4;padding:16px 18px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:20px\">\n        <div>\n          <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;opacity:0.85;margin-bottom:5px\">Lighthouse sinkhole IP &nbsp;[F, High]<\u002Fdiv>\n          <div style=\"font-family:ui-monospace,Menlo,monospace;font-size:24px;letter-spacing:0.02em\">188.166.101[.]148<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px;line-height:1.45;max-width:20em\">Review network logs and endpoint telemetry for <strong>UDP traffic<\u002Fstrong> to this address. Any match indicates a Sality infection requiring remediation.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1.5fr 1fr;gap:22px\">\n        <div>\n          <div style=\"font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#605d5d;margin-bottom:7px\">Sality v3 — URL pack version 25202<\u002Fdiv>\n          <div style=\"background:#f8f4f4;padding:11px 13px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.85;color:#444141;word-break:break-all\">http[:]//theunforgiven.p8[.]hu/img/top.gif<br>http[:]//painelwebradiodigital.awardspace[.]info/v3/readme.pdf<br>http[:]//sgwebdesigner.free[.]fr/left.gif<br>http[:]//www.yonelco[.]com/icon.png<br>http[:]//pozdravizbeograda[.]com/readme.pdf<br>http[:]//highclass.atspace[.]com/styles.gif<br>http[:]//situluimihai.3x[.]ro/top.png<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#605d5d;margin-bottom:7px\">Sality v4 — version 31010<\u002Fdiv>\n          <div style=\"background:#f8f4f4;padding:11px 13px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.85;color:#444141;word-break:break-all\">http[:]//gatheredovertime[.]com/nb4<br>http[:]//imagebucket[.]biz/nv4<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <figcaption style=\"font-size:10.5px;color:#7d7979;border-top:1px solid #d7d3d3;padding-top:7px;margin-top:14px\">Source: CrowdStrike 2026. [F, High] Add all nine URLs to proxy and DNS blocklists, and hunt historically.<\u002Ffigcaption>\n    <\u002Ffigure>\n\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:26px\">\n      <div class=\"keep\" style=\"padding-top:12px;border-top:2px solid #0088b0\">\n        <div style=\"font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#0088b0;margin-bottom:6px\">Free-hosting pattern &nbsp;[A, Moderate]<\u002Fdiv>\n        <p style=\"font-size:13.5px;line-height:1.5;margin:0\"><span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">p8.hu<\u002Fspan>, <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">awardspace.info<\u002Fspan>, <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">free.fr<\u002Fspan>, <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">atspace.com<\u002Fspan> and <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">3x.ro<\u002Fspan> are free web hosts — a shift from the compromised-legitimate-site pattern of 2011–15, consistent with a low-overhead operation. Nine URLs is a small sample; do not over-read.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"keep\" style=\"padding-top:12px;border-top:2px solid #0088b0\">\n        <div style=\"font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#0088b0;margin-bottom:6px\">Masquerade evolution &nbsp;[F, High]<\u002Fdiv>\n        <p style=\"font-size:13.5px;line-height:1.5;margin:0\">The historic <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">/logo.gif<\u002Fspan> and <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">/bottom.gif<\u002Fspan> convention has broadened to <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">readme.pdf<\u002Fspan>, <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">icon.png<\u002Fspan>, <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">styles.gif<\u002Fspan>, and in v4 to extensionless paths. <strong>Detection logic keyed to <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">/logo.gif<\u002Fspan> would have missed the final packs.<\u002Fstrong><\u002Fp>\n      <\u002Fdiv>\n      <div class=\"keep\" style=\"padding-top:12px;border-top:2px solid #d6006c\">\n        <div style=\"font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#d6006c;margin-bottom:6px\">Sequence-ID anomaly<\u002Fdiv>\n        <p style=\"font-size:13.5px;line-height:1.5;margin:0\">v3 reached 25202 and v4 31010, against 241 and 96 in 2015 telemetry. Either the numbering scheme changed or pack cadence increased by roughly two orders of magnitude. v4 — always the far smaller network — carries the <em>higher<\u002Fem> number. <strong>Unexplained.<\u002Fstrong> [F, High] for the observation; [A, Low] for any explanation.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"font-size:20px;margin:26px 0 10px\">14.2 YARA — memory scanning<\u002Fh3>\n    <p style=\"font-size:15.5px;line-height:1.6;margin:0 0 14px;max-width:38em\">CrowdStrike published <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:14px\">CrowdStrike_Salityv3_01<\u002Fspan> and <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:14px\">CrowdStrike_Salityv4_01<\u002Fspan>, both dated 2026-08-18. The structure of each is two conditions:<\u002Fp>\n    <div style=\"background:#201e1d;color:#f3f2f2;padding:15px 18px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.9;margin-bottom:16px\">\n      <span style=\"color:#bab6b6\">strings:<\u002Fspan><br>\n      &nbsp;&nbsp;$ = \"IPFILTERDRIVER\"<span style=\"color:#7d7979\">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;// the amsint32 packet-filter component<\u002Fspan><br>\n      &nbsp;&nbsp;$ = { &lt;RSA public modulus bytes&gt; }<span style=\"color:#7d7979\">&nbsp;&nbsp;// v3: 128 bytes / v4: 256 bytes<\u002Fspan><br>\n      <span style=\"color:#bab6b6\">condition:<\u002Fspan><br>\n      &nbsp;&nbsp;all of them\n    <\u002Fdiv>\n    <p style=\"font-size:15.5px;line-height:1.6;margin:0 0 12px;max-width:38em\">They scan <strong>running processes<\u002Fstrong>, not files on disk — the correct choice, since the polymorphic infector produces a different decryptor per infected binary but the same in-memory payload. <strong>[A, Moderate]<\u002Fstrong> for that rationale; CrowdStrike does not state it. Take the rules from the CrowdStrike post directly; the modulus bytes are independently recoverable from Annex B of the 2011 Symantec paper if you need to modify or extend them.<\u002Fp>\n\n    <h3 style=\"font-size:20px;margin:28px 0 12px\">14.3 Host indicators<\u002Fh3>\n    <sc-raw-table class=\"table\" style=\"font-size:11.2px;margin-bottom:26px\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:31%\">Indicator<\u002Fsc-raw-th><sc-raw-th style=\"width:13%\">Type<\u002Fsc-raw-th><sc-raw-th style=\"width:15%\">Confidence<\u002Fsc-raw-th><sc-raw-th>Notes<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td>Mutex <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">uxJLpe1m<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Mutex<\u002Fsc-raw-td><sc-raw-td>[F] High<\u002Fsc-raw-td><sc-raw-td>Unique across variants. Best host IOC and inoculation vector<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Mutexes <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">purity_control_4428<\u002Fspan>, <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">kukutrusted!<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Mutex<\u002Fsc-raw-td><sc-raw-td>[F] Moderate<\u002Fsc-raw-td><sc-raw-td>Kleissner 2015, variant-specific<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Mutexes <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">&lt;ProcessName&gt;M_&lt;PID&gt;_<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Mutex<\u002Fsc-raw-td><sc-raw-td>[F] High<\u002Fsc-raw-td><sc-raw-td>Many instances is a strong indicator<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Service <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">amsint32<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Service<\u002Fsc-raw-td><sc-raw-td>[F] High<\u002Fsc-raw-td><sc-raw-td>Stable across variants; driver filename usually pseudo-random<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">\\Device\\amsint32<\u002Fspan>, <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">\\DosDevices\\amsint32<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Device<\u002Fsc-raw-td><sc-raw-td>[F] Moderate<\u002Fsc-raw-td><sc-raw-td>Kleissner / BU-CERT, not in Falliere<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>String <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">IPFILTERDRIVER<\u002Fspan> in process memory<\u002Fsc-raw-td><sc-raw-td>Memory<\u002Fsc-raw-td><sc-raw-td>[F] High<\u002Fsc-raw-td><sc-raw-td>Confirmed present in 2026 samples via the YARA rules<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">SafeBoot<\u002Fspan> keys deleted, HKCU and HKLM<\u002Fsc-raw-td><sc-raw-td>Registry<\u002Fsc-raw-td><sc-raw-td>[F] High<\u002Fsc-raw-td><sc-raw-td>Blocks Safe Mode recovery<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Peer list under a username-seeded pseudo-random <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">HKCU<\u002Fspan> key<\u002Fsc-raw-td><sc-raw-td>Registry<\u002Fsc-raw-td><sc-raw-td>[F] High<\u002Fsc-raw-td><sc-raw-td>Rows of REG_DWORD named <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">A1_0<\u002Fspan>, <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">A1_1<\u002Fspan>, <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">A2_0<\u002Fspan> …<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Security Center overrides set<\u002Fsc-raw-td><sc-raw-td>Registry<\u002Fsc-raw-td><sc-raw-td>[F] High<\u002Fsc-raw-td><sc-raw-td><span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">AntiVirusOverride<\u002Fspan>, <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">AntiVirusDisableNotify<\u002Fspan>, <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">FirewallDisableNotify<\u002Fspan>, <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">FirewallOverride<\u002Fspan>, <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">UpdatesDisableNotify<\u002Fspan>, <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">UacDisableNotify<\u002Fspan>, <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">AntiSpywareOverride<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">autorun.inf<\u002Fspan> plus a random <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">.exe<\u002Fspan>/<span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">.cmd<\u002Fspan>/<span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">.pif<\u002Fspan> at a drive root<\u002Fsc-raw-td><sc-raw-td>File<\u002Fsc-raw-td><sc-raw-td>[F] High<\u002Fsc-raw-td><sc-raw-td>Infected Calculator or Minesweeper copy — the USB vector<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Entry points overwritten with <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">CC C3 CC C3 …<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>File<\u002Fsc-raw-td><sc-raw-td>[F] High<\u002Fsc-raw-td><sc-raw-td>Destroyed security binaries<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Missing or deleted <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">.vdb<\u002Fspan>, <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">.avc<\u002Fspan> files<\u002Fsc-raw-td><sc-raw-td>File<\u002Fsc-raw-td><sc-raw-td>[F] High<\u002Fsc-raw-td><sc-raw-td>AV definition files hunted and deleted<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>AV updates failing; AV vendor sites unreachable<\u002Fsc-raw-td><sc-raw-td>Behaviour<\u002Fsc-raw-td><sc-raw-td>[F] High<\u002Fsc-raw-td><sc-raw-td>Driver-level packet filtering<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n\n    <h3 style=\"font-size:20px;margin:26px 0 10px\">14.4 Network detection<\u002Fh3>\n    <figure style=\"margin:16px 0 26px\">\n      <div style=\"border-top:2px solid #201e1d;padding-top:9px\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0\">Exhibit 32<\u002Fdiv>\n        <div style=\"font-size:17px;margin:2px 0 14px\">Rule logic — high-confidence identification with no secret material<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#605d5d;margin-bottom:10px\">UDP, ports ~4,224–17,083 plus 9,674<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;line-height:1.45\">\n        <span style=\"color:#0088b0\">1<\u002Fspan><span>Take the first two bytes as WORD <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13px\">h<\u002Fspan>, the next two as WORD <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13px\">n<\u002Fspan><\u002Fspan>\n        <span style=\"color:#0088b0\">2<\u002Fspan><span>Check <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13px\">n == packet_len − 4<\u002Fspan> &nbsp;<span style=\"color:#605d5d\">— a cheap structural filter<\u002Fspan><\u002Fspan>\n        <span style=\"color:#0088b0\">3<\u002Fspan><span>Derive the RC4 key <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13px\">k = MAKE_DWORD(h, n)<\u002Fspan><\u002Fspan>\n        <span style=\"color:#0088b0\">4<\u002Fspan><span>RC4-decrypt the remainder<\u002Fspan>\n        <span style=\"color:#0088b0\">5<\u002Fspan><span>Verify <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13px\">decrypted[0x00]<\u002Fspan> (Version) is in {3, 4} and <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13px\">decrypted[0x05]<\u002Fspan> (Command) is in {1, 2, 3}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background:#0088b0;color:#f3f2f2;padding:11px 14px;margin-top:14px;font-size:14.5px\">High-confidence Sality identification — no secret material required.<\u002Fdiv>\n      <figcaption style=\"font-size:10.5px;color:#7d7979;border-top:1px solid #d7d3d3;padding-top:7px;margin-top:12px\"><strong>Derivation note.<\u002Fstrong> A range of \"roughly 3,200–18,100\" is sometimes quoted; it comes from applying the formula across the full printable-ASCII space. Windows computer names are restricted to letters, digits and hyphen, giving 4,224–17,083 (uppercase-only: 4,224–10,299) across 1,751 distinct values. 9,674 is also reachable via the formula, so it does not reliably identify the short-name fallback case. The constants C and f are implementation-specific — <strong>widen the range rather than narrow it.<\u002Fstrong><\u002Ffigcaption>\n    <\u002Ffigure>\n\n    <div style=\"display:grid;grid-template-columns:auto 1fr;gap:11px 16px;font-size:14.5px;line-height:1.5;max-width:38em;margin-bottom:26px\">\n      <span style=\"color:#d6006c\">—<\u002Fspan><span><strong>UDP to <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13.5px\">188.166.101.148<\u002Fspan><\u002Fstrong> — confirmed infection, highest priority.<\u002Fspan>\n      <span style=\"color:#0088b0\">—<\u002Fspan><span>Periodic outbound UDP fan-out to many diverse public IPs on a <strong>fixed source port<\u002Fstrong> at a <strong>~40-minute cadence<\u002Fstrong> from a workstation.<\u002Fspan>\n      <span style=\"color:#0088b0\">—<\u002Fspan><span>v4 only: TCP on (UDP port + 19). Kleissner records a default of 9673, which conflicts — detect on both.<\u002Fspan>\n      <span style=\"color:#0088b0\">—<\u002Fspan><span>HTTP GETs to the final URL-pack paths, and more generally small image- or PDF-named files returning RC4-encrypted PE content from free-hosted sites.<\u002Fspan>\n    <\u002Fdiv>\n\n    <h3 style=\"font-size:20px;margin:26px 0 12px\">14.5 Remediation<\u002Fh3>\n    <div style=\"display:grid;grid-template-columns:auto 1fr;gap:11px 16px;font-size:15px;line-height:1.55;max-width:38em\">\n      <span style=\"color:#0088b0\">—<\u002Fspan><span><strong>Existing malware remains active.<\u002Fstrong> Isolation is not cleanup. <strong>[F, High]<\u002Fstrong><\u002Fspan>\n      <span style=\"color:#0088b0\">—<\u002Fspan><span><strong>Propagation has likely not stopped.<\u002Fstrong> Treat any infected host as still spreading. <strong>[A, Moderate]<\u002Fstrong><\u002Fspan>\n      <span style=\"color:#0088b0\">—<\u002Fspan><span><strong>Inoculation:<\u002Fstrong> pre-creating <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13.5px\">uxJLpe1m<\u002Fspan> prevents infection — a cheap compensating control where EDR cannot run. <strong>[A, Moderate]<\u002Fstrong> against 2026 variants. Test first.<\u002Fspan>\n      <span style=\"color:#0088b0\">—<\u002Fspan><span><strong>Cleaning is destructive by nature.<\u002Fstrong> Sality is a virus, not a trojan; it modifies legitimate binaries in place.<\u002Fspan>\n      <span style=\"color:#0088b0\">—<\u002Fspan><span><strong>Safe Mode may be unavailable<\u002Fstrong> — the protector deletes the SafeBoot keys. Restore them first.<\u002Fspan>\n      <span style=\"color:#0088b0\">—<\u002Fspan><span>Assume any USB or shared drive touched by an infected host is contaminated.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"break-before:page\">\n    <div style=\"font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0;margin-bottom:8px\">Section 15<\u002Fdiv>\n    <h2 style=\"font-size:32px;margin:0 0 18px;padding-bottom:12px;border-bottom:2px solid #201e1d\">Applicability assessment<\u002Fh2>\n\n    <h3 style=\"font-size:20px;margin:0 0 10px\">15.1 The generalisable insight<\u002Fh3>\n    <p style=\"font-size:15.5px;line-height:1.6;margin:0 0 6px;max-width:38em\">The reusable idea is <strong>not<\u002Fstrong> \"poison a peer list.\" It is: <em>attack the unauthenticated control-plane information of a decentralised malware overlay rather than its authenticated command payloads.<\u002Fem> By controlling <strong>who bots believe they should talk to<\u002Fstrong>, the defender never needs the operator's signing key.<\u002Fp>\n\n    <figure style=\"margin:22px 0 28px\">\n      <div style=\"border-top:2px solid #201e1d;padding-top:9px\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0\">Exhibit 33<\u002Fdiv>\n        <div style=\"font-size:17px;margin:2px 0 14px\">Two planes, one of which is worth attacking<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:2px\">\n        <div style=\"background:#eae7e7;padding:16px 18px\">\n          <div style=\"font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#605d5d;margin-bottom:8px\">Data plane / tasking<\u002Fdiv>\n          <div style=\"font-size:16px;margin-bottom:10px\">Signed and difficult to forge<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.5;color:#444141\">RSA-signed URL packs. Sequence-ID monotonicity. In v4, signed executables as well.<\u002Fdiv>\n          <div style=\"margin-top:14px;padding-top:9px;border-top:2px solid #7d7979;font-size:14px;color:#605d5d\">Do not attack this<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#cbeeff;padding:16px 18px\">\n          <div style=\"font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#004961;margin-bottom:8px\">Control plane / topology<\u002Fdiv>\n          <div style=\"font-size:16px;margin-bottom:10px;color:#004961\">Unauthenticated throughout<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.5;color:#006786\">Peer identity · peer discovery · neighbour maintenance · peer eviction<\u002Fdiv>\n          <div style=\"margin-top:14px;padding-top:9px;border-top:2px solid #d6006c;font-size:14px;color:#790e3d\"><strong>Attack here<\u002Fstrong><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <figcaption style=\"font-size:10.5px;color:#7d7979;border-top:1px solid #d7d3d3;padding-top:7px;margin-top:12px\"><strong>Technical applicability: HIGH as a technique family [A, Moderate]. Target-specific applicability: CONDITIONAL [A, High]<\u002Fstrong> — it depends entirely on the target's peer-admission design.<\u002Ffigcaption>\n    <\u002Ffigure>\n\n    <h3 style=\"font-size:20px;margin:26px 0 12px\">15.2 Candidate-scoring dimensions<\u002Fh3>\n    <figure style=\"margin:16px 0 28px\">\n      <div style=\"border-top:2px solid #201e1d;padding-top:9px\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0\">Exhibit 34<\u002Fdiv>\n        <div style=\"font-size:17px;margin:2px 0 10px\">Thirteen questions to ask of any candidate — Sality answered every one the wrong way<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-raw-table class=\"table\" style=\"font-size:12.6px\">\n        <sc-raw-thead><sc-raw-tr><sc-raw-th>Question<\u002Fsc-raw-th><sc-raw-th style=\"width:22%\">Sality<\u002Fsc-raw-th><sc-raw-th style=\"width:30%\">Takedown implication<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n        <sc-raw-tbody>\n          <sc-raw-tr><sc-raw-td>Can an arbitrary node join?<\u002Fsc-raw-td><sc-raw-td><strong>Yes<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td style=\"color:#790e3d\">Critical weakness<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Is peer identity cryptographically authenticated?<\u002Fsc-raw-td><sc-raw-td><strong>No<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td style=\"color:#790e3d\">Critical weakness<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Can peers advertise and discover other peers?<\u002Fsc-raw-td><sc-raw-td><strong>Yes<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Enables poisoning propagation<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Is peer state mutable?<\u002Fsc-raw-td><sc-raw-td><strong>Yes<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Required<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Is the neighbour list bounded?<\u002Fsc-raw-td><sc-raw-td><strong>Yes<\u002Fstrong> — 1,000<\u002Fsc-raw-td><sc-raw-td>Makes displacement feasible<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Can remote behaviour cause peer eviction?<\u002Fsc-raw-td><sc-raw-td><strong>Yes<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td style=\"color:#790e3d\">Critical<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Are publicly reachable backbone nodes identifiable?<\u002Fsc-raw-td><sc-raw-td><strong>Yes<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Provides initial targets<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Do NAT'd bots rely upon those nodes?<\u002Fsc-raw-td><sc-raw-td><strong>Yes<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Allows poisoning to cascade<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Are commands dependent upon the P2P overlay?<\u002Fsc-raw-td><sc-raw-td><strong>Yes<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Isolation kills C2<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Is there independent fallback C2?<\u002Fsc-raw-td><sc-raw-td><strong>No<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td style=\"color:#790e3d\">Decisive<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Can the operator remotely repair the P2P code?<\u002Fsc-raw-td><sc-raw-td><strong>No<\u002Fstrong> — the file-infector architecture forbids it<\u002Fsc-raw-td><sc-raw-td>Makes disruption durable<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Can the operator rotate cryptographic keys?<\u002Fsc-raw-td><sc-raw-td><strong>No<\u002Fstrong> — a new key is a new network<\u002Fsc-raw-td><sc-raw-td>Makes detection durable<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Are residual payload servers removable?<\u002Fsc-raw-td><sc-raw-td><strong>Yes<\u002Fstrong>, via LE coordination<\u002Fsc-raw-td><sc-raw-td>Completes disruption<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n      <div style=\"background:#201e1d;color:#f3f2f2;padding:10px 14px;margin-top:10px\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#bab6b6;margin-bottom:6px\">A botnet is a strong candidate when all five hold<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:10px;font-size:12px;line-height:1.35\">\n          <span>Unauthenticated peer admission<\u002Fspan>\n          <span>Remotely influenceable neighbour table<\u002Fspan>\n          <span>Finite or replaceable peer state<\u002Fspan>\n          <span>P2P essential for tasking<\u002Fspan>\n          <span>No robust independent recovery channel<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <figcaption style=\"font-size:10.5px;color:#7d7979;border-top:1px solid #d7d3d3;padding-top:7px;margin-top:12px\">Derived from P2PWNED's resilience model and the mechanics in Sections 5 and 6 of this document.<\u002Ffigcaption>\n    <\u002Ffigure>\n\n    <h3 style=\"font-size:20px;margin:26px 0 12px\">15.3 Where this approach will not work<\u002Fh3>\n    <figure style=\"margin:16px 0 28px\">\n      <div style=\"border-top:2px solid #201e1d;padding-top:9px\">\n        <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0\">Exhibit 35<\u002Fdiv>\n        <div style=\"font-size:17px;margin:2px 0 14px\">Five blockers — and modern threats are built the way Sality was not<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px\">\n        <div class=\"keep\" style=\"padding-top:11px;border-top:2px solid #201e1d\">\n          <div style=\"font-size:15px;margin-bottom:6px\">Authenticated peers<\u002Fdiv>\n          <p style=\"font-size:13.5px;line-height:1.5;margin:0 0 8px\">If neighbour advertisements are signed or identities bound cryptographically, you cannot inject your own nodes.<\u002Fp>\n          <div style=\"font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:#eae7e7;padding:7px 9px;color:#444141\">peer record: IP + port + nodeID + signature<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"keep\" style=\"padding-top:11px;border-top:2px solid #201e1d\">\n          <div style=\"font-size:15px;margin-bottom:6px\">Strong Sybil resistance<\u002Fdiv>\n          <p style=\"font-size:13.5px;line-height:1.5;margin:0\">Reputation, proof-of-work, long-lived authenticated identities or constrained admission make mass introduction of defender nodes impractical.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"keep\" style=\"padding-top:11px;border-top:2px solid #d6006c\">\n          <div style=\"font-size:15px;margin-bottom:6px\">Independent fallback C2 — the decisive factor<\u002Fdiv>\n          <p style=\"font-size:13.5px;line-height:1.5;margin:0 0 8px\">Break P2P and the DGA and Tor channels still work. Poisoning P2P accomplishes little. GameOver Zeus is the canonical example of why simultaneous coordinated disruption matters.<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:2px;font-size:11.5px;text-align:center\">\n            <div><div style=\"background:#eae7e7;padding:5px\">P2P<\u002Fdiv><div style=\"padding:4px;color:#790e3d\">broken<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"background:#eae7e7;padding:5px\">DGA<\u002Fdiv><div style=\"padding:4px;color:#006786\">works<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"background:#eae7e7;padding:5px\">Tor<\u002Fdiv><div style=\"padding:4px;color:#006786\">works<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"keep\" style=\"padding-top:11px;border-top:2px solid #201e1d\">\n          <div style=\"font-size:15px;margin-bottom:6px\">Independently signed repair channel<\u002Fdiv>\n          <p style=\"font-size:13.5px;line-height:1.5;margin:0\">If the operator can push a new protocol, new bootstrap nodes, a new public key or a peer-table reset through a separate mechanism, they recover. This is precisely what Sality could <strong>not<\u002Fstrong> do.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"keep\" style=\"padding-top:11px;border-top:2px solid #201e1d;grid-column:1 / -1\">\n          <div style=\"font-size:15px;margin-bottom:6px\">Public P2P substrate<\u002Fdiv>\n          <p style=\"font-size:13.5px;line-height:1.5;margin:0\">Malware using something like the BitTorrent DHT as an external dead-drop is a different problem: the defender does not control the P2P implementation and cannot rewrite the legitimate global network's topology. CrowdStrike's own Glassworm takedown (May 2026) faced exactly this — blockchain, P2P and legitimate web services as parallel resolution layers, requiring all four channels struck simultaneously. <strong>Glassworm is the useful contrast case for your framework. [A, High]<\u002Fstrong><\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <figcaption style=\"font-size:10.5px;color:#7d7979;border-top:1px solid #d7d3d3;padding-top:7px;margin-top:14px\">Sources: P2PWNED 2013; CrowdStrike GameOver Zeus, Kelihos and Glassworm write-ups.<\u002Ffigcaption>\n    <\u002Ffigure>\n\n    <h3 style=\"font-size:20px;margin:26px 0 12px\">15.4 Investigation sequence for a candidate botnet<\u002Fh3>\n    <div style=\"display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:14.5px;line-height:1.5;max-width:38em;margin-bottom:20px\">\n      <span style=\"color:#0088b0\">01<\u002Fspan><span><strong>Reverse-engineer peer admission<\u002Fstrong> — can an unauthorised participant complete peer establishment?<\u002Fspan>\n      <span style=\"color:#0088b0\">02<\u002Fspan><span><strong>Map neighbour-table semantics<\u002Fstrong> — size limits, eviction, aging, reputation, replacement, bootstrap behaviour.<\u002Fspan>\n      <span style=\"color:#0088b0\">03<\u002Fspan><span><strong>Determine who controls peer advertisements<\u002Fstrong> — peer-generated or operator-signed.<\u002Fspan>\n      <span style=\"color:#0088b0\">04<\u002Fspan><span><strong>Identify topology<\u002Fstrong> — ordinary peers versus routable relays and super peers; graph centrality.<\u002Fspan>\n      <span style=\"color:#0088b0\">05<\u002Fspan><span><strong>Test propagation<\u002Fstrong> — can controlled membership information travel beyond the directly contacted peer?<\u002Fspan>\n      <span style=\"color:#0088b0\">06<\u002Fspan><span><strong>Identify recovery mechanisms<\u002Fstrong> — DGA, DNS, Tor, blockchain, public services, hardcoded peers, secondary protocols.<\u002Fspan>\n      <span style=\"color:#0088b0\">07<\u002Fspan><span><strong>Identify update mechanisms<\u002Fstrong> — can the operator repair or reset topology remotely? Can they rotate keys?<\u002Fspan>\n      <span style=\"color:#0088b0\">08<\u002Fspan><span><strong>Identify residual tasking<\u002Fstrong> — cached URLs, configs, files usable after P2P isolation.<\u002Fspan>\n      <span style=\"color:#0088b0\">09<\u002Fspan><span><strong>Model sinkhole scale<\u002Fstrong> — how much controlled infrastructure, and how fast does peer state converge?<\u002Fspan>\n      <span style=\"color:#d6006c\">10<\u002Fspan><span><strong>Only then<\u002Fstrong> assess operational feasibility with appropriate legal and law-enforcement authorisation.<\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"keep\" style=\"margin:0 0 26px;padding-top:12px;border-top:1px solid #d6006c;max-width:38em\">\n      <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#d6006c;margin-bottom:6px\">Point 10 is not a formality<\u002Fdiv>\n      <p style=\"font-size:14.5px;line-height:1.55;margin:0\">CrowdStrike's technical work sat inside a coordinated multinational law-enforcement operation with DOJ, FBI, DCIS, Europol, Eurojust and three European national authorities. Actively manipulating third-party infected systems and seizing infrastructure is not something an organisation should replicate against a live botnet merely because the protocol permits it. P2PWNED's authors devoted a section to the ethics of unsolicited communication with infected hosts, and Symantec in 2012 called a public Sality removal plan <em>\"a definite no\"<\u002Fem> on exactly these grounds.<\u002Fp>\n    <\u002Fdiv>\n\n    <h3 style=\"font-size:20px;margin:26px 0 12px\">15.5 Defensive applicability<\u002Fh3>\n    <sc-raw-table class=\"table\" style=\"font-size:13.5px\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:22%\">Aspect<\u002Fsc-raw-th><sc-raw-th style=\"width:13%\">Applicability<\u002Fsc-raw-th><sc-raw-th style=\"width:14%\">Confidence<\u002Fsc-raw-th><sc-raw-th>Action<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td>Sinkhole telemetry<\u002Fsc-raw-td><sc-raw-td><strong>High<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>[F] High<\u002Fsc-raw-td><sc-raw-td>Alert on UDP to <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">188.166.101.148<\u002Fspan>. Any hit is a confirmed infection<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>YARA memory scanning<\u002Fsc-raw-td><sc-raw-td><strong>High<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>[F] High<\u002Fsc-raw-td><sc-raw-td>Deploy both published rules against running processes<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Final URL pack IOCs<\u002Fsc-raw-td><sc-raw-td><strong>High<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>[F] High<\u002Fsc-raw-td><sc-raw-td>Add the nine URLs to proxy and DNS blocklists; hunt historically<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Continued propagation<\u002Fsc-raw-td><sc-raw-td><strong>High<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>[A] Moderate<\u002Fsc-raw-td><sc-raw-td>Remediation urgency unchanged; symptoms now quieter<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>File-infector risk<\u002Fsc-raw-td><sc-raw-td><strong>High<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>[A] High<\u002Fsc-raw-td><sc-raw-td>EDR behavioural detection, file-integrity monitoring, control of SMB shares and removable media<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>OT and legacy estate<\u002Fsc-raw-td><sc-raw-td><strong>High<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>[A] Moderate<\u002Fsc-raw-td><sc-raw-td><span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">uxJLpe1m<\u002Fspan> inoculation and USB/autorun controls where EDR cannot run<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>PLC/HMI cracker campaign<\u002Fsc-raw-td><sc-raw-td><strong>High<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>[A] Moderate<\u002Fsc-raw-td><sc-raw-td>Engineer awareness and policy. Independent of the botnet<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr style=\"background:#fff1f4\"><sc-raw-td>Regional exposure sizing<\u002Fsc-raw-td><sc-raw-td><strong>Deferred<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>[A] Low<\u002Fsc-raw-td><sc-raw-td>2015 geography is too old to act on. Obtain CrowdStrike's per-country breakdown first<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Network traffic profiling<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><sc-raw-td>[A] Moderate<\u002Fsc-raw-td><sc-raw-td>Use the 14.4 decryption logic; widen the port range<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Replicating the takedown<\u002Fsc-raw-td><sc-raw-td>Low / N/A<\u002Fsc-raw-td><sc-raw-td>[A] High<\u002Fsc-raw-td><sc-raw-td>Needs protocol RE, sinkhole infrastructure and law-enforcement authority<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n  <\u002Fdiv>\n\n  <div style=\"break-before:page\">\n    <div style=\"font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0;margin-bottom:8px\">Section 16<\u002Fdiv>\n    <h2 style=\"font-size:32px;margin:0 0 18px;padding-bottom:12px;border-bottom:2px solid #201e1d\">Residual gaps<\u002Fh2>\n    <sc-raw-table class=\"table\" style=\"font-size:13.5px;margin-bottom:28px\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:48px\">#<\u002Fsc-raw-th><sc-raw-th style=\"width:34%\">Gap<\u002Fsc-raw-th><sc-raw-th>Status<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td>1<\u002Fsc-raw-td><sc-raw-td><strong>The exact eviction primitive<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Deliberately withheld. The 6.3 hypothesis is [A, Low]<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>2<\u002Fsc-raw-td><sc-raw-td>Current v3 / v4 split of the 15,000<\u002Fsc-raw-td><sc-raw-td>Not broken out<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>3<\u002Fsc-raw-td><sc-raw-td>URL pack sequence-ID jump (241→25202, 96→31010)<\u002Fsc-raw-td><sc-raw-td>Unexplained; v4 higher than v3 despite being smaller<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>4<\u002Fsc-raw-td><sc-raw-td>Whether the 2026 operator is the 2003 author<\u002Fsc-raw-td><sc-raw-td>[A, Low]. Not asserted by any source<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr style=\"background:#fff1f4\"><sc-raw-td>5<\u002Fsc-raw-td><sc-raw-td><strong>CrowdStrike's infection-geography figure<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Image only; per-country breakdown not in the text. <strong>Blocks any regional exposure claim.<\u002Fstrong> DOJ gives no geography either<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>6<\u002Fsc-raw-td><sc-raw-td>Population data 2016–2025<\u002Fsc-raw-td><sc-raw-td>None located. The decline curve is four measured points with a decade-wide hole<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>7<\u002Fsc-raw-td><sc-raw-td>Whether victim notification reaches ASEAN constituencies<\u002Fsc-raw-td><sc-raw-td>Pathway (ISPs plus CSIRTs) independently confirmed by DOJ. Regional delivery unevidenced — confirm with SingCERT<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>8<\u002Fsc-raw-td><sc-raw-td>Independent verification of the disruption's <strong>completeness and effect<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>DOJ corroborates that the operation happened and its shape, but states no infection count, no mechanism and no effectiveness claim. X-1 is discharged only in part<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>9<\u002Fsc-raw-td><sc-raw-td>The separate DOJ/FBI statement reported by Reuters as attributing Sality to Russia<\u002Fsc-raw-td><sc-raw-td>Not present in the CDCA release. Locate before repeating any government attribution<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>10<\u002Fsc-raw-td><sc-raw-td>Whether Sality was present on DoDIN or defence-contractor systems<\u002Fsc-raw-td><sc-raw-td>DCIS participation is framed around DoDIN protection, but no infection is stated<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>11<\u002Fsc-raw-td><sc-raw-td>Any charging document, complaint or seizure warrant<\u002Fsc-raw-td><sc-raw-td>None released. Without one, no attribution has been tested against an evidentiary standard<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n\n    <h3 style=\"font-size:20px;margin:24px 0 12px\">Known contradictions in the corpus<\u002Fh3>\n    <div style=\"display:grid;grid-template-columns:auto 1fr;gap:12px 16px;font-size:14.5px;line-height:1.5;max-width:38em\">\n      <span style=\"color:#0088b0\">—<\u002Fspan><span><strong>Payload signing.<\u002Fstrong> Kleissner (2015) says payloads carry no signature; Falliere (2011) says v4 signs and verifies. Resolution: the claim is v3-scoped (6.1).<\u002Fspan>\n      <span style=\"color:#0088b0\">—<\u002Fspan><span><strong>v4 TCP port.<\u002Fstrong> Falliere: UDP + 19. Kleissner: default 9673. Prefer Falliere; detect on both.<\u002Fspan>\n      <span style=\"color:#0088b0\">—<\u002Fspan><span><strong>Announcement port overwrite.<\u002Fstrong> Falliere frames it as a defence; P2PWNED frames identical behaviour as an attack primitive. Not a contradiction — a difference in adversarial reading (6.3).<\u002Fspan>\n      <span style=\"color:#0088b0\">—<\u002Fspan><span><strong>Operator singular versus plural.<\u002Fstrong> CrowdStrike (2026): a single criminal actor. Falliere (2011): \"the authors,\" \"the same gang.\" Unresolved (11.1).<\u002Fspan>\n      <span style=\"color:#0088b0\">—<\u002Fspan><span><strong>Simplified mechanism descriptions.<\u002Fstrong> Accounts describing crafted responses that cause bots to purge legitimate super peers are a simplification. Falliere shows the <em>server<\u002Fem> thread never modifies goodcounts, only the <em>client<\u002Fem> thread does — so spoofing malformed packets from known-good peers to tank reputation does <strong>not<\u002Fstrong> work.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"break-before:page\">\n    <div style=\"font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:#0088b0;margin-bottom:8px\">Section 17<\u002Fdiv>\n    <h2 style=\"font-size:32px;margin:0 0 18px;padding-bottom:12px;border-bottom:2px solid #201e1d\">Source list<\u002Fh2>\n\n    <h3 style=\"font-size:18px;margin:0 0 10px\">17.1 Primary sources — the disruption<\u002Fh3>\n    <sc-raw-table class=\"table\" style=\"font-size:12.5px;margin-bottom:22px\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:40px\">Ref<\u002Fsc-raw-th><sc-raw-th style=\"width:30%\">Source<\u002Fsc-raw-th><sc-raw-th>Value<\u002Fsc-raw-th><sc-raw-th style=\"width:24%\">Independence<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td><strong>E<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>CrowdStrike Counter Adversary Operations, <em>Peer Pressure: Inside the Sality Botnet Disruption Operation<\u002Fem>, 1 Sep 2026<\u002Fsc-raw-td><sc-raw-td><strong>Primary.<\u002Fstrong> Operation mechanics, partners, EggJagger economics, three DDoS campaigns, IOCs, YARA rules, lighthouse IP<\u002Fsc-raw-td><sc-raw-td>Vendor self-report on its own operation. See X-1<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><strong>F<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>DOJ / U.S. Attorney's Office, Central District of California, <em>Sality Malware Disrupted in International Cyber Takedown<\u002Fem>, release 26-149, 1 Sep 2026<\u002Fsc-raw-td><sc-raw-td><strong>Primary.<\u002Fstrong> Law-enforcement scope, named agencies and officials, Shadowserver notification pathway, policy framing. <strong>Makes no attribution claim<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>The only account not authored by the party that ran the operation.<\u002Fstrong> Partially discharges X-1<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n\n    <h3 style=\"font-size:18px;margin:22px 0 10px\">17.2 Primary sources — protocol and actor<\u002Fh3>\n    <sc-raw-table class=\"table\" style=\"font-size:12.5px;margin-bottom:22px\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:40px\">Ref<\u002Fsc-raw-th><sc-raw-th style=\"width:30%\">Source<\u002Fsc-raw-th><sc-raw-th>Value<\u002Fsc-raw-th><sc-raw-th style=\"width:24%\">Independence<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td><strong>A<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Falliere, N. <em>Sality: Story of a Peer-to-Peer Viral Network<\u002Fem>, Symantec Security Response, v1.0, July 2011<\u002Fsc-raw-td><sc-raw-td><strong>Primary technical.<\u002Fstrong> Full protocol reverse-engineering, packet format, client-thread flowcharts (Figures 4, 6, 10, 11), RSA public keys (Annex B), AV target and packet-filter lists (Annex A)<\u002Fsc-raw-td><sc-raw-td>Independent of E; predates it by 15 years<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><strong>B<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Rossow, Andriesse, <strong>Werner<\u002Fstrong>, Stone-Gross, Plohmann, Dietrich, Bos. <em>SoK: P2PWNED — Modeling and Evaluating the Resilience of Peer-to-Peer Botnets<\u002Fem>, IEEE S&amp;P 2013<\u002Fsc-raw-td><sc-raw-td>Formal resilience model; the announcement port-overwrite eviction primitive; crawling versus sensor population methodology; takedown ethics<\u002Fsc-raw-td><sc-raw-td>Peer-reviewed. <strong>Shares an author with E and I<\u002Fstrong> — not fully independent<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><strong>C<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Kleissner, P. <em>Sality 2003 – Today<\u002Fem>, Botconf 2015, Paris<\u002Fsc-raw-td><sc-raw-td>Author attribution strings; network 3/4 population tables (Jul 2014, Sep 2015); URL pack corpus; payload RC4 key; anti-researcher DDoS record<\u002Fsc-raw-td><sc-raw-td>Independent of E. Conference deck, not peer-reviewed<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><strong>D<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>CrowdStrike, <em>Who is SALTY SPIDER (Sality)?<\u002Fem>, 6 Sep 2019<\u002Fsc-raw-td><sc-raw-td>Bashkortostan attribution, aliases, 2017 cryptocurrency pivot, EternalBlue, v3/v4 regional skew<\u002Fsc-raw-td><sc-raw-td>Same vendor as E<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><strong>D2<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>CrowdStrike, <em>SALTY SPIDER<\u002Fem> adversary profile<\u002Fsc-raw-td><sc-raw-td>Standing actor profile<\u002Fsc-raw-td><sc-raw-td>Same vendor as E<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><strong>L<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Malpedia (Fraunhofer FKIE), <em>win.sality<\u002Fem> and <em>SALTY SPIDER<\u002Fem><\u002Fsc-raw-td><sc-raw-td>Family and actor reference, cross-vendor naming<\u002Fsc-raw-td><sc-raw-td>Independent aggregator<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n\n    <h3 style=\"font-size:18px;margin:22px 0 10px\">17.3 Technical corroboration<\u002Fh3>\n    <sc-raw-table class=\"table\" style=\"font-size:12.5px;margin-bottom:22px\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:40px\">Ref<\u002Fsc-raw-th><sc-raw-th style=\"width:30%\">Source<\u002Fsc-raw-th><sc-raw-th>Value<\u002Fsc-raw-th><sc-raw-th style=\"width:24%\">Independence<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td><strong>I<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Werner, T. <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12px\">sality-dissector<\u002Fspan> — Wireshark/Lua dissector<\u002Fsc-raw-td><sc-raw-td>Confirms the three message types on the wire; directly usable for detection engineering<\u002Fsc-raw-td><sc-raw-td>Same author as B and E<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><strong>K<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>F-Secure, <em>Virus:W32/Sality.Q<\u002Fem><\u002Fsc-raw-td><sc-raw-td>EPO byte counts — <strong>variant-specific to Sality.Q, do not generalise<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Independent<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><strong>M<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Bournemouth University CERT, <em>Sality rootkit analysis<\u002Fem><\u002Fsc-raw-td><sc-raw-td><span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12px\">amsint32<\u002Fspan> driver, device names, size and targeting<\u002Fsc-raw-td><sc-raw-td>Independent<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><strong>N<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Kaspersky Threats, <em>Virus.Win32.Sality<\u002Fem><\u002Fsc-raw-td><sc-raw-td>First detection July 2003; polymorphic decryptor and modular payload structure<\u002Fsc-raw-td><sc-raw-td>Independent<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n\n    <h3 style=\"font-size:18px;margin:22px 0 10px\">17.4 Victimology and sector exposure<\u002Fh3>\n    <sc-raw-table class=\"table\" style=\"font-size:12.5px;margin-bottom:22px\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:40px\">Ref<\u002Fsc-raw-th><sc-raw-th style=\"width:30%\">Source<\u002Fsc-raw-th><sc-raw-th>Value<\u002Fsc-raw-th><sc-raw-th style=\"width:24%\">Independence<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td><strong>H<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Dragos, <em>The Trojan Horse Malware &amp; Password \"Cracking\" Ecosystem Targeting Industrial Operators<\u002Fem><\u002Fsc-raw-td><sc-raw-td>PLC/HMI cracker delivery vector, CVE-2022-2003, AV-update-blocking and its CIP-007-6 consequence<\u002Fsc-raw-td><sc-raw-td>Independent vendor research with a CVE and a vendor firmware fix<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><strong>H2<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>BleepingComputer, <em>Password recovery tool infects industrial systems with Sality malware<\u002Fem>, Jul 2022<\u002Fsc-raw-td><sc-raw-td>Reporting on H; affected vendor list<\u002Fsc-raw-td><sc-raw-td>Reports H<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><strong>O<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Dark Reading, coverage of the Dragos MIMICS project<\u002Fsc-raw-td><sc-raw-td>Sality prevalence in ICS environments (1,225 detections). <strong>MIMICS dates to the 2017 SANS ICS Summit — historical<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Reports Dragos<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><strong>P<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>The Fintech Times, LookingGlass bot-infection reporting, Mar 2022<\u002Fsc-raw-td><sc-raw-td>Sector percentages (13% financial services, 11.87% energy). <strong>Vendor marketing; methodology and denominator unpublished<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Reports LookingGlass<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n\n    <h3 style=\"font-size:18px;margin:22px 0 10px\">17.5 Precedent, comparison and ethics<\u002Fh3>\n    <sc-raw-table class=\"table\" style=\"font-size:12.5px;margin-bottom:22px\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:40px\">Ref<\u002Fsc-raw-th><sc-raw-th style=\"width:30%\">Source<\u002Fsc-raw-th><sc-raw-th>Value<\u002Fsc-raw-th><sc-raw-th style=\"width:24%\">Independence<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td><strong>J1<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>CrowdStrike, <em>GameOver Zeus<\u002Fem> disruption<\u002Fsc-raw-td><sc-raw-td>2014 precedent — peer-list control plus DGA and backend neutralisation<\u002Fsc-raw-td><sc-raw-td>Same vendor as E<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><strong>J2<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>CrowdStrike, <em>Inside the Takedown of ZOMBIE SPIDER and the Kelihos Botnet<\u002Fem><\u002Fsc-raw-td><sc-raw-td>2017 precedent — peer-list poisoning against unprotected membership information<\u002Fsc-raw-td><sc-raw-td>Same vendor as E<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td><strong>J3<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>CrowdStrike, <em>Disrupting Glassworm<\u002Fem>, May 2026<\u002Fsc-raw-td><sc-raw-td><strong>The contrast case.<\u002Fstrong> Four parallel C2 channels including blockchain and BitTorrent DHT, all requiring simultaneous disruption<\u002Fsc-raw-td><sc-raw-td>Same vendor as E<\u002Fsc-raw-td><\u002Fsc-r
